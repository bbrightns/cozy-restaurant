    const p = PAL[id][i], [mainRole, accentRole] = VARIANTS[id].sw;
    const main = hexOf(p[mainRole]), accent = hexOf(p[accentRole]);
    if (p.pattern === 'gingham') return 'repeating-linear-gradient(90deg, ' + main + '99 0 6px, transparent 6px 12px), repeating-linear-gradient(0deg, ' + main + '99 0 6px, ' + accent + ' 6px 12px)';
    if (p.pattern === 'dots') return 'radial-gradient(' + hexOf(p.cream) + ' 26%, transparent 29%) 0 0 / 12px 12px, ' + main;
    if (p.pattern === 'stripes') return 'repeating-linear-gradient(90deg, ' + main + ' 0 7px, ' + accent + ' 7px 11px)';
    return 'linear-gradient(135deg, ' + main + ' 0 62%, ' + accent + ' 62%)';
  }
  /* The design row follows the furniture: a chosen type (about to place) or a selected piece
     (restyle). Each design has its own price. */
  function renderVariantPop() {
    const id = selected && !drag ? (VARIANTS[selected.id] ? selected.id : '') : (VARIANTS[tool] ? tool : '');
    variantPop.hidden = !id;
    if (!id) return;
    if (variantFor !== id) {
      variantFor = id;
      variantRow.textContent = '';
      VARIANTS[id].list.forEach((v, i) => {
        const b = makeDesign(variantSwatchCss(id, i), nameOf(id) + ' design: ' + v.name, priceOfItem(id, i));
        b.addEventListener('click', () => setVariant(i));
        variantRow.appendChild(b);
      });
    }
    variantHead.textContent = nameOf(id) + ' designs';
    const cur = selected ? selected.variant | 0 : nextVariant[id] | 0;
    Array.from(variantRow.children).forEach((b, i) => b.setAttribute('aria-pressed', i === cur ? 'true' : 'false'));
  }
  /* With a type chosen, a design sets what the next placement uses and is paid for when placed.
     With a piece selected, a different design is bought now and replaces the old one. */
  function setVariant(i) {
    const it = selected;
    if (!it) {
      if (!VARIANTS[tool]) return;
      nextVariant[tool] = i;
      updateContext();
      announce(VARIANTS[tool].list[i].name + ' ' + nameOf(tool).toLowerCase() + ' selected, ' + (priceOfItem(tool, i) ? priceOfItem(tool, i) + ' coins' : 'free') + '.');
      return;
    }
    if (!VARIANTS[it.id]) return;
    if ((it.variant | 0) !== i) {
      const price = priceOfItem(it.id, i);
      if (!spend(price, designName(it.id, i))) return;
      it.variant = i;
      if (!reduced) { it.born = performance.now(); it.anim = 'wobble'; }
      const [w, d] = dims(it.id, it.rot);
      spendPop(it.x + w / 2, it.y + d / 2, CATALOG[it.id].h, price);
      saveSoon();
      announce(nameOf(it.id) + ' is now ' + VARIANTS[it.id].list[i].name + (price ? ' for ' + price + ' coins' : '') + '.');
    }
    nextVariant[it.id] = i;
    renderVariantPop();
  }

  /* ---------------- shop name ---------------- */
  let nameBefore = '';
  function renderName() {
    nameBtn.textContent = shopName;
    nameBtn.setAttribute('aria-label', 'Shop name: ' + shopName + '. Tap to edit.');
    document.title = shopName;
  }
  function editName() {
    nameBefore = shopName;
    nameInput.value = shopName;
    nameBtn.hidden = true;
    nameInput.hidden = false;
    nameInput.focus();
    nameInput.select();
  }
  function onNameInput() {
    if (nameInput.composing) return;   // let Thai and other IMEs finish a cluster first
    const v = clipName(nameInput.value);
    if (v !== nameInput.value) nameInput.value = v;
    const t = v.trim();
    if (t) { shopName = t; renderName(); saveSoon(); }
  }
  function endEditName(keep) {
    if (nameInput.hidden) return;
    shopName = keep ? cleanName(nameInput.value) : nameBefore;
    nameInput.hidden = true;
    nameBtn.hidden = false;
    renderName();
    saveSoon();
    if (keep && shopName !== nameBefore) announce('Shop renamed to ' + shopName + '.');
  }
  nameBtn.addEventListener('click', editName);
  nameInput.addEventListener('compositionstart', () => { nameInput.composing = true; });
  nameInput.addEventListener('compositionend', () => { nameInput.composing = false; onNameInput(); });
  nameInput.addEventListener('input', onNameInput);
  nameInput.addEventListener('blur', () => endEditName(true));
  nameInput.addEventListener('keydown', (e) => {
    e.stopPropagation();   // keep game shortcuts (R, 1-7, Delete) out of the text field
    if (e.key === 'Enter') { e.preventDefault(); endEditName(true); nameBtn.focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); endEditName(false); nameBtn.focus(); }
  });

  function renderLevel() {
    const pct = level >= MAX_LEVEL ? 100 : Math.round(xp / xpNeed(level) * 100);
    levelRead.innerHTML = '<b>Lv ' + level + '</b><small>' + N + '×' + N + ' room</small><span class="xp-bar" role="img" aria-label="' + (level >= MAX_LEVEL ? 'Max level' : xp + ' of ' + xpNeed(level) + ' xp') + '"><i style="width:' + pct + '%"></i></span>';
    lvDown.disabled = level <= 1;
    lvUp.disabled = level >= MAX_LEVEL;
  }

  // ===== LOOP =====
  /* ================================================================
     Loop
     ================================================================ */
  let last = 0, raf = 0, hudTimer = 0;
  function tick(now) {
    raf = requestAnimationFrame(tick);
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 1 / 60;
    last = now;
    updateLight(dt);
    updateCamera(dt);
    updateEffects(dt);
    simUpdate(dt);
    frame(now, dt);
    hudTimer -= dt;
    if (hudTimer <= 0) { hudTimer = 0.5; updateClock(); }
  }
  function updateClock() {
    updateMoneyHud();
    const h = light.hour;
    const live = PREVIEWS[previewIdx] === null;
    let txt;
    if (live) {
      const d = new Date();
      txt = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    } else {
      const p = PREVIEWS[previewIdx];
      txt = String(p).padStart(2, '0') + ':00';
    }
    if (clockEl.firstChild.nodeValue !== txt) clockEl.firstChild.nodeValue = txt;
    const ph = phaseName(live ? h : PREVIEWS[previewIdx]) + (live ? '' : ' preview');
    if (phaseEl.textContent !== ph) phaseEl.textContent = ph;
    dialHand.setAttribute('transform', 'rotate(' + ((h / 24) * 360 - 180).toFixed(1) + ' 15 15)');
  }
  function start() { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stop(); save(); } else start(); });

  // ===== INPUT =====
  /* ================================================================
     Input: tap to place, drag items to move, drag floor to pan,
     long-press / right-click to remove, wheel / pinch to zoom
     ================================================================ */
  const pointers = new Map();
  let gesture = null;
  let longTimer = 0;

  function beginDrag(hit, sx, sy) {
    const [fx, fy] = floorAt(sx, sy, hit.z);
    drag = { item: hit.item, offX: Math.floor(fx) - hit.item.x, offY: Math.floor(fy) - hit.item.y, grabZ: hit.z, tx: hit.item.x, ty: hit.item.y, reason: '' };
    selected = hit.item;
    updateContext();
    world.classList.add('grabbing');
  }
  function updateDrag(sx, sy) {
    const [fx, fy] = floorAt(sx, sy, drag.grabZ);
    const tx = Math.floor(fx) - drag.offX, ty = Math.floor(fy) - drag.offY;
    drag.tx = tx; drag.ty = ty;
    drag.reason = tx === drag.item.x && ty === drag.item.y ? '' : checkPlace({ id: drag.item.id, x: tx, y: ty, rot: drag.item.rot }, drag.item);
  }

  world.addEventListener('pointerdown', (e) => {
    try { world.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      clearTimeout(longTimer);
      if (drag) { drag = null; world.classList.remove('grabbing'); }
      const [a, b] = Array.from(pointers.values());
      gesture = { mode: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      return;
    }
    if (pointers.size > 2) return;
    gesture = { mode: 'tap', sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, button: e.button, hit: null, done: false };
    if (tool === 'move' && e.button === 0) gesture.hit = itemAt(e.clientX, e.clientY);
    if (e.pointerType !== 'mouse' && tool !== 'paint') {
      longTimer = setTimeout(() => {
        if (!gesture || gesture.mode !== 'tap') return;
        const h = itemAt(gesture.sx, gesture.sy);
        if (h) removeItem(h.item);
        gesture.done = true;
      }, 550);
    }
  });
  world.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse') {
      const t = tileAt(e.clientX, e.clientY);
      hover.show = !!t;
      if (t) { hover.x = t[0]; hover.y = t[1]; }
      kbd.show = false;
      if (tool === 'paint' && paint && paint.kind === 'wall') {
        const w = wallAt(e.clientX, e.clientY);
        hoverWall.show = !!w && w.i < N;
        if (w) { hoverWall.side = w.side; hoverWall.i = w.i; }
        kwall.show = false;
      }
    }
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!gesture) return;
    if (gesture.mode === 'pinch' && pointers.size >= 2) {
      const [a, b] = Array.from(pointers.values());
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      cam.anim = null;
      cam.x += mx - gesture.mx; cam.y += my - gesture.my;
      zoomAt(mx, my, d / (gesture.d || d));
      gesture.d = d; gesture.mx = mx; gesture.my = my;
      return;
    }
    if (gesture.mode === 'tap' && !gesture.done && Math.hypot(e.clientX - gesture.sx, e.clientY - gesture.sy) > 7) {
      clearTimeout(longTimer);
      if (gesture.hit) { gesture.mode = 'drag'; beginDrag(gesture.hit, gesture.sx, gesture.sy); }
      else { gesture.mode = 'pan'; world.classList.add('grabbing'); }
    }
    if (gesture.mode === 'drag' && drag) updateDrag(e.clientX, e.clientY);
    if (gesture.mode === 'pan') {
      cam.user = true;
      cam.anim = null;
      cam.x += e.clientX - gesture.lx;
      cam.y += e.clientY - gesture.ly;
      gesture.lx = e.clientX; gesture.ly = e.clientY;
    }
  });
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    clearTimeout(longTimer);
    world.classList.remove('grabbing');
    if (!gesture) return;
    const up = e.type === 'pointerup';
    if (gesture.mode === 'drag' && drag) {
      if (up) {
        if (drag.reason) { toast(REASON[drag.reason]); announce(REASON[drag.reason] + '.'); }
        else moveItem(drag.item, drag.tx, drag.ty);
      }
      drag = null;
      updateContext();
    } else if (gesture.mode === 'tap' && up && !gesture.done) {
      handleTap(e.clientX, e.clientY, gesture.button, gesture.hit);
    }
    if (pointers.size === 0) gesture = null;
    else if (gesture.mode === 'pinch') {
      const p = Array.from(pointers.values())[0];
      gesture = { mode: 'pan', lx: p.x, ly: p.y };
    }
  }
  function handleTap(sx, sy, button, hit) {
    if (button === 2) {
      if (tool === 'paint') return;
      const h = itemAt(sx, sy);
      if (h) removeItem(h.item);
      return;
    }
    // each tap paints one wall piece or floor tile
    if (tool === 'paint' && paint) {
      if (paint.kind === 'wall') {
        const w = wallAt(sx, sy);
        if (w && w.i < N) paintAt(w);
      } else {
        const t = tileAt(sx, sy);
        if (t) paintAt({ x: t[0], y: t[1] });
      }
      return;
    }
    // tapping a table with dirty plates clears them, whatever the tool (except Remove)
    if (tool !== 'remove') {
      const h = hit || itemAt(sx, sy);
      if (h && h.item.id === 'table_01' && clearPlates(h.item)) return;
    }
    if (tool === 'move') {
      if (hit) select(selected === hit.item ? null : hit.item);
      else if (selected) select(null);
      return;
    }
    if (tool === 'remove') {
      const h = itemAt(sx, sy);
      if (h) removeItem(h.item);
      return;
    }
    const t = tileAt(sx, sy);
    if (t) placeAt(t[0], t[1]);
  }
  world.addEventListener('pointerup', endPointer);
  world.addEventListener('pointercancel', endPointer);
  world.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { hover.show = false; hoverWall.show = false; } });
  world.addEventListener('contextmenu', (e) => e.preventDefault());
  world.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, Math.exp(-clamp(e.deltaY, -120, 120) * 0.0016));
  }, { passive: false });

  for (const b of toolBtns) b.addEventListener('click', () => selectTool(b.dataset.tool, true));
  ctxRotate.addEventListener('click', rotate);
  rotateBtn.addEventListener('click', rotate);
  ctxRemove.addEventListener('click', () => { if (selected) removeItem(selected); });
  ctxDone.addEventListener('click', () => {
    if (tool === 'paint') selectTool('move', true); else select(null);
    world.focus({ preventScroll: true });
  });
  statsBtn.addEventListener('click', () => setBreakdown(breakdownEl.hidden));
  bdClose.addEventListener('click', () => { setBreakdown(false); statsBtn.focus(); });
  lvDown.addEventListener('click', () => setLevel(level - 1));
  lvUp.addEventListener('click', () => setLevel(level + 1));
  previewBtn.addEventListener('click', () => {
    previewIdx = (previewIdx + 1) % PREVIEWS.length;
    const live = previewIdx === 0;
    previewLbl.textContent = PREVIEW_NAMES[previewIdx];
    previewBtn.setAttribute('aria-pressed', live ? 'false' : 'true');
    const next = PREVIEW_NAMES[(previewIdx + 1) % PREVIEWS.length];
    previewBtn.setAttribute('aria-label', (live ? 'Sky follows your clock.' : 'Previewing ' + PREVIEW_NAMES[previewIdx].toLowerCase() + '.') + ' Tap for ' + (next === 'Live' ? 'live clock' : next.toLowerCase()) + '.');
    toast(live ? 'Back to your real clock' : 'Previewing ' + PREVIEW_NAMES[previewIdx].toLowerCase());
    updateClock();
  });

  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k >= '1' && k <= '7') {
      const name = TOOL_ORDER[+k - 1];
      selectTool(name, true);
      if (tab !== TAB_OF[name]) setTab(TAB_OF[name]);
      return;
    }
    if (k === '+' || k === '=') { zoomAt(W / 2, H / 2, 1.15); return; }
    if (k === '-' || k === '_') { zoomAt(W / 2, H / 2, 1 / 1.15); return; }
    if (k === 'r' || k === 'R') { rotate(); return; }
    if (k === 'Escape') {
      if (!breakdownEl.hidden) { setBreakdown(false); statsBtn.focus(); }
      else if (openSheet()) closeSheet();
      else if (tool === 'paint') selectTool('move', true);
      else select(null);
      return;
    }
    if (document.activeElement !== world) return;
    const moves = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
    if (tool === 'paint' && paint && paint.kind === 'wall') {
      // walls: left and right walk along the wall, up and down switch between the two walls
      if (moves[k]) {
        e.preventDefault();
        kwall.show = true; hoverWall.show = false; hover.show = false; kbd.show = false;
        if (k === 'ArrowLeft' || k === 'ArrowRight') kwall.i = clamp(kwall.i + (k === 'ArrowRight' ? 1 : -1), 0, N - 1);
        else kwall.side = kwall.side === 'A' ? 'B' : 'A';
        kwall.i = Math.min(kwall.i, N - 1);
        announce(wallName(kwall.side, kwall.i) + ': ' + wallSeg(kwall.side, kwall.i).name + '.');
      } else if (k === 'Enter' || k === ' ') {
        e.preventDefault();
        if (!hoverWall.show) kwall.show = true;
        paintAt(paintTarget());
      }
      return;
    }
    if (tool === 'paint' && paint && (k === 'Enter' || k === ' ')) {
      e.preventDefault();
      if (!hover.show) kbd.show = true;
      paintAt(paintTarget());
      return;
    }
    if (moves[k]) {
      e.preventDefault();
      kbd.show = true; hover.show = false;
      kbd.x = clamp(kbd.x + moves[k][0], 0, N - 1);
      kbd.y = clamp(kbd.y + moves[k][1], 0, N - 1);
      const it = itemOnTile(kbd.x, kbd.y);
      announce('Tile ' + (kbd.x + 1) + ', ' + (kbd.y + 1) + ': ' + (it ? nameOf(it.id) : kbd.x === DOOR.x && kbd.y === DOOR.y ? 'doorway' : 'empty') + '.');
    } else if (k === 'Enter' || k === ' ') {
      e.preventDefault();
      kbd.show = true;
      const it = itemOnTile(kbd.x, kbd.y);
      if (tool !== 'remove' && it && it.id === 'table_01' && clearPlates(it)) return;
      if (tool === 'move') {
        if (it) select(selected === it ? null : it);
        else if (selected) moveItem(selected, kbd.x, kbd.y);
      } else if (tool === 'remove') removeItem(it);
      else placeAt(kbd.x, kbd.y);
    } else if (k === 'Delete' || k === 'Backspace') {
      e.preventDefault();
      removeItem(selected || itemOnTile(kbd.x, kbd.y));
    }
  });
  world.addEventListener('focus', () => { if (!hover.show) kbd.show = true; });
  world.addEventListener('blur', () => { kbd.show = false; });

  window.addEventListener('resize', resize);
  if (reduceMQ.addEventListener) reduceMQ.addEventListener('change', (e) => { reduced = e.matches; });
  window.addEventListener('pagehide', save);

  /* read-only test hook, only with ?debug in the URL */
  if (DEBUG) {
    lvDown.hidden = false;
    lvUp.hidden = false;
    window.cozyDebug = {
      screenOf: (x, y, z) => [cam.x + PX(x, y) * cam.zoom, cam.y + PY(x, y, z || 0) * cam.zoom],
      // centre of a wall piece on screen: side 'A' (right wall, along x) or 'B' (left wall, along y)
      wallScreen: (side, i) => {
        const p = side === 'A' ? [i + 0.5, 0] : [0, i + 0.5];
        return [cam.x + PX(p[0], p[1]) * cam.zoom, cam.y + PY(p[0], p[1], 40) * cam.zoom];
      },
      state: () => ({
        name: shopName, decor: decorSnapshot(), tool, paint: paint && Object.assign({}, paint), bill: Object.assign({}, bill), devMode: DEV_MODE, menu: menu.map((m) => Object.assign({}, m)), slots: menuSlots(), N, level, xp, xpNeed: xpNeed(level), coins, rating, recent: recent.slice(), topReason: topReason(), economy: economy(),
        stats: Object.assign({}, stats), orders: orders.length, ready: ready.length,
        staff: staff.map((p) => ({ id: p.id, role: p.role, tier: p.tier, name: p.name, speed: speedOf(p), wage: wageOf(p), busy: +(p.busy || 0).toFixed(2),
          home: p.home && p.home.slice(), x: +bodyOf(p).x.toFixed(2), y: +bodyOf(p).y.toFixed(2), job: p.job ? p.job.kind : null, carrying: !!bodyOf(p).carry, cooking: bodyOf(p).cooking })),
        leavers: leavers.length,
        candidates: candidates.map((p) => ({ id: p.id, role: p.role, tier: p.tier, name: p.name, fee: hireFee(p) })), staffCap: staffCap(),
        items: items.map((it) => ({ id: it.id, x: it.x, y: it.y, rot: it.rot, variant: it.variant, occupied: !!it.occupant, plate: it.plate ? it.plate.state : null, cooking: !!it.cook })),
        customers: customers.map((c) => ({ state: c.state, x: +c.x.toFixed(2), y: +c.y.toFixed(2), seat: c.seat ? [c.seat.x, c.seat.y] : null, bubble: c.bubble ? c.bubble.type : null }))
      })
    };
  }

  // ===== START =====
  /* ================================================================
     Start
     ================================================================ */
  if (!load()) {
    level = 1;
    N = gridFor(level);
    coins = shownCoins = START_COINS;
    staff = starterCrew();
    adoptItems(defaultLayout(), true);
    save();
  }
  staffOnLayout();       // stations for the saved team; everyone starts at their spot
  renderName();
  buildDecorRow();
  renderLevel();
  resize();
  const savedTab = store.get(TAB_KEY);
  setTab(tabBtns.some((b) => b.dataset.tab === savedTab) ? savedTab : 'furniture');
  fitCamera();
  selectTool('move', false);
  updateLight(0);
  updateClock();
  start();
})();
</script>
</body>
</html>
