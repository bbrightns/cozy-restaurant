      c.path.shift();
      if (!c.path.length) { c.moving = false; return true; }
      return false;
    }
    c.x += (dx / d) * s;
    c.y += (dy / d) * s;
    return false;
  }

  function claim(c, ch) {
    ch.occupant = c;
    c.seat = ch;
    c.table = seatTable(ch);
    c.rec = ch.x + ',' + ch.y + ',' + ch.rot;
  }
  function release(c) {
    if (c.seat && c.seat.occupant === c) c.seat.occupant = null;
    c.seat = null;
    c.table = null;
    c.seated = false;
  }
  const freeDining = () => chairs().filter((ch) => !ch.occupant && !ch.plate && seatTable(ch));
  const freeWaiting = () => chairs().filter((ch) => !ch.occupant && !seatTable(ch));
  function noSeatReason() {
    return chairs().some((ch) => !ch.occupant && ch.plate && ch.plate.state === 'dirty' && seatTable(ch)) ? 'plate' : 'chair';
  }
  function trySeat(c, list) {

  }
  function bubble(c, type, dur) { c.bubble = { type, t: 0, dur }; }

  /* outcome: 'happy', a reason key ('trash' | 'chair' | 'plate' | 'clock'), or null to leave quietly */
  function depart(c, outcome) {

    ready = ready.filter((r) => r.cust !== c);

    for (const p of staff) if (p.job && p.job.cust === c) p.job.cust = null;

  }
  /* satisfaction moves the rating slowly, never in sudden drops (project.md 6.1) */
  let rating = 50;                     // 0..100, shown as 0..5 stars
  let recent = [];                     // last outcomes, for the "top reason" hint
  function ratingCap() { return Math.min(100, 50 + level * 2 + decorValue() * 0.5); }
  function recordOutcome(outcome) {
    if (outcome === 'happy') {
      stats.served++;
      rating = Math.min(ratingCap(), rating + 1.2);
    } else {
      stats.left++;
      rating = Math.max(0, rating - 1.6);
    }
    recent.push(outcome);
    if (recent.length > 20) recent.shift();
    saveSoon();
  }
  function topReason() {
    const n = {};
    for (const r of recent) if (r !== 'happy') n[r] = (n[r] || 0) + 1;
    let best = null;
    for (const k in n) if (!best || n[k] > n[best]) best = k;
    return best;
  }

  /* ---------------- economy, project.md 8.1 ---------------- */
  const BASE_ARRIVAL = 3;          // guests per minute at appeal 1 and rating factor 1
  const APPEAL_SCALE = 40;
  const SEAT_TURNOVER = 2.5;       // guests per dining seat per minute
  const PRICE_ELASTICITY = 1.2;    // guests lost per unit of price above the suggestion
  const DIRT_PENALTY = 0.5;
  const NIGHT_BONUS_PER_LIGHT = 5;
  const APPEAL = { table_01: 2, chair_01: 1, counter_01: 3, plant_01: 4, lantern_01: 3 };
  function decorValue() { return items.reduce((s, it) => s + (APPEAL[it.id] || 0), 0); }
  function economy() {
    const decor = decorValue();
    const curbAppeal = 0;            // storefront arrives in Phase 4
    const lights = items.filter((it) => CATALOG[it.id].light).length;
    const nightBonus = lights * NIGHT_BONUS_PER_LIGHT * light.night;
    const appeal = 1 + (decor + curbAppeal + nightBonus) / APPEAL_SCALE;
    const ratingFactor = 0.5 + rating / 100;
    // menu: guests pick dishes evenly, so plain averages over the dishes on sale
    const on = activeMenu();
    const avg = (f) => on.reduce((s, m) => s + f(m), 0) / on.length;
    const avgMenuPrice = avg((m) => m.price), avgCost = avg((m) => m.dish.cost);
    const avgSuggest = avg((m) => m.dish.suggest), avgCook = avg((m) => m.dish.cook);
    const priceRatio = avgMenuPrice / avgSuggest;

    const chefSpeeds = staffOf('chef').map(speedOf).sort((a, b) => b - a);
    const chefs = chefSpeeds.length;
    const chefPower = chefSpeeds.slice(0, kitchens).reduce((s, v) => s + v, 0);

    else if (!kitchens) hint = 'Add a counter so the kitchen can cook';
    else if (!chefs) hint = 'Hire a chef so the kitchen can cook';
    else if (!servePower) hint = 'Hire a waiter to carry plates';

    return { decor, curbAppeal, nightBonus, appeal, ratingFactor, priceRatio, priceFactor, arrivalRate, seats, kitchens, chefs, waiters, helpers, chefPower, servePower, servesPerChef, seatCap, kitchenCap, serviceCap, capacity, served, avgMenuPrice, avgCost, avgCook, margin, cleanFactor, wagesPerMin, incomePerMin, hint };
  }
  function pay(c) {

    saveSoon();
    if (c.seat && c.seat.plate) { c.seat.plate.state = 'dirty'; c.seat.plate.eaten = 1; }
    depart(c, 'happy');
    addXp(xpForGuest(c.dish));
    announce('A guest paid ' + c.price + ' coins for ' + c.dish.name + ', ' + price + ' after costs.');
  }

  function plateSpot(ch) {
    const t = seatTable(ch);

  }

      ch.plate = null;

  function updateCustomer(c, dt) {
    c.t += dt;

    switch (c.state) {

  /* each counter is cooked at by the chef stationed beside it (assignStations), only while that chef stands there */
  function updateKitchen(dt) {

    c.state = 'eating';
    c.t = 0;

  }

  function simUpdate(dt) {
    // arrivals follow arrivalRate from the income formula, so the live shop matches the estimate
    spawnTimer -= dt;
    if (spawnTimer <= 0) {

      const room = chairs().length + 3;

    updateStaff(dt);

      coinIcon.classList.remove('bump');
      void coinIcon.getBoundingClientRect();
      coinIcon.classList.add('bump');

  }

  /* layout edits: guests whose seat moved or vanished leave quietly, walkers re-path */
  function simOnLayout() {
    for (const ch of chairs()) if (ch.plate && ch.plate.table !== seatTable(ch)) ch.plate = null;
    for (const c of customers.slice()) {

        const ch = c.seat;
        const same = items.includes(ch) && c.rec === ch.x + ',' + ch.y + ',' + ch.rot && seatTable(ch) === c.table;
        if (!same) { depart(c, null); continue; }
        if (c.state === 'toSeat') walkTo(c, ch.x, ch.y);
      } else if (c.state === 'leaving' && c.path.length) walkTo(c, DOOR.x, DOOR.y);
    }
    for (const c of customers) {
      if (c.state === 'waitFood' && !orders.includes(c) && !ready.some((r) => r.cust === c) && !items.some((it) => it.cook && it.cook.cust === c)) orders.unshift(c);
    }

  }

  /* coins arcing from a guest up into the HUD counter (screen space) */
  function drawCoinFlights() {
    if (!coinFlights.length) return;
    const r = coinIcon.getBoundingClientRect();
    const tx = r.left + r.width / 2, ty = r.top + r.height / 2;
    for (const f of coinFlights) {
      if (f.t < 0) continue;
      const t = f.t, e = t * t;
      const cx = (f.sx + tx) / 2, cy = Math.min(f.sy, ty) - 80;
      const x = (1 - e) * (1 - e) * f.sx + 2 * (1 - e) * e * cx + e * e * tx;
      const y = (1 - e) * (1 - e) * f.sy + 2 * (1 - e) * e * cy + e * e * ty;
      const s = 1 - t * 0.3;
      ctx.fillStyle = '#e9b44c';
      ctx.beginPath(); ctx.arc(x, y, 8 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f6d27a';
      ctx.beginPath(); ctx.arc(x, y, 5.8 * s, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* ---------------- money HUD and income breakdown ---------------- */
  const fmt = (n) => Math.round(n).toLocaleString('en-US');
  const REASON_TEXT = { chair: 'there was no free seat', plate: 'only dirty tables were left', clock: 'the food took too long', trash: 'there was too much trash' };
  function starsHtml(r) {
    const n = Math.round(r / 10) / 2;
    return '<span class="stars" role="img" aria-label="' + n + ' of 5 stars">★★★★★<i style="width:' + clamp(r, 0, 100).toFixed(0) + '%">★★★★★</i></span>';
  }
  function updateMoneyHud() {
    const e = economy();
    refreshAfford();
    coinRead.textContent = fmt(shownCoins);
    const inc = (e.incomePerMin >= 0 ? '+' : '') + fmt(e.incomePerMin) + '/min';
    rateRead.textContent = inc;
    statsBtn.setAttribute('aria-label', fmt(coins) + ' coins, estimated income ' + fmt(e.incomePerMin) + ' coins per minute. ' + (breakdownEl.hidden ? 'Show' : 'Hide') + ' breakdown.');
    if (breakdownEl.hidden) return;
    const row = (label, sub, val, cls) => {
      const c = cls ? ' class="' + cls + '"' : '';
      return '<dt' + c + '>' + label + (sub ? '<small>' + sub + '</small>' : '') + '</dt><dd' + c + '>' + val + '</dd>';
    };
    const n1 = (v) => v.toFixed(1);
    const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
    bdTotal.textContent = inc.replace('/min', ' coins/min');
    bdRows.innerHTML =
      row('Appeal', 'decor ' + e.decor + (e.nightBonus >= 0.5 ? ' + night lights ' + fmt(e.nightBonus) : '') + ', scale ' + APPEAL_SCALE, '×' + e.appeal.toFixed(2)) +
      row('Rating', starsHtml(rating), '×' + e.ratingFactor.toFixed(2)) +
      row('Prices', Math.round(e.priceRatio * 100) + '% of suggested', '×' + e.priceFactor.toFixed(2)) +
      row('Guests arriving', BASE_ARRIVAL + '/min × appeal × rating × prices', n1(e.arrivalRate) + '/min') +
      row('Seats', plural(e.seats, 'dining seat') + ' × ' + SEAT_TURNOVER, n1(e.seatCap) + '/min') +
      row('Kitchen', plural(e.chefs, 'chef') + ', ' + plural(e.kitchens, 'counter') + ', ' + n1(e.servesPerChef) + ' dishes/min at speed 1', n1(e.kitchenCap) + '/min') +
      row('Service', plural(e.waiters, 'waiter') + (e.helpers ? ' + ' + plural(e.helpers, 'helper') + ' at half pace' : '') + ', ' + SERVES_PER_WAITER + ' plates/min at speed 1', n1(e.serviceCap) + '/min') +
      row('Served', 'guests arriving, up to the smallest of the three',n1(e.served) + '/min') +
      row('Per guest', 'avg price ' + n1(e.avgMenuPrice) + ' − cost ' + n1(e.avgCost) + ', ' + menu.length + ' on the menu', '+' + n1(e.margin)) +
      row('Cleanliness', 'dirt ' + fmt(dirtLevel) + '%', '×' + e.cleanFactor.toFixed(2)) +
      row('Wages', staff.length + (staff.length === 1 ? ' person' : ' people') + ' on the team', '−' + fmt(e.wagesPerMin) + '/min') +
      row('Income', '', inc, 'sum');
    bdHint.hidden = !e.hint;
    bdHint.textContent = e.hint;
    const why = topReason();
    bdNote.textContent = (why ? 'Recent guests who left unhappy mostly said ' + REASON_TEXT[why] + '. ' : '') + plural(stats.served, 'happy guest') + ' served so far.';
  }
  function setBreakdown(open) {
    breakdownEl.hidden = !open;
    statsBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    updateMoneyHud();
  }

  /* ---------------- drawing guests, plates, bubbles ---------------- */
  const drawPerson = (c, fx, fy, z, sitting, now) => drawChibi(c, fx, fy, z, sitting, now);

  function drawPlate(ch) {
    const [px, py] = plateSpot(ch);
    const sx = PX(px, py), sy = PY(px, py, 18.3);
    ctx.fillStyle = lit(PLATE, 1);
    ctx.beginPath(); ctx.ellipse(sx, sy, 6.4, 3.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = lit(P.cream, 1.02);
    ctx.beginPath(); ctx.ellipse(sx, sy - 0.3, 4.8, 2.3, 0, 0, Math.PI * 2); ctx.fill();
    if (ch.plate.state === 'full') drawFood(sx, sy - 0.3, ch.plate.dish, 1 - ch.plate.eaten);
    else {
      ctx.fillStyle = lit(P.woodDeep, 1, 0.8);
      for (const [ox, oy] of [[-1.8, -0.3], [1.2, 0.5], [0.4, -0.9]]) { ctx.beginPath(); ctx.arc(sx + ox, sy + oy, 0.8, 0, Math.PI * 2); ctx.fill(); }
    }
  }
  function drawFood(sx, sy, dish, amt) {
    if (amt <= 0.03) return;
    const s = 0.45 + 0.55 * amt;
    ctx.fillStyle = lit(dish.cols[0], 1);
    ctx.beginPath(); ctx.ellipse(sx, sy - 1.2 * s, 3.8 * s, 2.2 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = lit(dish.cols[1], 1);
    ctx.beginPath(); ctx.arc(sx - 0.8, sy - 2.4 * s, 1.7 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = lit(dish.cols[2], 1);
    ctx.beginPath(); ctx.arc(sx + 1.6, sy - 2 * s, 1 * s, 0, Math.PI * 2); ctx.fill();
  }
  /* Anyone drawn chibi on the floor (big head, face, hair style). Staff have b.role and b.look (uniform, hat); guests carry the
     look parts themselves and wear plain clothes. Sets b.hx and b.hy so bubbles and drawStaffBits keep working; the head centre is 7px below hy. */
  const STAFF_TOP = { chef: rgb('#fff1e2'), waiter: rgb('#8e78b8'), helper: rgb('#5fae98') };
  const GUEST_SCARF = ['#f4978e', '#f6d27a', '#7fb8e6', '#e8a06a', '#c9a0dc'].map(rgb);
  const CAP = { white: rgb('#fbf0e3'), whiteDeep: rgb('#efdfcc'), band: rgb('#f6d27a'), bow: rgb('#ffb5a7'), apron: rgb('#8a6f7e'), vest: rgb('#6f5c9c'), apronY: rgb('#f6d27a'), blush: rgb('#ff9f96'), mouth: rgb('#b8566a'), cream: rgb('#fff8ef') };
  function drawChibi(b, fx, fy, z, sitting, now) {
    const sx = PX(fx, fy), base = PY(fx, fy, z), p = b.look || b;
    const walk = !sitting && b.moving && !reduced;
    const bob = walk ? Math.abs(Math.sin(b.ph)) * 1.2 : 0;
    const breathe = !walk && !reduced ? Math.sin(now * 0.003 + b.ph) * 0.35 : 0;
    const st = walk ? Math.sin(b.ph) * 1.5 : 0;
    const role = b.role, tc = role ? STAFF_TOP[role] : b.shirt, hair = lit(b.hair, 1), hairDeep = lit(b.hair, 0.85), skin = lit(b.skin, 1);
    ctx.save();
    ctx.globalAlpha *= clamp(b.alpha, 0, 1);
    if (!sitting) {
      ctx.fillStyle = 'rgba(122,82,118,0.18)';
      ctx.beginPath(); ctx.ellipse(sx, base, 6, 2.6, 0, 0, Math.PI * 2); ctx.fill();
    }
    // legs (seated guests are hidden by the table and chair)
    if (!sitting) {
      ctx.fillStyle = lit(b.pants, 0.95);
      rrect(sx - 3.6, base - 7.5, 3, 7.5 - Math.max(0, st), 1.3); ctx.fill();
      rrect(sx + 0.6, base - 7.5, 3, 7.5 - Math.max(0, -st), 1.3); ctx.fill();
    }
    // arms swing a little
    const top = base - (sitting ? 10 : 15.5) - bob + breathe;
    const sw = walk ? Math.sin(b.ph) * 1.4 : 0;
    ctx.fillStyle = lit(tc, 0.92);
    rrect(sx - 6.4, top + 1.2 + sw * 0.3, 2.6, 7, 1.3); ctx.fill();
    rrect(sx + 3.8, top + 1.2 - sw * 0.3, 2.6, 7, 1.3); ctx.fill();
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(sx - 5.1, top + 8.6 + sw * 0.3, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + 5.1, top + 8.6 - sw * 0.3, 1.5, 0, Math.PI * 2); ctx.fill();
    // torso and the role garment over it
    const g = ctx.createLinearGradient(sx - 4.6, 0, sx + 4.6, 0);
    g.addColorStop(0, lit(tc, 1.03)); g.addColorStop(1, lit(tc, 0.84));
    ctx.fillStyle = g;
    rrect(sx - 4.6, top, 9.2, sitting ? 10 : 9.6, 3.4); ctx.fill();
    if (b.state === 'eating' && !reduced) {
      ctx.fillStyle = skin;
      ctx.beginPath(); ctx.arc(sx + 5.2, top + 6 - Math.abs(Math.sin(now * 0.007)) * 3.4, 1.7, 0, Math.PI * 2); ctx.fill();
    }
    if (role === 'chef') {
      ctx.fillStyle = lit(CAP.apron, 1);
      rrect(sx - 4.2, top + 4.4, 8.4, 5.2, 1.6); ctx.fill();
      ctx.fillStyle = lit(CAP.cream, 1);
      ctx.beginPath(); ctx.arc(sx - 1.4, top + 2, 0.6, 0, Math.PI * 2); ctx.arc(sx + 1.4, top + 2, 0.6, 0, Math.PI * 2); ctx.fill();
    } else if (role === 'waiter') {
      ctx.fillStyle = lit(CAP.vest, 1);
      rrect(sx - 4.4, top + 0.4, 3.2, 8.8, 1.6); ctx.fill();
      rrect(sx + 1.2, top + 0.4, 3.2, 8.8, 1.6); ctx.fill();
    } else if (role === 'helper') {
      ctx.fillStyle = lit(CAP.apronY, 1);
      rrect(sx - 3.8, top + 4, 7.6, 5.6, 1.6); ctx.fill();
    }
    if (role) {
      // staff signature: a cream name badge with a coral dot on the chest, on every uniform
      ctx.fillStyle = lit(CAP.cream, 1);
      rrect(sx + 0.6, top + 1.8, 3.6, 2.4, 0.8); ctx.fill();
      ctx.fillStyle = lit(CAP.bow, 1);
      ctx.beginPath(); ctx.arc(sx + 1.7, top + 3, 0.6, 0, Math.PI * 2); ctx.fill();
    } else {
      // guest signature: a scarf, and a little bag when standing
      const sc = GUEST_SCARF[Math.floor(b.ph * 7) % GUEST_SCARF.length];
      ctx.fillStyle = lit(sc, 1);
      rrect(sx - 4.2, top + 1.2, 8.4, 2, 1); ctx.fill();
      if (!sitting) {
        ctx.fillStyle = lit(sc, 0.85);
        rrect(sx + 3.4, top + 6.2, 3.8, 3.2, 1); ctx.fill();
      }
    }
    // head, with hair that sits behind it
    const hy = top - 4.6, r = 6.5;
    const style = p.hairStyle;
    ctx.fillStyle = hairDeep;
    if (style === 'bob') { rrect(sx - r - 0.6, hy - 1, r * 2 + 1.2, 9, 3.6); ctx.fill(); }
    else if (style === 'long') { rrect(sx - r - 0.6, hy - 1, r * 2 + 1.2, 13, 3.4); ctx.fill(); }
    else if (style === 'twin') { ctx.beginPath(); ctx.ellipse(sx - r - 0.8, hy + 4, 2.4, 4, 0, 0, Math.PI * 2); ctx.ellipse(sx + r + 0.8, hy + 4, 2.4, 4, 0, 0, Math.PI * 2); ctx.fill(); }
    else if (style === 'bun') { ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(sx + 4.8, hy - 5.8, 3.3, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(sx, hy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = lit(b.skin, 0.95);
    ctx.beginPath(); ctx.ellipse(sx + r * 0.62, hy + 0.5, r * 0.34, r * 0.9, 0, 0, Math.PI * 2); ctx.fill();
    // face
    const ey = hy + 0.8, ec = lit(rgb(EYE_COLS[p.eye] || EYE_COLS[0]), 1);
    const blink = !reduced && ((now * 0.001 + b.ph * 3) % 4.6) > 4.42;
    ctx.fillStyle = ec; ctx.strokeStyle = ec; ctx.lineWidth = 0.9; ctx.lineCap = 'round';
    if (p.face === 'happy' || blink) {
      const dy = p.face === 'happy' ? 0.8 : 0;
      ctx.beginPath();
      ctx.arc(sx - 2.5, ey + dy, 1.2, Math.PI * 1.1, Math.PI * 1.9);
      ctx.moveTo(sx + 2.5 + 1.2 * Math.cos(Math.PI * 1.1), ey + dy + 1.2 * Math.sin(Math.PI * 1.1));
      ctx.arc(sx + 2.5, ey + dy, 1.2, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.ellipse(sx - 2.5, ey, 1.15, 1.5, 0, 0, Math.PI * 2); ctx.ellipse(sx + 2.5, ey, 1.15, 1.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = lit(CAP.cream, 1);
      ctx.beginPath(); ctx.arc(sx - 2.1, ey - 0.6, 0.5, 0, Math.PI * 2); ctx.arc(sx + 2.9, ey - 0.6, 0.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = lit(CAP.blush, 1, 0.45);
    ctx.beginPath(); ctx.ellipse(sx - 4.2, ey + 1.9, 1.4, 0.8, 0, 0, Math.PI * 2); ctx.ellipse(sx + 4.2, ey + 1.9, 1.4, 0.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = lit(CAP.mouth, 1); ctx.fillStyle = lit(CAP.mouth, 1); ctx.lineWidth = 0.8;
    if (p.face === 'grin' || p.face === 'happy') { ctx.beginPath(); ctx.arc(sx, ey + 2.2, 1.3, 0, Math.PI); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(sx, ey + 2.1, 1.1, Math.PI * 0.1, Math.PI * 0.9); ctx.stroke(); }
    if (p.acc === 'glasses') {
      ctx.strokeStyle = lit(rgb('#8a6f7e'), 1); ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.arc(sx - 2.5, ey, 2.1, 0, Math.PI * 2); ctx.moveTo(sx + 4.6, ey); ctx.arc(sx + 2.5, ey, 2.1, 0, Math.PI * 2); ctx.stroke();
    }
    // hair in front
    ctx.fillStyle = hair;
    if (style === 'curly') {
      for (const [ox, oy, rr] of [[-5.4, -1.2, 2.6], [-4, -4.6, 2.9], [0, -6.4, 3.1], [4, -4.6, 2.9], [5.4, -1.2, 2.6], [-1.8, -4, 2.4], [2, -4, 2.4]]) { ctx.beginPath(); ctx.arc(sx + ox, hy + oy, rr, 0, Math.PI * 2); ctx.fill(); }
    } else {
      const cap = style === 'buzz' ? 0.55 : 0.82;
      ctx.beginPath(); ctx.arc(sx, hy - 0.2, r + 0.5, Math.PI * 1.04, Math.PI * 1.96);
      ctx.lineTo(sx + r * 0.9, hy - 1 - cap * 2.4); ctx.quadraticCurveTo(sx, hy - 3 * cap - 1.6, sx - r * 0.9, hy - 1 - cap * 2.4); ctx.closePath(); ctx.fill();
      if (style === 'messy') { ctx.beginPath(); ctx.moveTo(sx - 1, hy - r - 0.6); ctx.lineTo(sx + 1.8, hy - r - 2.6); ctx.lineTo(sx + 3, hy - r); ctx.closePath(); ctx.fill(); }
    }
    // headwear and accessories
    if (role === 'chef') {
      ctx.fillStyle = lit(CAP.white, 1.02);
      for (const [ox, oy, rr] of [[-3.6, -9.4, 3.4], [3.6, -9.4, 3.4], [0, -11.2, 3.8]]) { ctx.beginPath(); ctx.arc(sx + ox, hy + oy, rr, 0, Math.PI * 2); ctx.fill(); }
      rrect(sx - 5.8, hy - 9, 11.6, 5.4, 1.8); ctx.fill();
      ctx.fillStyle = lit(CAP.whiteDeep, 1);
      rrect(sx - 6, hy - 5.2, 12, 1.9, 0.9); ctx.fill();
    } else if (role === 'helper') {
      ctx.strokeStyle = lit(CAP.band, 1); ctx.lineWidth = 1.7;
      ctx.beginPath(); ctx.arc(sx, hy - 0.6, r + 0.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    } else if (role === 'waiter') {
      ctx.fillStyle = lit(CAP.bow, 1);
      const y = top + 0.8;
      ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx - 3, y - 1.7); ctx.lineTo(sx - 3, y + 1.7); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + 3, y - 1.7); ctx.lineTo(sx + 3, y + 1.7); ctx.closePath(); ctx.fill();
    }
    if (p.acc === 'star' || p.acc === 'flower') {
      const ax = sx + 4.8, ay = hy - 3.6;
      if (p.acc === 'star') {
        ctx.fillStyle = lit(CAP.band, 1.02);
        ctx.beginPath();
        for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 1.1 : 2.4; ctx[i ? 'lineTo' : 'moveTo'](ax + Math.cos(a) * rr, ay + Math.sin(a) * rr); }
        ctx.closePath(); ctx.fill();
      } else {
        ctx.fillStyle = lit(CAP.bow, 1);
        for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5; ctx.beginPath(); ctx.arc(ax + Math.cos(a) * 1.5, ay + Math.sin(a) * 1.5, 1.2, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = lit(CAP.band, 1); ctx.beginPath(); ctx.arc(ax, ay, 0.9, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
    b.hx = sx;
    b.hy = hy - 7;
  }
  /* hand and plate details drawn over a staff body; b.hx, b.hy were set by drawPerson (head centre is 7px below hy) */
  function drawStaffBits(b, now) {
    const hx = b.hx, hc = b.hy + 7;
    ctx.save();
    ctx.globalAlpha *= clamp(b.alpha, 0, 1);
    if (b.cooking) {
      // a hand stirring at the counter
      const a = reduced ? 0 : now * 0.008;
      ctx.fillStyle = lit(b.skin, 1);
      ctx.beginPath(); ctx.arc(hx + 4.8 + Math.cos(a) * 1.4, hc + 9 + Math.sin(a) * 0.7, 1.7, 0, Math.PI * 2); ctx.fill();
    }
    if (b.carry) {
      const sx = hx + 6, sy = hc + 8;
      ctx.fillStyle = lit(PLATE, 1);
      ctx.beginPath(); ctx.ellipse(sx, sy, 5.4, 2.7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = lit(P.cream, 1.02);
      ctx.beginPath(); ctx.ellipse(sx, sy - 0.3, 4, 1.9, 0, 0, Math.PI * 2); ctx.fill();
      drawFood(sx, sy - 0.3, b.carry, 0.85);
      ctx.fillStyle = lit(b.skin, 1);
      ctx.beginPath(); ctx.arc(sx - 3.6, sy + 1, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  const BUBBLE_ICON = {
    heart() {
      ctx.fillStyle = '#f4978e';
      ctx.beginPath(); ctx.moveTo(0, 4.5);
      ctx.bezierCurveTo(-7.5, -0.5, -4.5, -7.5, 0, -3);
      ctx.bezierCurveTo(4.5, -7.5, 7.5, -0.5, 0, 4.5); ctx.fill();
    },
    trash() {
      ctx.fillStyle = '#a99bbd';
      rrect(-5.5, -6, 11, 2, 1); ctx.fill();
      rrect(-1.6, -7.6, 3.2, 2, 1); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-4.4, -3.4); ctx.lineTo(4.4, -3.4); ctx.lineTo(3.4, 5.5); ctx.lineTo(-3.4, 5.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#d9cfe6';
      rrect(-2.2, -1.6, 1.2, 5, 0.6); ctx.fill();
      rrect(1, -1.6, 1.2, 5, 0.6); ctx.fill();
    },
    chair() {
      ctx.fillStyle = '#c4966f';
      rrect(-4.5, -7, 2.4, 13, 1); ctx.fill();
      rrect(-4.5, 0, 9, 2.4, 1); ctx.fill();
      rrect(2.6, 1, 2, 5, 0.8); ctx.fill();
      ctx.fillStyle = '#9fd2c1';
      rrect(-4, -1.2, 8, 1.8, 0.8); ctx.fill();
    },
    plate() {
      ctx.fillStyle = '#e2d2c0';
      ctx.beginPath(); ctx.ellipse(0, 1, 7.5, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff6ea';
      ctx.beginPath(); ctx.ellipse(0, 0.6, 5.4, 2.8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c4966f';
      for (const [ox, oy] of [[-2, 0], [1.5, 1], [0.6, -0.8]]) { ctx.beginPath(); ctx.arc(ox, oy, 0.9, 0, Math.PI * 2); ctx.fill(); }
    },
    clock() {
      ctx.fillStyle = '#cdb4db';
      ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff6ea';
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5b4b57'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -3.4); ctx.moveTo(0, 0); ctx.lineTo(2.6, 1.2); ctx.stroke();
    }
  };
  function drawBubble(c) {
    const b = c.bubble;
    const k = clamp(b.t / 0.25, 0, 1);
    const s = reduced ? 1 : k < 1 ? 0.4 + 0.75 * k - 0.15 * Math.sin(k * Math.PI) : 1;
    const fade = clamp((b.dur - b.t) / 0.3, 0, 1);
    ctx.save();
    ctx.globalAlpha = clamp(c.alpha, 0, 1) * fade * (reduced ? Math.min(1, b.t * 5) : 1);
    ctx.translate(c.hx, c.hy);
    ctx.scale(s, s);
    ctx.fillStyle = 'rgba(122,82,118,0.16)';
    rrect(-12, -24, 24, 21, 9); ctx.fill();
    ctx.fillStyle = '#fff8ef';
    rrect(-12, -25.5, 24, 21, 9); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-3.5, -5); ctx.lineTo(0, 0); ctx.lineTo(3.5, -5); ctx.closePath(); ctx.fill();
    ctx.translate(0, -15);
    if (b.type === 'order') {
      ctx.fillStyle = '#e2d2c0';
      ctx.beginPath(); ctx.ellipse(0, 2.5, 7.5, 3.6, 0, 0, Math.PI * 2); ctx.fill();
      drawFoodIcon(c.dish);
    } else if (BUBBLE_ICON[b.type]) BUBBLE_ICON[b.type]();
    ctx.restore();
  }
  function drawFoodIcon(dish) {
    ctx.fillStyle = css(dish.cols[0], 1);
    ctx.beginPath(); ctx.ellipse(0, 0.6, 5.2, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = css(dish.cols[1], 1);
    ctx.beginPath(); ctx.arc(-1.2, -1.2, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = css(dish.cols[2], 1);
    ctx.beginPath(); ctx.arc(2.2, -0.6, 1.4, 0, Math.PI * 2); ctx.fill();
  }
  function drawPops() {
    if (!drawPops.font) drawPops.font = '800 9px ' + getComputedStyle(document.body).fontFamily;
    ctx.font = drawPops.font;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    for (const p of pops) {
      const k = p.t / 1.3;
      const y = p.y - 26 - (reduced ? 4 : 22) * Math.sqrt(k);
      ctx.globalAlpha = clamp((1 - k) * 2.2, 0, 1);
      ctx.fillStyle = '#e9b44c';
      ctx.beginPath(); ctx.arc(p.x - 7, y, 4.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f6d27a';
      ctx.beginPath(); ctx.arc(p.x - 7, y, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b7843a';
      ctx.fillText((p.amount < 0 ? '−' : '+') + Math.abs(p.amount), p.x - 1.5, y + 0.5);
    }
    ctx.globalAlpha = 1;
  }

  // ===== STAFF =====
  /* ================================================================
     Staff model (project.md 7.1 and the 8.1 staff rule)
     Speed and wage come from role and tier, never stored per person,
     so retuning a number applies to the whole team.
     ================================================================ */
  // power: share of speed that counts as work (helpers carry plates at half pace)
  const ROLES = {
    chef: { name: 'Chef', job: 'cooks at a counter', power: 1, wage: [2, 3, 4, 6] },
    waiter: { name: 'Waiter', job: 'carries plates', power: 1, wage: [1, 2, 3, 4] },
    helper: { name: 'Helper', job: 'helps with plates at half pace', power: 0.5, wage: [1, 1, 2, 3] }
  };
  const ROLE_ORDER = ['chef', 'waiter', 'helper'];
  const TIERS = [
    { name: 'Steady', speed: 0.8, unlock: 1 },
    { name: 'Brisk', speed: 1, unlock: 1 },
    { name: 'Swift', speed: 1.25, unlock: 5 },
    { name: 'Zippy', speed: 1.5, unlock: 12 }
  ];
  const SERVES_PER_WAITER = 6;        // plates carried per minute at speed 1
  const HIRE_FEE_PER_WAGE = 25;       // one-time fee = 25 × wage
  const CANDIDATE_COUNT = 4;
  const MAX_STAFF = MAX_GRID - 2;
  const STAFF_NAMES = ['Noon', 'Wren', 'Pim', 'Juno', 'Tawan', 'Lumi', 'Ploy', 'Otto', 'Fah', 'Hazel', 'Kai', 'Bea',
    'Nell', 'Sora', 'Pip', 'Remy', 'Ivy', 'Tam', 'Cass', 'Mali', 'Bo', 'Tilly', 'Arun', 'Fern'];
  const staffCap = () => Math.min(MAX_STAFF, N - 2);
  const speedOf = (p) => TIERS[p.tier - 1].speed;
  const powerOf = (p) => speedOf(p) * ROLES[p.role].power;
  const baseWage = (p) => ROLES[p.role].wage[p.tier - 1];
  const wageOf = (p) => (DEV_MODE ? 0 : baseWage(p));
  const hireFee = (p) => (DEV_MODE ? 0 : baseWage(p) * HIRE_FEE_PER_WAGE);
  const tiersOpen = () => TIERS.map((t, i) => i + 1).filter((n) => TIERS[n - 1].unlock <= level);
  const wagesNow = () => staff.reduce((s, p) => s + wageOf(p), 0);

  let staff = [];         // [{ id, role, tier, name, skin, hair }], plus runtime busy timers
  let candidates = [];    // the hire list, rerolled freely and never saved
  const staffOf = (role) => staff.filter((p) => p.role === role);
  const newStaffId = () => 'st_' + Math.random().toString(36).slice(2, 8);
  /* Look parts are cosmetic only. Saved as names or palette indices; sanitizeStaff() clamps them. */
  const HAIR_STYLES = ['fluffy', 'messy', 'bob', 'bun', 'twin', 'long', 'curly', 'buzz'];
  const FACES = ['smile', 'grin', 'cat', 'happy'];
  const ACCS = ['none', 'star', 'flower', 'glasses', 'freckles'];
  const EYE_COLS = ['#4a3340', '#5a3e2e', '#3f3b5c'];
  const rollLook = () => ({
    skin: Math.floor(Math.random() * SKINS.length), hair: Math.floor(Math.random() * HAIRS.length), hairStyle: pick(HAIR_STYLES),
    eye: Math.floor(Math.random() * EYE_COLS.length), face: pick(FACES), acc: pick(ACCS)
  });
  const oneOf = (list, v) => (list.includes(v) ? v : pick(list));
  const starterCrew = () => [
    { id: 'st_chef01', role: 'chef', tier: 2, name: 'Noon', skin: 1, hair: 0, hairStyle: 'messy', eye: 0, face: 'grin', acc: 'none' },
    { id: 'st_wait01', role: 'waiter', tier: 2, name: 'Wren', skin: 0, hair: 5, hairStyle: 'bun', eye: 1, face: 'smile', acc: 'star' }
  ];
  /* keeps the roster valid: known roles, tiers in range, short names, palette indices; an empty team is allowed */
  function sanitizeStaff(list) {
    if (!Array.isArray(list)) return starterCrew();
    const out = [], ids = {};
    for (const p of list) {
      if (!p || !ROLES[p.role] || out.length >= MAX_STAFF) continue;
      let id = typeof p.id === 'string' && /^[\w-]{1,24}$/.test(p.id) ? p.id : newStaffId();
      if (ids[id]) id = newStaffId();
      ids[id] = 1;
      const name = typeof p.name === 'string' ? clipName(p.name).trim() : '';
      out.push({
        id, role: p.role, tier: clamp(Math.floor(+p.tier) || 2, 1, TIERS.length), name: name || pick(STAFF_NAMES),
        skin: clamp(p.skin | 0, 0, SKINS.length - 1), hair: clamp(p.hair | 0, 0, HAIRS.length - 1),
        hairStyle: oneOf(HAIR_STYLES, p.hairStyle), eye: clamp(p.eye | 0, 0, EYE_COLS.length - 1), face: oneOf(FACES, p.face), acc: oneOf(ACCS, p.acc)
      });
    }
    return out;
  }
  function rollCandidate(role) {
    const taken = new Set(staff.concat(candidates).map((p) => p.name));
    const names = STAFF_NAMES.filter((n) => !taken.has(n));
    return {
      id: newStaffId(), role, tier: pick(tiersOpen()), name: pick(names.length ? names : STAFF_NAMES), ...rollLook()
    };
  }
  /* always at least one candidate per role, then one more of any role */
  function rollCandidates() {
    candidates = [];
    const roles = ROLE_ORDER.concat([pick(ROLE_ORDER)]).slice(0, CANDIDATE_COUNT);
    for (const r of roles) candidates.push(rollCandidate(r));
    candidates.sort((a, b) => ROLE_ORDER.indexOf(a.role) - ROLE_ORDER.indexOf(b.role) || a.tier - b.tier);
  }

  /* Wages are paid in whole coins as they add up. Coins never go below 0: an unpaid
     part is forgiven and staff keep working (no fail state, project.md 7.1). */
  let wageOwed = 0;
  function payWages(dt) {
    wageOwed += wagesNow() * dt / 60;
    if (wageOwed < 1) return;
    const due = Math.floor(wageOwed);
    wageOwed -= due;
    const paid = Math.min(due, coins);
    if (!paid) return;
    coins -= paid;
    shownCoins = Math.max(0, Math.min(coins, shownCoins - paid));
    saveSoon();
  }

  /* ---------------- staff on the floor (project.md 7.1, Phase 3b) ----------------
     Runtime only, never saved: p.body (position, path, look), p.home (station tile),
     p.counter (a chef's counter), p.job, p.busy. */
  const STAFF_WALK = 2.2;             // tiles per second at speed 1
  const HANDOFF = 0.4;                // seconds spent picking up or setting down a plate
  const UNIFORMS = {
    chef: { shirt: rgb('#fff1e2'), pants: rgb('#a98f80') },
    waiter: { shirt: rgb('#cdb4db'), pants: rgb('#6f6a8a') },
    helper: { shirt: rgb('#b8e0d2'), pants: rgb('#7a9cc6') }
  };
  const leavers = [];                 // bodies of staff who were let go, walking out
  function bodyOf(p) {
    if (!p.body) {
      const h = p.home || [DOOR.x, DOOR.y];
      p.body = {
        x: h[0] + 0.5, y: h[1] + 0.5, path: [], alpha: 1, moving: false, ph: Math.random() * 6, state: '',
        role: p.role, shirt: UNIFORMS[p.role].shirt, pants: UNIFORMS[p.role].pants, skin: SKINS[p.skin], hair: HAIRS[p.hair],
        carry: null, cooking: false, hx: 0, hy: 0, look: p
      };
    }
    return p.body;
  }
  const staffBodies = () => staff.map(bodyOf).concat(leavers);
  const atStation = (p) => {
    const b = bodyOf(p);
    return !!p.home && !b.path.length && Math.floor(b.x) === p.home[0] && Math.floor(b.y) === p.home[1];
  };
  function goHome(p) {
    const b = bodyOf(p), h = p.home;
    if (!h) return;
    const [tx, ty] = tileOf(b);
    if (tx === h[0] && ty === h[1]) { b.path = [[h[0] + 0.5, h[1] + 0.5]]; return; }
    if (!walkTo(b, h[0], h[1])) { b.x = h[0] + 0.5; b.y = h[1] + 0.5; b.path = []; }
  }
  /* walks to a floor tile beside an item (the nearest of its cells), not onto it */
  function walkNear(b, it) {
    const [sx, sy] = tileOf(b), blocked = blockedGrid();
    let best = null;
    for (const [cx, cy] of cells(it)) {
      const route = inside(cx, cy) && astar(sx, sy, cx, cy, blocked);
      if (route && (!best || route.length < best.length)) best = route;
    }
    if (!best) return false;
    best.pop();
    b.path = best.slice(1).map(([x, y]) => [x + 0.5, y + 0.5]);
    if (!b.path.length) b.path = [[sx + 0.5, sy + 0.5]];
    return true;
  }

  /* Stations: chefs get a free tile beside their counter (fastest chef to the first
     counter), then waiters and helpers take the next free tiles beside a counter, or
     the nearest free tile to one. Only tiles reachable from the door count. */
  function assignStations() {
    const blocked = blockedGrid();
    const seen = new Uint8Array(N * N);
    const start = DOOR.x + DOOR.y * N, queue = [start];
    seen[start] = 1;
    for (let q = 0; q < queue.length; q++) {
      const k = queue[q], x = k % N, y = (k / N) | 0;
      for (const [sx, sy] of STEPS) {
        const nx = x + sx, ny = y + sy, nk = nx + ny * N;
        if (inside(nx, ny) && !blocked[nk] && !seen[nk]) { seen[nk] = 1; queue.push(nk); }
      }
    }
    const taken = new Set([start]);
    const free = (x, y) => inside(x, y) && seen[x + y * N] && !taken.has(x + y * N);
    const counters = items.filter((it) => it.id === 'counter_01');
    // the side the counter faces first, then any other side
    function beside(it) {
      for (const [sx, sy] of [DIRS[it.rot]].concat(STEPS)) for (const [cx, cy] of cells(it)) if (free(cx + sx, cy + sy)) return [cx + sx, cy + sy];
      return null;
    }
    // nearest free reachable tile, walking out from the counters (or the door)
    function nearest() {
      const from = counters.length ? counters.flatMap(cells) : [[DOOR.x, DOOR.y]];
      const dist = new Uint8Array(N * N), q = [];
      for (const [x, y] of from) if (inside(x, y)) { dist[x + y * N] = 1; q.push(x + y * N); }
      for (let i = 0; i < q.length; i++) {
        const k = q[i], x = k % N, y = (k / N) | 0;
        if (free(x, y)) return [x, y];
        for (const [sx, sy] of STEPS) {
          const nx = x + sx, ny = y + sy, nk = nx + ny * N;
          if (inside(nx, ny) && !dist[nk] && (seen[nk] || blocked[nk])) { dist[nk] = 1; q.push(nk); }
        }
      }
      return [DOOR.x, DOOR.y];
    }
    const chefs = staffOf('chef').sort((a, b) => speedOf(b) - speedOf(a));
    chefs.forEach((p, i) => { p.counter = counters[i] || null; });
    for (const p of chefs.concat(staff.filter((x) => x.role !== 'chef'))) {
      if (p.role !== 'chef') p.counter = null;
      let spot = p.counter ? beside(p.counter) : null;
      if (!spot && p.role !== 'chef') for (const it of counters) if ((spot = beside(it))) break;
      p.home = spot || nearest();
      taken.add(p.home[0] + p.home[1] * N);
    }
  }

  /* a waiter or helper puts the job down: plates go back to the counter queue */
  function dropJob(p) {
    const j = p.job;
    p.job = null;
    if (p.body) p.body.carry = null;
    if (!j || !j.cust || j.cust.state !== 'served') return;
    if (j.counter && items.includes(j.counter)) ready.unshift({ cust: j.cust, dish: j.dish, counter: j.counter });
    else { j.cust.state = 'waitFood'; orders.unshift(j.cust); }
  }
  function clearPlate(ch) {
    const [px, py] = plateSpot(ch);
    ch.plate = null;
    spawnRing(px - 0.2, py - 0.2, 0.4, 0.4);
  }
  const dirtyFor = () => chairs().find((ch) => !ch.occupant && ch.plate && ch.plate.state === 'dirty' && !staff.some((p) => p.job && p.job.chair === ch));

  function updateStaff(dt) {
    for (const p of staff) {
      const b = bodyOf(p);
      b.alpha = Math.min(1, b.alpha + dt * 3);
      p.busy = Math.max(0, (p.busy || 0) - dt);
      const arrived = stepPath(b, dt, STAFF_WALK * speedOf(p));
      if (p.role === 'chef') {
        if (arrived && !atStation(p)) goHome(p);
        b.cooking = !!(p.counter && p.counter.cook) && atStation(p);
        continue;
      }
      const j = p.job;
      if (!j) {
        let r = null;
        while (p.busy <= 0 && ready.length && !r) {
          r = ready.shift();
          if (!r.cust || r.cust.state !== 'waitFood' || !r.cust.seat || !items.includes(r.counter)) r = null;
        }
        if (r) {
          // one delivery keeps them busy for 60 / (SERVES_PER_WAITER * power) seconds, or the walk if longer
          r.cust.state = 'served';
          p.busy = 60 / (SERVES_PER_WAITER * powerOf(p));
          p.job = { kind: 'pickup', cust: r.cust, dish: r.dish, counter: r.counter };
          if (!walkNear(b, r.counter)) b.path = [];
          continue;
        }
        const ch = !ready.length && dirtyFor();
        if (ch) {
          p.job = { kind: 'clear', chair: ch };
          if (!walkNear(b, ch)) b.path = [];
          continue;
        }
        if (arrived && !atStation(p)) goHome(p);
        continue;
      }
      if (j.kind !== 'clear' && !j.cust) { dropJob(p); continue; }   // the guest left
      if (!arrived) continue;
      if (j.pause > 0) { j.pause -= dt; continue; }      // a short hand-off, so the plate is seen in hand
      if (j.kind === 'pickup') {
        b.carry = j.dish;
        j.kind = 'deliver';
        j.pause = HANDOFF;
        if (!walkNear(b, j.cust.seat)) b.path = [];
      } else if (j.kind === 'deliver' && !j.placed) {
        j.placed = true;
        j.pause = HANDOFF;
      } else if (j.kind === 'deliver') {
        b.carry = null;
        p.job = null;
        servePlate(j.cust, j.dish);
      } else if (j.kind === 'clear') {
        p.job = null;
        const ch = j.chair;
        if (items.includes(ch) && !ch.occupant && ch.plate && ch.plate.state === 'dirty') clearPlate(ch);
      }
    }
    for (let q = leavers.length - 1; q >= 0; q--) {
      const b = leavers[q];
      if (!stepPath(b, dt, STAFF_WALK)) continue;
      if (b.state === 'leaving') { b.state = 'exit'; b.path = [[DOOR_IN.x, DOOR_IN.y]]; }
      else if ((b.alpha -= dt * 3) <= 0) leavers.splice(q, 1);
    }
  }

  /* the layout or the team changed: new stations, and everyone on the move re-paths */
  function staffOnLayout() {
    assignStations();
    for (const p of staff) {
      const b = bodyOf(p), j = p.job;
      if (!j) { if (!atStation(p)) goHome(p); continue; }
      if (j.kind === 'clear') {
        if (items.includes(j.chair) && j.chair.plate) walkNear(b, j.chair); else p.job = null;
      } else if (!j.cust) {
        dropJob(p);
      } else if (j.kind === 'pickup') {
        if (items.includes(j.counter)) walkNear(b, j.counter); else dropJob(p);
      } else walkNear(b, j.cust.seat);
    }
  }
  /* a new hire fades in at the door and walks to their station */
  function staffJoins(p) {
    const b = bodyOf(p);
    b.x = DOOR_IN.x; b.y = DOOR_IN.y; b.alpha = 0;
    staffOnLayout();
  }
  function staffLeaves(p) {
    dropJob(p);
    const b = bodyOf(p);
    b.cooking = false;
    b.state = 'leaving';
    if (!walkTo(b, DOOR.x, DOOR.y)) b.path = [];
    leavers.push(b);
    staffOnLayout();
  }

  // ===== INTERACTION STATE =====
  /* ================================================================
     Interaction state
     ================================================================ */
  let tool = 'move';
  let ghostRot = 0;
  let selected = null;
  let drag = null;             // { item, offX, offY, grabZ, tx, ty, reason }
  const hover = { x: -1, y: -1, show: false };
  const kbd = { x: 2, y: 2, show: false };
  /* paint tool: tool === 'paint' with paint = { kind: 'floor' | 'wall', i: style index }.
     Walls have their own cursors, since a wall segment is not a floor tile. */
  let paint = null;
  const hoverWall = { side: 'A', i: 0, show: false };
  const kwall = { side: 'A', i: 0, show: false };
  function paintTarget() {
    if (tool !== 'paint' || !paint || drag) return null;
    if (paint.kind === 'wall') {
      const w = hoverWall.show ? hoverWall : kwall.show ? kwall : null;
      return w && w.i < N ? { side: w.side, i: w.i } : null;
    }
    const c = hover.show ? hover : kbd.show ? kbd : null;
    return c && inside(c.x, c.y) ? { x: c.x, y: c.y } : null;
  }
  /* screen point -> wall segment. Wall A is the plane y = 0 (screen x grows with x),
     wall B the plane x = 0; both rise WALL_H above the floor. */
  function wallAt(sx, sy) {
    const wx = (sx - cam.x) / cam.zoom, wy = (sy - cam.y) / cam.zoom;
    for (const side of ['A', 'B']) {
      const u = (side === 'A' ? wx : -wx) / TW, z = u * TH - wy;
      if (u >= 0 && u < N && z >= 0 && z <= WALL_H) return { side, i: Math.floor(u) };
    }
    return null;
  }

  function depthOf(it) {
    const [w, d] = dims(it.id, it.rot);
    return it.x + w / 2 + it.y + d / 2;
  }

  /* find the front-most item under a screen point, checking its full height */
  function itemAt(sx, sy) {
    const sorted = items.slice().sort((a, b) => depthOf(b) - depthOf(a));
    for (const it of sorted) {
      const [w, d] = dims(it.id, it.rot);
      const h = CATALOG[it.id].h;
      for (let z = 0; z <= h; z += 2) {
        const [fx, fy] = floorAt(sx, sy, z);
        if (fx >= it.x + 0.08 && fx <= it.x + w - 0.08 && fy >= it.y + 0.08 && fy <= it.y + d - 0.08) return { item: it, z };
      }
    }
    return null;
  }

  // ===== FRAME =====
  /* ================================================================
     Frame
     ================================================================ */
  function drawItem(it, now, alpha) {
    const anim = animOf(it, now);
    const [w, d] = dims(it.id, it.rot);
    ctx.save();
    if (anim) {
      const bx = PX(it.x + w / 2, it.y + d / 2), by = PY(it.x + w / 2, it.y + d / 2, 0);
      ctx.translate(bx, by);
      ctx.scale(anim[0], anim[1]);
      ctx.translate(-bx, -by);
    }
    ctx.globalAlpha = (anim ? anim[2] : 1) * (alpha === undefined ? 1 : alpha);
    if (ctx.globalAlpha > 0.001) CATALOG[it.id].draw(it, now);
    ctx.restore();
  }
  function footprintPath(x, y, w, d, z) { flat(x + 0.04, y + 0.04, x + w - 0.04, y + d - 0.04, z || 0.6); }

  /* small floor arrow showing which way a chair faces: mint toward a table, lavender otherwise */
  function drawFacing(chair) {
    const [dx, dy] = DIRS[chair.rot];
    const dining = !!seatTable(chair);
    const cx = chair.x + 0.5 + dx * 0.62, cy = chair.y + 0.5 + dy * 0.62;
    const px = -dy, py = dx;
    poly([
      [cx + dx * 0.16, cy + dy * 0.16, 0.7],
      [cx + px * 0.13, cy + py * 0.13, 0.7],
      [cx - px * 0.13, cy - py * 0.13, 0.7]
    ]);
    ctx.fillStyle = dining ? 'rgba(111,180,156,0.9)' : 'rgba(170,140,200,0.9)';
    ctx.fill();
  }

  /* dotted walking route from the door to a seat */
  let routeCache = { v: -1, key: '', path: null };
  function routeTo(it) {
    const key = it.x + ',' + it.y;
    if (routeCache.v !== layoutVersion || routeCache.key !== key) {
      routeCache = { v: layoutVersion, key, path: astar(DOOR.x, DOOR.y, it.x, it.y, blockedGrid()) };
    }
    return routeCache.path;
  }
  function drawRoute(path, now) {
    if (!path || path.length < 2) return;
    const off = reduced ? 0 : (now * 0.0012) % 0.25;
    ctx.fillStyle = 'rgba(111,180,156,0.85)';
    for (let q = 0; q < path.length - 1; q++) {
      const [ax, ay] = path[q], [bx, by] = path[q + 1];
      for (let t = off; t < 1; t += 0.25) {
        const x = lerp(ax, bx, t) + 0.5, y = lerp(ay, by, t) + 0.5;
        ctx.beginPath(); ctx.ellipse(PX(x, y), PY(x, y, 0.6), 2.6, 1.3, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawGhost(id, x, y, rot, variant, reason, now) {
    const [w, d] = dims(id, rot);
    footprintPath(x, y, w, d);
    ctx.fillStyle = reason ? css(P.bad, 0.4) : 'rgba(255,250,240,0.45)';
    ctx.fill();
    if (id === 'chair_01' && !reason) drawFacing({ id, x, y, rot });
    ctx.save();
    ctx.globalAlpha = reason ? 0.35 : 0.62;
    CATALOG[id].draw({ id, x, y, rot, variant }, now);
    ctx.restore();
  }

  function frame(now, dt) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawSky(now, dt);
    ctx.setTransform(DPR * cam.zoom, 0, 0, DPR * cam.zoom, DPR * cam.x, DPR * cam.y);
    glows.length = 0;
    pools.length = 0;
    drawRoomShadow();
    drawSlab();
    drawFloor();
    drawWalls();

    // warm light pools from lanterns, under everything that stands
    if (light.night > 0.03) {
      ctx.globalCompositeOperation = 'lighter';
      for (const it of items) {
        if (!CATALOG[it.id].light) continue;
        const a = lanternGlow(it, now) * (it.born ? 0 : 1);
        if (a <= 0.01) continue;
        const cx = PX(it.x + 0.5, it.y + 0.5), cy = PY(it.x + 0.5, it.y + 0.5, 0);
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(1, 0.5);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, TW * 2.4);
        g.addColorStop(0, 'rgba(255,200,130,' + (0.36 * a).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(255,200,130,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, TW * 2.4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // placement rings
    for (const r of rings) {
      const cx = PX(r.x, r.y), cy = PY(r.x, r.y, 0.5), rad = (0.35 + r.t * 0.9) * r.s * TW;
      ctx.strokeStyle = 'rgba(255,250,240,' + (0.9 * (1 - r.t)).toFixed(3) + ')';
      ctx.lineWidth = 2.5 * (1 - r.t) + 0.5;
      ctx.beginPath(); ctx.ellipse(cx, cy, rad, rad / 2, 0, 0, Math.PI * 2); ctx.stroke();
    }

    // selection outline sits on the floor
    if (selected && !drag) {
      const [w, d] = dims(selected.id, selected.rot);
      footprintPath(selected.x, selected.y, w, d);
      ctx.fillStyle = 'rgba(205,180,219,0.4)';
      ctx.fill();
      ctx.setLineDash([5, 4]);
      ctx.lineDashOffset = reduced ? 0 : -now * 0.02;
      ctx.strokeStyle = 'rgba(150,118,182,0.9)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.setLineDash([]);
      if (selected.id === 'chair_01') {
        drawRoute(routeTo(selected), now);
        drawFacing(selected);
      }
    }

    // items, back to front
    // items, walking guests and staff, back to front (seated guests are drawn by their chair)
    const list = items.map((it) => [depthOf(it), it.y, it, null]);
    for (const c of customers) if (!c.seated) list.push([c.x + c.y + 0.02, c.y, null, c]);
    for (const b of staffBodies()) list.push([b.x + b.y + 0.02, b.y, null, b]);
    list.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    for (const [, , it, c] of list) {
      if (it) drawItem(it, now, drag && drag.item === it ? 0.3 : 1);
      else {
        drawChibi(c, c.x, c.y, 0, false, now);
        if (c.role) drawStaffBits(c, now);
      }
    }

    // ghost previews
    if (drag && drag.tx !== null) {
      drawGhost(drag.item.id, drag.tx, drag.ty, drag.item.rot, drag.item.variant, drag.reason, now);
    } else if (CATALOG[tool]) {
      const c = hover.show ? hover : kbd.show ? kbd : null;
      if (c && inside(c.x, c.y)) {
        const cand = { id: tool, x: c.x, y: c.y, rot: ghostRot };
        drawGhost(tool, c.x, c.y, ghostRot, nextVariant[tool] || 0, checkPlace(cand, null), now);
      }
    }

    // night glows
    if (glows.length) {
      ctx.globalCompositeOperation = 'lighter';
      for (let q = 0; q < glows.length; q += 4) {
        const x = glows[q], y = glows[q + 1], r = glows[q + 2], a = glows[q + 3];
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(255,214,150,' + a.toFixed(3) + ')');
        g.addColorStop(1, 'rgba(255,214,150,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // speech bubbles and coin pops float above everything
    for (const c of customers) if (c.bubble) drawBubble(c);
    drawPops();

    // dust
    for (const p of puffs) {
      const a = 1 - p.life / p.max;
      ctx.fillStyle = lit([240, 226, 214], 1, (0.8 * a).toFixed(3));
      ctx.beginPath();
      ctx.arc(PX(p.x, p.y), PY(p.x, p.y, p.z), Math.max(0.1, p.r * (1 + p.life * 1.6)), 0, Math.PI * 2);
      ctx.fill();
    }

    // tile cursor
    const c = drag ? null : hover.show ? hover : kbd.show ? kbd : null;
    const pt = paintTarget();
    if (pt && pt.side) {
      const mk = pt.side === 'A' ? wallA : wallB;
      poly(mk([[pt.i + 0.03, 1], [pt.i + 0.97, 1], [pt.i + 0.97, WALL_H - 1], [pt.i + 0.03, WALL_H - 1]]));
      ctx.setLineDash([5, 4]);
      ctx.lineDashOffset = reduced ? 0 : -now * 0.02;
      ctx.strokeStyle = 'rgba(255,250,240,0.95)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.setLineDash([]);
    } else if (c && inside(c.x, c.y)) {
      footprintPath(c.x, c.y, 1, 1, 0.8);
      ctx.setLineDash([5, 4]);
      ctx.lineDashOffset = reduced ? 0 : -now * 0.02;
      ctx.strokeStyle = tool === 'remove' ? 'rgba(232,130,118,0.95)' : 'rgba(255,250,240,0.95)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawCoinFlights();
  }

  // ===== ACTIONS =====
  /* ================================================================
     Actions
     ================================================================ */
  function toast(msg) {
    placeToast();
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => toastEl.classList.remove('show'), 1900);
  }
  function announce(msg) {
    statusEl.textContent = '';
    setTimeout(() => { statusEl.textContent = msg; }, 30);
  }
  const nameOf = (id) => CATALOG[id].name;
  function labelOf(it) {
    if (it.id === 'chair_01') return seatTable(it) ? 'Dining chair' : 'Waiting chair';
    return nameOf(it.id);
  }

  function placeAt(x, y) {
    const cand = { id: tool, x, y, rot: ghostRot, variant: nextVariant[tool] || 0, born: performance.now(), anim: 'pop' };
    const reason = checkPlace(cand, null);
    if (reason) { toast(REASON[reason]); announce(REASON[reason] + '.'); return false; }
    const price = priceOfItem(cand.id, cand.variant);
    if (!spend(price, designName(cand.id, cand.variant))) return false;
    if (reduced) cand.born = performance.now();
    items.push(cand);
    const [w, d] = dims(cand.id, cand.rot);
    spawnRing(x, y, w, d);
    spendPop(x + w / 2, y + d / 2, CATALOG[cand.id].h, price);
    layoutChanged();
    saveSoon();
    announce(nameOf(cand.id) + ' placed at ' + (x + 1) + ', ' + (y + 1) + (price ? ' for ' + price + ' coins' : '') + '.');
    return true;
  }
  /* ---------------- buying ---------------- */
  const wallName = (side, i) => (side === 'A' ? 'Right wall' : 'Left wall') + ', piece ' + (i + 1);
  const designName = (id, v) => nameOf(id) + ' (' + VARIANTS[id].list[v | 0].name + ')';
  /* Takes the coins, or blocks the action with a message. Free things always pass. */
  function spend(price, what) {
    if (price <= 0) return true;
    if (coins < price) {
      const msg = 'Not enough coins: ' + what + ' costs ' + price + ', you have ' + fmt(coins);
      toast(msg);
      announce(msg + '.');
      coinIcon.classList.remove('bump');
      void coinIcon.getBoundingClientRect();
      coinIcon.classList.add('bump');
      return false;
    }
    coins -= price;
    shownCoins = Math.min(shownCoins, coins);
    updateMoneyHud();
    return true;
  }
  /* a small "-N" floating up from where something was bought (tile coordinates, z in px) */
  function spendPop(x, y, z, price) {
    if (price > 0) pops.push({ x: PX(x, y), y: PY(x, y, z), amount: -price, t: 0 });
  }
  /* Running total of the current decorating run: it counts every paid paint click and
     resets when the player leaves the paint tool or taps the total. */
  const bill = { total: 0, tiles: 0 };
  function resetBill() { bill.total = 0; bill.tiles = 0; }
  /* One click paints one piece: a floor tile or a wall segment. Repainting replaces the old
     design and charges the new price. target is { x, y } for the floor, { side, i } for a wall. */
  function paintAt(target) {
    if (!paint || !target) return false;
    const wall = paint.kind === 'wall';
    const style = (wall ? WALL_STYLES : FLOOR_STYLES)[paint.i];
    const arr = wall ? (target.side === 'A' ? decor.wallA : decor.wallB) : decor.floor;
    const at = wall ? target.i : target.x + target.y * MAX_GRID;
    const where = wall ? wallName(target.side, target.i) : 'Tile ' + (target.x + 1) + ', ' + (target.y + 1);
    if (arr[at] === paint.i) {
      toast('That piece already has ' + style.name);
      announce(where + ' already has ' + style.name + '.');
      return false;
    }
    const price = priceOfStyle(style);
    if (!spend(price, style.name + (wall ? ' wallpaper' : ' floor'))) return false;
    arr[at] = paint.i;
    bill.total += price; bill.tiles++;
    if (wall) {
      if (target.side === 'A') { spawnRing(target.i, 0, 1, 0); spendPop(target.i + 0.5, 0, 40, price); }
      else { spawnRing(0, target.i, 0, 1); spendPop(0, target.i + 0.5, 40, price); }
    } else { spawnRing(target.x, target.y, 1, 1); spendPop(target.x + 0.5, target.y + 0.5, 6, price); }
    updateContext();
    saveSoon();
    announce(where + ' is now ' + style.name + (price ? ', ' + price + ' coins' : '') + '. ' + (price ? bill.total + ' coins spent so far.' : ''));
    return true;
  }
  function removeItem(it) {
    if (!it) return;
    const [w, d] = dims(it.id, it.rot);
    spawnPuff(it.x, it.y, w, d);
    items = items.filter((o) => o !== it);
    if (selected === it) select(null);
    layoutChanged();
    saveSoon();
    announce(nameOf(it.id) + ' removed.');
    try {
      const ua = navigator.userActivation;
      if (navigator.vibrate && (!ua || ua.hasBeenActive)) navigator.vibrate(12);
    } catch (e) { /* ignore */ }
  }
  function moveItem(it, x, y) {
    if (x === it.x && y === it.y) return true;
    const cand = { id: it.id, x, y, rot: it.rot };
    const reason = checkPlace(cand, it);
    if (reason) { toast(REASON[reason]); announce(REASON[reason] + '.'); return false; }
    it.x = x; it.y = y;
    it.born = performance.now(); it.anim = 'wobble';
    const [w, d] = dims(it.id, it.rot);
    spawnRing(x, y, w, d);
    layoutChanged();
    saveSoon();
    announce(nameOf(it.id) + ' moved to ' + (x + 1) + ', ' + (y + 1) + '.');
    return true;
  }
  /* why a turn is blocked, in words; names the item in the way when there is one */
  function rotateBlockedText(cand, it, reason) {
    if (reason === 'outside') return 'Can’t turn it here: it would stick out of the room';
    if (reason === 'taken') {
      const other = cells(cand).map(([cx, cy]) => itemOnTile(cx, cy)).find((o) => o && o !== it);
      return 'Can’t turn it here: it would bump into the ' + (other ? labelOf(other).toLowerCase() : 'furniture');
    }
    return REASON[reason];
  }
  function rotate() {
    if (selected) {
      const it = selected;
      const cand = { id: it.id, x: it.x, y: it.y, rot: (it.rot + 1) % 4 };
      const reason = checkPlace(cand, it);
      if (reason) {
        const msg = rotateBlockedText(cand, it, reason);
        toast(msg);
        announce(msg + '.');
        if (!reduced) { it.born = performance.now(); it.anim = 'nope'; }
        return;
      }
      it.rot = cand.rot;
      it.born = performance.now(); it.anim = 'wobble';
      layoutChanged();
      saveSoon();
      announce(nameOf(it.id) + ' rotated.');
    } else if (CATALOG[tool]) {
      ghostRot = (ghostRot + 1) % 4;
      announce(nameOf(tool) + ' will face a new direction.');
    } else {
      toast('Tap an item first, then rotate it');
      announce('Select an item to rotate.');
    }
  }
  function select(it) {
    selected = it;
    updateContext();
    if (it) announce(nameOf(it.id) + ' selected. Drag to move, R to rotate, Delete to remove.');
  }
  function updateContext() {
    renderVariantPop();
    const painting = tool === 'paint' && paint;
    ctxBill.hidden = !painting;
    ctxRotate.hidden = !!painting;
    if (selected) {
      contextEl.hidden = false;
      ctxLbl.textContent = labelOf(selected);
      ctxRemove.hidden = false;
      ctxDone.hidden = false;
      ctxRotate.setAttribute('aria-label', 'Rotate ' + nameOf(selected.id));
    } else if (painting) {
      const style = (paint.kind === 'wall' ? WALL_STYLES : FLOOR_STYLES)[paint.i];
      const price = priceOfStyle(style);
      contextEl.hidden = false;
      ctxLbl.textContent = (paint.kind === 'wall' ? 'Wallpaper: ' : 'Floor: ') + style.name + ' · ' + (price ? price + ' each' : 'free');
      ctxRemove.hidden = true;
      ctxDone.hidden = false;
      ctxDone.setAttribute('aria-label', 'Finish decorating');
      ctxBill.innerHTML = DEV_MODE ? 'Free mode' : '<b>' + fmt(bill.total) + '</b> <small>spent</small>';
      ctxBill.setAttribute('aria-label', DEV_MODE ? 'Everything is free' : bill.total + ' coins spent on ' + bill.tiles + (bill.tiles === 1 ? ' piece' : ' pieces') + ' so far');
    } else if (CATALOG[tool]) {
      const price = priceOfItem(tool, nextVariant[tool] | 0);
      contextEl.hidden = false;
      ctxLbl.textContent = 'Placing ' + nameOf(tool).toLowerCase() + ' · ' + (price ? price + ' coins' : 'free');
      ctxRemove.hidden = true;
      ctxDone.hidden = true;
      ctxRotate.setAttribute('aria-label', 'Rotate ' + nameOf(tool) + ' before placing');
    } else if (tab === 'decor' && tool === 'move') {
      contextEl.hidden = false;
      ctxLbl.textContent = 'Pick a design, then tap the room';
      ctxRemove.hidden = true;
      ctxDone.hidden = true;
      ctxRotate.hidden = true;
    } else {
      contextEl.hidden = true;
    }
  }
  function selectTool(name, speak) {
    if (tool === 'paint' && name !== 'paint') endPaintRun();
    tool = name;
    for (const b of toolBtns) b.setAttribute('aria-pressed', b.dataset.tool === name ? 'true' : 'false');
    if (name !== 'move') selected = null;
    if (name !== 'paint') { paint = null; hoverWall.show = false; kwall.show = false; }
    updateContext();
    renderDecor();
    if (speak) announce(name === 'move' ? 'Move tool.' : name === 'remove' ? 'Remove tool.' : nameOf(name) + ' selected for placing.');
  }
  /* leaving the paint tool closes the run: say what it cost, start the next from zero */
  function endPaintRun() {
    if (bill.tiles && !DEV_MODE) {
      const msg = 'Decorating cost ' + fmt(bill.total) + ' coins for ' + bill.tiles + (bill.tiles === 1 ? ' piece' : ' pieces');
      toast(msg);
      announce(msg + '.');
    }
    resetBill();
  }
  const lastStyle = { wall: 0, floor: 0 };   // last design used for each kind
  function startPaint(kind, i) {
    paint = { kind, i };
    lastStyle[kind] = i;
    selectTool('paint', false);
    const style = (kind === 'wall' ? WALL_STYLES : FLOOR_STYLES)[i];
    announce((kind === 'wall' ? 'Wallpaper' : 'Floor') + ' ' + style.name + ' selected, ' + (priceOfStyle(style) ? priceOfStyle(style) + ' coins per piece' : 'free') + '. Tap the room to paint.');
  }

  /* XP (project.md 4): each happy guest gives xp by dish price; a level costs a little more than the last */
  const xpNeed = (lv) => 15 + 10 * (lv - 1);
  const xpForGuest = (dish) => 2 + Math.round(dish.suggest / 10);
  function addXp(n) {
    if (level >= MAX_LEVEL) return;
    const before = { lv: level, N, slots: menuSlots(), cap: staffCap() };
    xp += n;
    while (level < MAX_LEVEL && xp >= xpNeed(level)) {
      const carry = xp - xpNeed(level);
      setLevel(level + 1, true);
      xp = level >= MAX_LEVEL ? 0 : carry;
    }
    renderLevel();
    saveSoon();
    if (level === before.lv) return;
    const perks = [];
    if (N > before.N) perks.push('room grew to ' + N + '×' + N);
    if (menuSlots() > before.slots) perks.push('menu slot ' + menuSlots());
    for (const d of DISHES) if (d.unlock > before.lv && d.unlock <= level) perks.push(d.name + ' unlocked');
    if (staffCap() > before.cap) perks.push('room for ' + staffCap() + ' staff');
    for (const t of TIERS) if (t.unlock > before.lv && t.unlock <= level) perks.push(t.name + ' staff looking for work');
    const msg = 'Level ' + level + (perks.length ? ': ' + perks.join(', ') : '') + '!';
    toast(msg);
    announce(msg);
  }
  function setLevel(lv, quiet) {
    lv = clamp(lv, 1, MAX_LEVEL);
    const nn = gridFor(lv);
    if (nn < N && items.some((it) => cells(it).some(([cx, cy]) => cx >= nn || cy >= nn))) {
      toast('Clear the outer edge before shrinking the room');
      return;
    }
    const grew = nn > N;
    level = lv;
    xp = 0;
    if (nn !== N) {
      N = nn;
      kbd.x = Math.min(kbd.x, N - 1); kbd.y = Math.min(kbd.y, N - 1);
      fitCamera();
      if (!quiet) toast(grew ? 'The room grew to ' + N + '×' + N + '!' : 'Room is now ' + N + '×' + N);
    }
    menu = sanitizeMenu(menu);
    renderMenu();
    if (candidates.some((c) => TIERS[c.tier - 1].unlock > level)) rollCandidates();
    if (openSheet() === 'staff') renderStaff();
    renderLevel();
    layoutChanged();
    saveSoon();
  }
  /* ---------------- decor sheet: swatches are built from the style data ---------------- */
  function wallSwatchCss(s) {
    const h = s.hex;
    return 'linear-gradient(to bottom, transparent 56%, ' + h.trim + ' 56% 62%, ' + h.wainscot + ' 62% 88%, ' + h.base + ' 88%),' +
      'repeating-linear-gradient(90deg, ' + h.paper + ' 0 6px, ' + h.stripe + ' 6px 9px)';
  }
  const FLOOR_SWATCH = {
    checker: (h) => 'repeating-conic-gradient(' + h.a + ' 0 25%, ' + h.b + ' 0 50%) 0 0 / 22px 22px',
    wood: (h) => 'repeating-linear-gradient(0deg, ' + h.a + ' 0 10px, ' + h.c + ' 10px 11px, ' + h.b + ' 11px 21px, ' + h.c + ' 21px 22px)',
    stripes: (h) => 'repeating-linear-gradient(90deg, ' + h.a + ' 0 7px, ' + h.b + ' 7px 11px)',
    marble: (h) => 'linear-gradient(125deg, transparent 38%, ' + h.c + ' 41%, transparent 45%), linear-gradient(160deg, ' + h.a + ', ' + h.b + ')',
    dots: (h) => 'radial-gradient(' + h.b + ' 24%, transparent 27%) 0 0 / 11px 11px, ' + h.a,
    rug: (h) => 'linear-gradient(' + h.b + ', ' + h.b + ') center / 58% 58% no-repeat, linear-gradient(' + h.c + ', ' + h.c + ') center / 76% 76% no-repeat, ' + h.a
  };
  /* a design button: a colour face over its price. The price is data-price so the
     "can't afford" shading can be refreshed whenever the balance changes. */
  function makeDesign(face, label, price) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sw-item' + (price === 0 ? ' free' : '');
    b.dataset.price = price;
    b.innerHTML = '<span class="sw-face"></span><span class="sw-price">' + priceText(price) + '</span>';
    b.firstChild.style.background = face;
    b.title = label;
    b.setAttribute('aria-label', label + ', ' + (price === 0 ? 'free' : price + ' coins'));
    b.classList.toggle('poor', price > coins);
    return b;
  }
  let affordFor = -1;
  function refreshAfford() {
    if (affordFor === coins) return;
    affordFor = coins;
    for (const b of document.querySelectorAll('.sw-item')) b.classList.toggle('poor', +b.dataset.price > coins);
    for (const b of document.querySelectorAll('.chip.hire:not(.full)')) b.classList.toggle('poor', +b.dataset.price > coins);
  }
  const decorHost = document.getElementById('decor-swatches');
  const decorNote = document.getElementById('decor-note');
  const kindBtns = Array.from(document.querySelectorAll('.kind'));
  let decorKind = 'wall';
  function buildDecorRow() {
    const wall = decorKind === 'wall';
    decorHost.textContent = '';
    (wall ? WALL_STYLES : FLOOR_STYLES).forEach((st, i) => {
      const b = makeDesign(wall ? wallSwatchCss(st) : FLOOR_SWATCH[st.pattern](st.hex), (wall ? 'Wallpaper: ' : 'Floor: ') + st.name, priceOfStyle(st));
      b.addEventListener('click', () => {
        if (tool === 'paint' && paint && paint.kind === decorKind && paint.i === i) selectTool('move', false);   // tap again to stop
        else startPaint(decorKind, i);
      });
      decorHost.appendChild(b);
    });
    decorNote.textContent = DEV_MODE ? 'free mode' : wall ? 'coins per wall piece' : 'coins per floor tile';
    decorHost.setAttribute('aria-label', wall ? 'Wallpaper designs' : 'Floor designs');
    renderDecor();
  }
  function renderDecor() {
    for (const b of kindBtns) b.setAttribute('aria-pressed', b.dataset.kind === decorKind ? 'true' : 'false');
    const on = tool === 'paint' && paint && paint.kind === decorKind ? paint.i : -1;
    Array.from(decorHost.children).forEach((b, i) => b.setAttribute('aria-pressed', i === on ? 'true' : 'false'));
  }
  function setDecorKind(kind) {
    if (kind === decorKind) return;
    decorKind = kind;
    buildDecorRow();
    if (tool === 'paint') startPaint(kind, lastStyle[kind]);   // keep painting, with that kind's last design
  }
  for (const b of kindBtns) b.addEventListener('click', () => setDecorKind(b.dataset.kind));
  /* toolbar categories: Furniture / Decor / Tools */
  const TAB_OF = { table_01: 'furniture', chair_01: 'furniture', counter_01: 'furniture', plant_01: 'furniture', lantern_01: 'furniture', move: 'tools', remove: 'tools' };
  const tabBtns = Array.from(document.querySelectorAll('.tab'));
  let tab = 'furniture';
  function setTab(name, focus) {
    tab = name;
    if (name !== 'decor' && tool === 'paint') selectTool('move', false);
    for (const b of tabBtns) {
      const on = b.dataset.tab === name;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
      document.getElementById(b.getAttribute('aria-controls')).hidden = !on;
      if (on && focus) b.focus();
    }
    store.set(TAB_KEY, name);   // a view preference, kept apart from the shop save
    updateContext();
    hudChanged();
  }
  for (const b of tabBtns) {
    b.addEventListener('click', () => setTab(b.dataset.tab));
    b.addEventListener('keydown', (e) => {
      const i = tabBtns.indexOf(b), n = tabBtns.length;
      const to = e.key === 'ArrowRight' ? (i + 1) % n : e.key === 'ArrowLeft' ? (i + n - 1) % n : e.key === 'Home' ? 0 : e.key === 'End' ? n - 1 : -1;
      if (to < 0) return;
      e.preventDefault();
      e.stopPropagation();
      setTab(tabBtns[to].dataset.tab, true);
    });
  }

  /* the menu and staff sheets float over the room, one at a time */
  const SHEETS = {
    menu: { el: document.getElementById('menu-sheet'), btn: document.querySelector('.tool[data-action="menu"]'), render: () => renderMenu() },
    staff: { el: document.getElementById('staff-sheet'), btn: document.querySelector('.tool[data-action="staff"]'), render: () => renderStaff() }
  };
  function setSheet(name) {
    for (const k in SHEETS) {
      SHEETS[k].el.hidden = k !== name;
      SHEETS[k].btn.setAttribute('aria-pressed', k === name ? 'true' : 'false');
    }
