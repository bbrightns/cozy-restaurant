<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozy Restaurant</title>
<meta name="description" content="Decorate a tiny pastel isometric restaurant. Place, move, rotate and remove tables, chairs, counters, plants and lanterns. The sky follows your real clock.">
<meta name="theme-color" content="#cfe6f2">
<style>
  :root {
    --grass: #a8d5a2;
    --water: #7ec8e3;
    --road: #d6d0c4;
    --peach: #ffb5a7;
    --blush: #fcd5ce;
    --mint: #b8e0d2;
    --lav: #cdb4db;
    --cream: #fff8ef;
    --cream-2: #f9ecdf;
    --text: #5b4b57;
    --text-2: #84727f;
    --text-3: #a897a2;
    --gold: #f6d27a;
    --accent: #ffb5a7;
    --line: rgba(91, 75, 87, .13);
    --shadow: 0 12px 26px -14px rgba(108, 72, 104, .55), 0 2px 0 rgba(255, 252, 246, .8) inset;
    --font: ui-rounded, "Nunito", "Quicksand", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #cfe6f2;
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  #world {
    position: fixed;
    inset: 0;
    touch-action: none;
    outline: none;
    cursor: pointer;
  }
  #world.grabbing { cursor: grabbing; }
  #world canvas { width: 100%; height: 100%; display: block; }
  #world:focus-visible { box-shadow: inset 0 0 0 3px rgba(142, 110, 170, .55); }

  button {
    appearance: none;
    border: 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  :focus-visible { outline: 3px solid #9b7fc0; outline-offset: 2px; }
  button:focus:not(:focus-visible) { outline: none; }

  /* ---------- top HUD ---------- */
  .top {
    position: fixed;
    z-index: 3;
    top: 14px;
    left: 14px;
    right: 14px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .card {
    background: var(--cream);
    border-radius: 20px;
    box-shadow: var(--shadow);
  }
  .title-card {
    padding: 10px 12px 10px 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .title-card h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -.01em;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .title-card h1 svg { width: 28px; height: 28px; flex: none; }
  .clock { display: flex; align-items: center; gap: 8px; }
  .dial { width: 30px; height: 30px; flex: none; }
  .clock-read {
    margin: 0;
    font-weight: 800;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    min-width: 3.6em;
  }
  .clock-read small { display: block; font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: .04em; }
  .chip {
    background: var(--cream-2);
    border-radius: 999px;
    min-height: 44px;
    min-width: 44px;
    padding: 0 12px;
    font-size: 12.5px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), background .2s ease;
  }
  .chip svg { width: 16px; height: 16px; }
  .chip:hover { background: #f4e0cf; }
  .chip:active { transform: translateY(1px) scale(.96); }
  .chip[aria-pressed="true"] { background: var(--lav); }

  .level-card {
    padding: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .level-read { padding: 0 8px; text-align: center; line-height: 1.1; min-width: 74px; }
  .level-read b { display: block; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .level-read small { font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: .04em; }
  .step { font-size: 20px; font-weight: 800; padding: 0; width: 44px; }

  /* ---------- bottom HUD ---------- */
  .bottom {
    position: fixed;
    z-index: 3;
    left: 8px;
    right: 8px;
    bottom: max(10px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    pointer-events: none;
  }
  .bottom > * { pointer-events: auto; }
  .context {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 6px 5px 14px;
    border-radius: 999px;
    max-width: 100%;
    transition: opacity .25s ease, transform .3s cubic-bezier(.3, 1.6, .5, 1);
  }
  .context[hidden], .chip[hidden] { display: none; }
  .context .lbl { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .context .chip.warn { background: #fbd9d2; }
  .context .chip.warn:hover { background: #f8c9bf; }
  .toolbar {
    padding: 6px;
    border-radius: 24px;
    display: flex;
    gap: 4px;
    max-width: 100%;
  }
  .tool {
    flex: 1 1 0;
    min-width: 0;
    width: 70px;
    min-height: 56px;
    padding: 5px 2px 6px;
    border-radius: 17px;
    background: transparent;
    color: var(--text-2);
    display: grid;
    justify-items: center;
    align-content: center;
    gap: 2px;
    transition: background .25s ease, color .25s ease, transform .3s cubic-bezier(.3, 1.6, .5, 1);
  }
  .tool svg { width: 36px; height: 30px; transition: transform .35s cubic-bezier(.3, 1.8, .5, 1); }
  .tool span { font-size: 11.5px; font-weight: 800; }
  .tool:hover { background: var(--cream-2); color: var(--text); }
  .tool[aria-pressed="true"] {
    background: var(--tint, var(--mint));
    color: var(--text);
    transform: translateY(-5px);
    box-shadow: 0 10px 16px -10px rgba(108, 72, 104, .6);
  }
  .tool[aria-pressed="true"] svg { transform: translateY(-2px) scale(1.08); }
  .tool[data-tool="move"] { --tint: var(--mint); }
  .tool[data-tool="table_01"] { --tint: var(--blush); }
  .tool[data-tool="chair_01"] { --tint: #d6eee5; }
  .tool[data-tool="counter_01"] { --tint: var(--lav); }
  .tool[data-tool="plant_01"] { --tint: #d3ead0; }
  .tool[data-tool="lantern_01"] { --tint: #fbe7b8; }
  .tool[data-tool="remove"] { --tint: #fbd9d2; }

  .toast {
    position: fixed;
    z-index: 4;
    left: 50%;
    bottom: 150px;
    max-width: calc(100vw - 32px);
    transform: translate(-50%, 10px);
    background: #6d5a6a;
    color: var(--cream);
    font-size: 13px;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    text-align: center;
    transition: opacity .3s ease, transform .3s cubic-bezier(.3, 1.6, .5, 1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 640px) {
    .top { top: 8px; left: 8px; right: 8px; gap: 6px; }
    .title-card { padding: 4px 6px 4px 10px; gap: 8px; border-radius: 18px; }
    .title-card h1 { font-size: 15px; gap: 6px; }
    .title-card h1 svg { width: 22px; height: 22px; }
    .dial { width: 24px; height: 24px; }
    .clock-read { font-size: 13px; }
    .clock-read small { font-size: 10px; }
    .level-card { padding: 4px; border-radius: 18px; }
    .level-read { min-width: 60px; padding: 0 4px; }
    .level-read b { font-size: 14px; }
    .level-read small { font-size: 10px; }
    .toolbar { padding: 4px; gap: 2px; border-radius: 20px; }
    .tool { width: 48px; min-height: 52px; border-radius: 14px; }
    .tool svg { width: 30px; height: 25px; }
    .tool span { font-size: 9.5px; }
    .tool[aria-pressed="true"] { transform: translateY(-3px); }
    .chip .txt { display: none; }
    .toast { bottom: 136px; font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation: none !important; }
  }
</style>
</head>
<body>
<main id="world" tabindex="0" aria-label="Restaurant room. Tap a tile to place the selected item. With Move, tap an item to select it or drag it to a new spot. Right-click or long-press removes an item. Drag empty space to pan, scroll or pinch to zoom. Arrow keys move the cursor, Enter acts, R rotates, Delete removes." aria-describedby="status">
  <canvas id="scene" aria-hidden="true"></canvas>
</main>

<div class="top">
  <section class="card title-card" aria-label="Restaurant">
    <h1>
      <svg viewBox="0 0 28 28" aria-hidden="true">
        <path d="M14 5l11 5.5L14 16 3 10.5z" fill="#f6e2cf"/>
        <path d="M3 10.5L14 16v8L3 18.5z" fill="#e3c4a6"/>
        <path d="M25 10.5L14 16v8l11-5.5z" fill="#cfa98a"/>
        <path d="M9 9.2l5 2.5 5-2.5-5-2.5z" fill="#ffb5a7"/>
        <path d="M14 11.7v2.6l-5-2.5V9.2z" fill="#f29c8c"/>
        <path d="M14 11.7v2.6l5-2.5V9.2z" fill="#e48979"/>
        <circle cx="14" cy="6.4" r="1.6" fill="#b8e0d2"/>
      </svg>
      Cozy Restaurant
    </h1>
    <div class="clock">
      <svg class="dial" viewBox="0 0 30 30" aria-hidden="true">
        <circle cx="15" cy="15" r="13.5" fill="#f9ecdf"/>
        <path d="M1.5 15a13.5 13.5 0 0 1 27 0z" fill="#dcf0f8"/>
        <path d="M1.5 15a13.5 13.5 0 0 0 27 0z" fill="#4a4a80" opacity=".85"/>
        <g id="dial-hand"><circle cx="15" cy="4.8" r="3" fill="#f6d27a"/></g>
        <circle cx="15" cy="15" r="1.6" fill="#5b4b57"/>
      </svg>
      <p class="clock-read" id="clock">--:--<small id="phase">Day</small></p>
      <button type="button" class="chip" id="preview" aria-pressed="false" aria-label="Sky follows your clock. Tap to preview dawn.">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.4" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span class="txt" id="preview-lbl">Live</span>
      </button>
    </div>
  </section>
  <section class="card level-card" aria-label="Level (sandbox)">
    <button type="button" class="chip step" id="lv-down" aria-label="Lower level">&minus;</button>
    <p class="level-read" id="level-read" aria-live="polite"><b>Lv 1</b><small>5×5 room</small></p>
    <button type="button" class="chip step" id="lv-up" aria-label="Raise level">+</button>
  </section>
</div>

<div class="bottom">
  <div class="card context" id="context" hidden>
    <span class="lbl" id="ctx-lbl">Table</span>
    <button type="button" class="chip" id="ctx-rotate" aria-label="Rotate">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12.6 6A5 5 0 1 0 13 9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M13.6 2.4v4h-4z" fill="currentColor"/></svg>
      <span class="txt">Rotate</span>
    </button>
    <button type="button" class="chip warn" id="ctx-remove" aria-label="Remove selected item">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="txt">Remove</span>
    </button>
    <button type="button" class="chip" id="ctx-done" aria-label="Deselect">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="txt">Done</span>
    </button>
  </div>
  <nav class="card toolbar" role="toolbar" aria-label="Decorating tools">
    <button type="button" class="tool" data-tool="move" aria-pressed="true" aria-label="Move tool (1): select, drag and rotate items">
      <svg viewBox="0 0 40 34" aria-hidden="true">
        <path d="M20 4l4 4h-2.6v6.6H28V12l4 4-4 4v-2.6h-6.6V24H24l-4 4-4-4h2.6v-6.6H12V20l-4-4 4-4v2.6h6.6V8H16z" fill="#8fc7b5"/>
      </svg>
      <span>Move</span>
    </button>
    <button type="button" class="tool" data-tool="table_01" aria-pressed="false" aria-label="Table (2)">
      <svg viewBox="0 0 40 34" aria-hidden="true">
        <path d="M11 20v7M29 20v7M20 24v6" stroke="#c4966f" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M20 9l12 6-12 6-12-6z" fill="#ffd0c4"/>
        <path d="M8 15l12 6v4L8 19z" fill="#f4a294"/>
        <path d="M32 15l-12 6v4l12-6z" fill="#e48c7e"/>
        <circle cx="20" cy="11.5" r="2.4" fill="#b8e0d2"/>
      </svg>
      <span>Table</span>
    </button>
    <button type="button" class="tool" data-tool="chair_01" aria-pressed="false" aria-label="Chair (3)">
      <svg viewBox="0 0 40 34" aria-hidden="true">
        <path d="M14 21v8M26 21v8M20 24v6" stroke="#c4966f" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M14 5l12-0 0 12-12 0z" fill="#9fd2c1" transform="skewY(-26) translate(0 8)"/>
        <path d="M20 14l9 4.5-9 4.5-9-4.5z" fill="#b8e0d2"/>
        <path d="M11 18.5l9 4.5v2.5l-9-4.5z" fill="#d9b08c"/>
        <path d="M29 18.5L20 23v2.5l9-4.5z" fill="#c4966f"/>
      </svg>
      <span>Chair</span>
    </button>
    <button type="button" class="tool" data-tool="counter_01" aria-pressed="false" aria-label="Counter (4)">
      <svg viewBox="0 0 40 34" aria-hidden="true">
        <path d="M16 6l20 10-10 5L6 11z" fill="#fff1e2"/>
        <path d="M6 11l20 10v10L6 21z" fill="#cdb4db"/>
        <path d="M36 16l-10 5v10l10-5z" fill="#b39cc6"/>
        <path d="M6 16l20 10v2L6 18z" fill="#fcd5ce"/>
        <path d="M14 8.5a3 3 0 0 1 6 0z" fill="#ffb5a7"/>
      </svg>
      <span>Counter</span>
    </button>
    <button type="button" class="tool" data-tool="plant_01" aria-pressed="false" aria-label="Plant (5)">
      <svg viewBox="0 0 40 34" aria-hidden="true">
        <ellipse cx="14" cy="12" rx="4" ry="8" transform="rotate(-30 14 12)" fill="#94c98d"/>
        <ellipse cx="26" cy="12" rx="4" ry="8" transform="rotate(30 26 12)" fill="#94c98d"/>
        <ellipse cx="20" cy="9" rx="4" ry="8.5" fill="#b4dcaa"/>
        <path d="M14 21h12l-1.6 10h-8.8z" fill="#f2b09c"/>
        <rect x="13" y="19.5" width="14" height="3.5" rx="1.5" fill="#f8c7b6"/>
      </svg>
      <span>Plant</span>
    </button>
    <button type="button" class="tool" data-tool="lantern_01" aria-pressed="false" aria-label="Lantern (6)">
      <svg viewBox="0 0 40 34" aria-hidden="true">
        <path d="M20 18v13" stroke="#c4966f" stroke-width="2.4" stroke-linecap="round"/>
        <ellipse cx="20" cy="31" rx="5" ry="2" fill="#c4966f"/>
        <circle cx="20" cy="11" r="9" fill="#fbe7b8" opacity=".6"/>
        <ellipse cx="20" cy="11" rx="5.5" ry="6.5" fill="#f6d27a"/>
        <path d="M17 4.6h6M17 17.4h6" stroke="#c4966f" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Lantern</span>
    </button>
    <button type="button" class="tool" data-tool="remove" aria-pressed="false" aria-label="Remove tool (7)">
      <svg viewBox="0 0 40 34" aria-hidden="true">
        <path d="M11 9h18" stroke="#e8968a" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M16.5 9V6h7v3" fill="none" stroke="#e8968a" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M13 11h14l-1.4 18H14.4z" fill="#f6b3a8"/>
        <path d="M17.5 14.5v11M22.5 14.5v11" stroke="#fde6e0" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>Remove</span>
    </button>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<p class="sr-only" id="status" aria-live="polite"></p>

<script>
(() => {
  'use strict';

  /* ================================================================
     Cozy Restaurant, Phase 1: decorate sandbox
     Isometric room, place / move / rotate / remove, level-based room
     size, real-time sky, localStorage.
     ================================================================ */

  const TW = 32, TH = 16;           // half tile width / height in world px
  const WALL_H = 74, WALL_T = 0.2, SLAB = 16;
  const MAX_GRID = 12, MAX_LEVEL = 60;
  const DOOR = { x: 1, y: 0 };       // floor tile just inside the front door
  const SAVE_KEY = 'cozy-restaurant-v1';
  // facing directions for rot 0..3, clockwise on screen
  const DIRS = [[0, 1], [-1, 0], [0, -1], [1, 0]];
  const STEPS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  const world = document.getElementById('world');
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const toastEl = document.getElementById('toast');
  const statusEl = document.getElementById('status');
  const clockEl = document.getElementById('clock');
  const phaseEl = document.getElementById('phase');
  const dialHand = document.getElementById('dial-hand');
  const previewBtn = document.getElementById('preview');
  const previewLbl = document.getElementById('preview-lbl');
  const levelRead = document.getElementById('level-read');
  const lvDown = document.getElementById('lv-down');
  const lvUp = document.getElementById('lv-up');
  const contextEl = document.getElementById('context');
  const ctxLbl = document.getElementById('ctx-lbl');
  const ctxRotate = document.getElementById('ctx-rotate');
  const ctxRemove = document.getElementById('ctx-remove');
  const ctxDone = document.getElementById('ctx-done');
  const toolBtns = Array.from(document.querySelectorAll('.tool'));

  const reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
  let reduced = reduceMQ.matches;

  /* ---------------- guarded storage ---------------- */
  const store = {
    get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  };

  /* ---------------- small helpers ---------------- */
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function noise(a, b) {
    let h = Math.imul(a + 11, 2654435761) ^ Math.imul(b + 3, 1597334677);
    h = Math.imul(h ^ (h >>> 15), 2246822507);
    return ((h ^ (h >>> 13)) >>> 0) / 4294967296;
  }

  /* ---------------- palette ---------------- */
  const P = {
    floorA: rgb('#f7eadb'), floorB: rgb('#f2dccb'),
    slab: rgb('#e6c7a8'), slabDeep: rgb('#cfa686'),
    paper: rgb('#fcdcd4'), paperStripe: rgb('#fde7e1'),
    wainscot: rgb('#b8e0d2'), trim: rgb('#fff3e4'), base: rgb('#9fcab9'),
    wood: rgb('#d9b08c'), woodDeep: rgb('#c4966f'),
    cloth: rgb('#ffb5a7'), clothHi: rgb('#ffd3c7'),
    cushion: rgb('#b8e0d2'), cushionHi: rgb('#cfeadf'),
    lav: rgb('#cdb4db'), lavDeep: rgb('#b39cc6'), blush: rgb('#fcd5ce'), counterTop: rgb('#fff1e2'),
    leaf: rgb('#94c98d'), leafHi: rgb('#b6dcab'), pot: rgb('#f2b09c'), potHi: rgb('#f8c7b6'),
    gold: rgb('#f6d27a'), paperLamp: rgb('#ffe6bf'), glow: rgb('#ffdc9a'),
    door: rgb('#c0a6d3'), doorDeep: rgb('#a98fc0'), glass: rgb('#dcf0f8'),
    mat: rgb('#ffb5a7'), matHi: rgb('#ffd0c4'), cake: rgb('#ffc2cf'), cream: rgb('#fff6ea'),
    bad: rgb('#f2998c')
  };

  /* ================================================================
     Catalog
     ================================================================ */
  const CATALOG = {
    table_01: { name: 'Table', w: 1, d: 1, h: 30, draw: drawTable },
    chair_01: { name: 'Chair', w: 1, d: 1, h: 28, seat: true, draw: drawChair },
    counter_01: { name: 'Counter', w: 2, d: 1, h: 40, draw: drawCounter },
    plant_01: { name: 'Plant', w: 1, d: 1, h: 42, draw: drawPlant },
    lantern_01: { name: 'Lantern', w: 1, d: 1, h: 50, light: true, draw: drawLantern }
  };
  const TOOL_ORDER = ['move', 'table_01', 'chair_01', 'counter_01', 'plant_01', 'lantern_01', 'remove'];

  function dims(id, rot) {
    const c = CATALOG[id];
    return rot % 2 ? [c.d, c.w] : [c.w, c.d];
  }
  function cells(it) {
    const [w, d] = dims(it.id, it.rot);
    const out = [];
    for (let dy = 0; dy < d; dy++) for (let dx = 0; dx < w; dx++) out.push([it.x + dx, it.y + dy]);
    return out;
  }

  /* ================================================================
     Shop state
     ================================================================ */
  let level = 1;
  let N = 5;
  let items = [];   // { id, x, y, rot, born, anim }
  const gridFor = (lv) => Math.min(MAX_GRID, 5 + Math.floor(lv / 5));
  const inside = (x, y) => x >= 0 && y >= 0 && x < N && y < N;

  function itemOnTile(x, y) {
    for (const it of items) {
      const [w, d] = dims(it.id, it.rot);
      if (x >= it.x && x < it.x + w && y >= it.y && y < it.y + d) return it;
    }
    return null;
  }

  /* Every seat needs a walkable route from the door. */
  function pathsOk(list) {
    const blocked = new Uint8Array(N * N);
    for (const it of list) for (const [cx, cy] of cells(it)) blocked[cx + cy * N] = 1;
    const start = DOOR.x + DOOR.y * N;
    if (blocked[start]) return false;
    const seen = new Uint8Array(N * N);
    const stack = [start];
    seen[start] = 1;
    while (stack.length) {
      const k = stack.pop();
      const x = k % N, y = (k / N) | 0;
      for (const [sx, sy] of STEPS) {
        const nx = x + sx, ny = y + sy;
        if (!inside(nx, ny)) continue;
        const nk = nx + ny * N;
        if (blocked[nk] || seen[nk]) continue;
        seen[nk] = 1;
        stack.push(nk);
      }
    }
    for (const it of list) {
      if (!CATALOG[it.id].seat) continue;
      let ok = false;
      for (const [sx, sy] of STEPS) {
        const nx = it.x + sx, ny = it.y + sy;
        if (inside(nx, ny) && seen[nx + ny * N]) { ok = true; break; }
      }
      if (!ok) return false;
    }
    return true;
  }

  function blockedGrid() {
    const blocked = new Uint8Array(N * N);
    for (const it of items) for (const [cx, cy] of cells(it)) if (inside(cx, cy)) blocked[cx + cy * N] = 1;
    return blocked;
  }

  /* A* on the floor grid, 4-way. The start and goal may be blocked
     (a customer standing up from a chair, or walking onto one).
     Returns a list of [x, y] tiles from start to goal, or null. */
  function astar(sx, sy, gx, gy, blocked) {
    if (!inside(sx, sy) || !inside(gx, gy)) return null;
    const total = N * N, start = sx + sy * N, goal = gx + gy * N;
    const g = new Float32Array(total).fill(Infinity);
    const came = new Int16Array(total).fill(-1);
    const closed = new Uint8Array(total);
    const h = (k) => Math.abs((k % N) - gx) + Math.abs(((k / N) | 0) - gy);
    const open = [start];
    g[start] = 0;
    while (open.length) {
      let bi = 0, bf = Infinity;
      for (let q = 0; q < open.length; q++) {
        const f = g[open[q]] + h(open[q]);
        if (f < bf) { bf = f; bi = q; }
      }
      const k = open[bi];
      open[bi] = open[open.length - 1];
      open.pop();
      if (k === goal) {
        const path = [];
        for (let c = goal; c !== -1; c = came[c]) path.push([c % N, (c / N) | 0]);
        return path.reverse();
      }
      if (closed[k]) continue;
      closed[k] = 1;
      const x = k % N, y = (k / N) | 0;
      for (const [dx, dy] of STEPS) {
        const nx = x + dx, ny = y + dy;
        if (!inside(nx, ny)) continue;
        const nk = nx + ny * N;
        if (closed[nk] || (blocked[nk] && nk !== goal)) continue;
        const ng = g[k] + 1;
        if (ng < g[nk]) { g[nk] = ng; came[nk] = k; open.push(nk); }
      }
    }
    return null;
  }

  /* A chair facing a table is a dining seat; any other chair is a waiting chair. */
  function seatTable(chair) {
    const [dx, dy] = DIRS[chair.rot];
    const t = itemOnTile(chair.x + dx, chair.y + dy);
    return t && t.id === 'table_01' ? t : null;
  }

  let layoutVersion = 0;
  function layoutChanged() {
    layoutVersion++;
    updateContext();
  }

  /* Returns '' when the item fits, otherwise a reason key. */
  function checkPlace(cand, ignore) {
    const others = items.filter((it) => it !== ignore);
    for (const [cx, cy] of cells(cand)) {
      if (!inside(cx, cy)) return 'outside';
      if (cx === DOOR.x && cy === DOOR.y) return 'door';
      for (const o of others) {
        const [w, d] = dims(o.id, o.rot);
        if (cx >= o.x && cx < o.x + w && cy >= o.y && cy < o.y + d) return 'taken';
      }
    }
    others.push(cand);
    if (!pathsOk(others)) return 'path';
    return '';
  }
  const REASON = {
    outside: 'That doesn’t fit inside the room',
    door: 'Keep the doorway clear',
    taken: 'Something is already there',
    path: 'That would block the way to a chair'
  };

  function defaultLayout() {
    return [
      { id: 'counter_01', x: 3, y: 0, rot: 0 },
      { id: 'plant_01', x: 0, y: 0, rot: 0 },
      // row 1 and column 2 stay clear as a walkway from the door
      { id: 'table_01', x: 0, y: 3, rot: 0 },
      { id: 'chair_01', x: 0, y: 2, rot: 0 },
      { id: 'chair_01', x: 1, y: 3, rot: 1 },
      { id: 'table_01', x: 4, y: 3, rot: 0 },
      { id: 'chair_01', x: 3, y: 3, rot: 3 },
      { id: 'chair_01', x: 4, y: 2, rot: 0 },
      { id: 'lantern_01', x: 0, y: 4, rot: 0 },
      { id: 'plant_01', x: 4, y: 4, rot: 0 }
    ];
  }

  /* Adds items one by one, keeping only ones that are valid. */
  function adoptItems(list, animate) {
    items = [];
    const now = performance.now();
    let q = 0;
    for (const raw of list) {
      if (!raw || !CATALOG[raw.id]) continue;
      const it = { id: raw.id, x: raw.x | 0, y: raw.y | 0, rot: ((raw.rot | 0) % 4 + 4) % 4, born: 0, anim: 'pop' };
      if (checkPlace(it, null)) continue;
      if (animate && !reduced) it.born = now + 120 + q++ * 70;
      items.push(it);
    }
  }

  function save() {
    const data = { v: 1, level, interior: { gridSize: N, items: items.map((it) => ({ id: it.id, x: it.x, y: it.y, rot: it.rot })) } };
    store.set(SAVE_KEY, JSON.stringify(data));
  }
  let saveTimer = 0;
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }
  function load() {
    const raw = store.get(SAVE_KEY);
    if (!raw) return false;
    try {
      const d = JSON.parse(raw);
      if (!d || d.v !== 1 || !d.interior || !Array.isArray(d.interior.items)) return false;
      level = clamp(Math.floor(+d.level) || 1, 1, MAX_LEVEL);
      N = gridFor(level);
      adoptItems(d.interior.items, true);
      return true;
    } catch (e) { return false; }
  }

  /* ================================================================
     Real-time sky and light
     ================================================================ */
  // hour, ambient multiply, sky top, sky horizon, night amount
  const NIGHT_AMB = [0.7, 0.66, 0.9];
  const KEYS = [
    [0.0, NIGHT_AMB, '#262c5a', '#4c4c84', 1],
    [4.5, NIGHT_AMB, '#262c5a', '#4c4c84', 1],
    [6.0, [1.0, 0.86, 0.9], '#aab6e6', '#ffc8d0', 0.35],
    [7.5, [1, 1, 1], '#9fd3ee', '#e6f5fb', 0],
    [16.5, [1, 1, 1], '#9fd3ee', '#e6f5fb', 0],
    [18.0, [1.0, 0.84, 0.8], '#9c88c2', '#ffc0a3', 0.35],
    [19.5, NIGHT_AMB, '#262c5a', '#4c4c84', 1],
    [24.0, NIGHT_AMB, '#262c5a', '#4c4c84', 1]
  ];
  const light = { hour: 12, amb: [1, 1, 1], top: [159, 211, 238], low: [230, 245, 251], night: 0, sun: 0 };
  const PREVIEWS = [null, 6, 12, 18, 22];
  const PREVIEW_NAMES = ['Live', 'Dawn', 'Day', 'Dusk', 'Night'];
  let previewIdx = 0;

  function phaseName(h) {
    if (h >= 5 && h < 7) return 'Dawn';
    if (h >= 7 && h < 17) return 'Day';
    if (h >= 17 && h < 19) return 'Dusk';
    return 'Night';
  }
  function currentHour() {
    const p = PREVIEWS[previewIdx];
    if (p !== null) return p;
    const d = new Date();
    return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
  }
  function mix3(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
  let shownHour = null;
  function updateLight(dt) {
    const target = currentHour();
    // ease toward preview jumps so the sky blends instead of snapping
    if (shownHour === null || reduced) shownHour = target;
    else {
      let diff = target - shownHour;
      if (diff > 12) diff -= 24;
      if (diff < -12) diff += 24;
      shownHour = (shownHour + diff * Math.min(1, dt * 2.5) + 24) % 24;
    }
    const h = shownHour;
    let k = 0;
    while (k < KEYS.length - 2 && KEYS[k + 1][0] <= h) k++;
    const a = KEYS[k], b = KEYS[k + 1];
    const f = clamp((h - a[0]) / (b[0] - a[0]), 0, 1);
    const s = f * f * (3 - 2 * f);
    light.hour = h;
    light.amb = mix3(a[1], b[1], s);
    light.top = mix3(rgb(a[2]), rgb(b[2]), s);
    light.low = mix3(rgb(a[3]), rgb(b[3]), s);
    light.night = lerp(a[4], b[4], s);
    light.sun = clamp((h - 12) / 6, -1, 1);
  }

  function lit(c, f, a) {
    const r = clamp(c[0] * light.amb[0] * f, 0, 255) | 0;
    const g = clamp(c[1] * light.amb[1] * f, 0, 255) | 0;
    const b = clamp(c[2] * light.amb[2] * f, 0, 255) | 0;
    return a === undefined ? 'rgb(' + r + ',' + g + ',' + b + ')' : 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  const css = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';

  /* ================================================================
     Camera
     ================================================================ */
  let W = 0, H = 0, DPR = 1;
  const cam = { x: 0, y: 0, zoom: 1, fit: 1 };
  function fitCamera() {
    const left = -N * TW - WALL_T * TW, right = N * TW;
    const top = -WALL_H - WALL_T * TH * 2 - 6, bottom = 2 * N * TH + SLAB + 10;
    const narrow = W < 640;
    const padTop = narrow ? 112 : 96, padBot = narrow ? 128 : 140, padX = narrow ? 14 : 60;
    const availW = Math.max(100, W - padX * 2), availH = Math.max(100, H - padTop - padBot);
    cam.fit = clamp(Math.min(availW / (right - left), availH / (bottom - top)), 0.35, 2.6);
    cam.zoom = cam.fit;
    cam.x = padX + availW / 2 - ((left + right) / 2) * cam.zoom;
    cam.y = padTop + availH / 2 - ((top + bottom) / 2) * cam.zoom;
  }
  function zoomAt(sx, sy, factor) {
    const nz = clamp(cam.zoom * factor, cam.fit * 0.6, cam.fit * 3);
    const f = nz / cam.zoom;
    cam.x = sx - (sx - cam.x) * f;
    cam.y = sy - (sy - cam.y) * f;
    cam.zoom = nz;
  }
  /* screen point -> floor coordinates; lift raises the sample point by z world px */
  function floorAt(sx, sy, lift) {
    const wx = (sx - cam.x) / cam.zoom, wy = (sy - cam.y) / cam.zoom + (lift || 0);
    const a = wx / TW, b = wy / TH;
    return [(a + b) / 2, (b - a) / 2];
  }
  function tileAt(sx, sy, lift) {
    const [fx, fy] = floorAt(sx, sy, lift);
    const x = Math.floor(fx), y = Math.floor(fy);
    return inside(x, y) ? [x, y] : null;
  }
  function resize() {
    W = world.clientWidth || window.innerWidth;
    H = world.clientHeight || window.innerHeight;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
    fitCamera();
  }

  /* ================================================================
     Drawing primitives. World: x, y in tiles, z in px (up).
     ================================================================ */
  const PX = (x, y) => (x - y) * TW;
  const PY = (x, y, z) => (x + y) * TH - z;
  function poly(pts) {
    ctx.beginPath();
    for (let q = 0; q < pts.length; q++) {
      const p = pts[q];
      if (q) ctx.lineTo(PX(p[0], p[1]), PY(p[0], p[1], p[2]));
      else ctx.moveTo(PX(p[0], p[1]), PY(p[0], p[1], p[2]));
    }
    ctx.closePath();
  }
  function flat(x0, y0, x1, y1, z) { poly([[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]]); }

  /* Box with top lightest, +y face mid, +x face darkest, AO toward the floor. */
  function box(x0, y0, x1, y1, z0, z1, col, o) {
    o = o || {};
    const fl = 0.9 - 0.04 * light.sun, fr = 0.77 + 0.04 * light.sun;
    const xm = (x0 + x1) / 2, ym = (y0 + y1) / 2;
    poly([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]]);
    let g = ctx.createLinearGradient(0, PY(xm, y1, z1), 0, PY(xm, y1, z0) + 4);
    g.addColorStop(0, lit(col, fl));
    g.addColorStop(1, lit(col, fl * 0.84));
    ctx.fillStyle = g;
    ctx.fill();
    poly([[x1, y1, z0], [x1, y0, z0], [x1, y0, z1], [x1, y1, z1]]);
    g = ctx.createLinearGradient(0, PY(x1, ym, z1), 0, PY(x1, ym, z0) + 4);
    g.addColorStop(0, lit(col, fr));
    g.addColorStop(1, lit(col, fr * 0.84));
    ctx.fillStyle = g;
    ctx.fill();
    if (!o.noTop) {
      flat(x0, y0, x1, y1, z1);
      ctx.fillStyle = lit(o.top || col, 1.04);
      ctx.fill();
      // thin highlight on the two front top edges
      ctx.beginPath();
      ctx.moveTo(PX(x0, y1), PY(x0, y1, z1));
      ctx.lineTo(PX(x1, y1), PY(x1, y1, z1));
      ctx.lineTo(PX(x1, y0), PY(x1, y0, z1));
      ctx.strokeStyle = 'rgba(255,250,242,' + (0.45 * (1 - light.night * 0.6)).toFixed(3) + ')';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }
  function contact(cx, cy, r, a) {
    ctx.fillStyle = 'rgba(122,82,118,' + (a || 0.18) + ')';
    ctx.beginPath();
    ctx.ellipse(PX(cx, cy), PY(cx, cy, 0), Math.max(0.1, r * TW * 1.4), Math.max(0.1, r * TH * 1.4), 0, 0, Math.PI * 2);
    ctx.fill();
  }
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
  }

  /* glow sprites gathered during a frame, blended additively at the end */
  const glows = [];
  const pools = [];

  /* ================================================================
     Items
     ================================================================ */
  function drawTable(it) {
    const x = it.x, y = it.y;
    contact(x + 0.5, y + 0.5, 0.36);
    const legs = [[0.2, 0.2], [0.74, 0.2], [0.2, 0.74], [0.74, 0.74]];
    for (const [lx, ly] of legs) box(x + lx, y + ly, x + lx + 0.06, y + ly + 0.06, 0, 13, P.woodDeep);
    // tablecloth with a short skirt
    box(x + 0.12, y + 0.12, x + 0.88, y + 0.88, 11, 18, P.cloth, { top: P.clothHi });
    // scalloped trim on the visible skirt edges
    ctx.fillStyle = lit(P.cream, 0.98, 0.85);
    for (let q = 0; q < 4; q++) {
      const t = 0.12 + (q + 0.5) * 0.19;
      ctx.beginPath(); ctx.arc(PX(x + t, y + 0.88), PY(x + t, y + 0.88, 11.6), 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(PX(x + 0.88, y + t), PY(x + 0.88, y + t, 11.6), 1.5, 0, Math.PI * 2); ctx.fill();
    }
    // bud vase with a little flower
    box(x + 0.45, y + 0.45, x + 0.55, y + 0.55, 18, 24, P.cushion);
    const fx = PX(x + 0.5, y + 0.5), fy = PY(x + 0.5, y + 0.5, 28);
    ctx.strokeStyle = lit(P.leaf, 0.9);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(fx, fy + 4); ctx.lineTo(fx, fy); ctx.stroke();
    ctx.fillStyle = lit(P.cloth, 1.02);
    for (let q = 0; q < 5; q++) {
      const a = q * 1.2566;
      ctx.beginPath(); ctx.arc(fx + Math.cos(a) * 1.9, fy + Math.sin(a) * 1.4, 1.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = lit(P.gold, 1);
    ctx.beginPath(); ctx.arc(fx, fy, 1.1, 0, Math.PI * 2); ctx.fill();
  }

  function drawChair(it) {
    const x = it.x, y = it.y;
    const [dx, dy] = DIRS[it.rot];
    const a = 0.27, b = 0.73, t = 0.08;
    contact(x + 0.5, y + 0.5, 0.26);
    for (const [lx, ly] of [[a, a], [b - 0.05, a], [a, b - 0.05], [b - 0.05, b - 0.05]]) {
      box(x + lx, y + ly, x + lx + 0.05, y + ly + 0.05, 0, 9, P.woodDeep);
    }
    let back;
    if (dy === 1) back = [x + a, y + a, x + b, y + a + t];
    else if (dy === -1) back = [x + a, y + b - t, x + b, y + b];
    else if (dx === 1) back = [x + a, y + a, x + a + t, y + b];
    else back = [x + b - t, y + a, x + b, y + b];
    const backFar = dy === 1 || dx === 1;
    const drawBack = () => {
      box(back[0], back[1], back[2], back[3], 12, 26, P.wood);
      // cushioned pad on the backrest
      const inset = 0.06;
      if (dx === 0) box(back[0] + inset, back[1] - 0.005, back[2] - inset, back[3] + 0.005, 16, 23, P.cushion, { top: P.cushionHi });
      else box(back[0] - 0.005, back[1] + inset, back[2] + 0.005, back[3] - inset, 16, 23, P.cushion, { top: P.cushionHi });
    };
    if (backFar) drawBack();
    box(x + a, y + a, x + b, y + b, 9, 12, P.wood);
    box(x + a + 0.03, y + a + 0.03, x + b - 0.03, y + b - 0.03, 12, 14, P.cushion, { top: P.cushionHi });
    if (!backFar) drawBack();
  }

  function drawCounter(it) {
    const [w, d] = dims(it.id, it.rot);
    const x0 = it.x, y0 = it.y, x1 = x0 + w, y1 = y0 + d;
    ctx.fillStyle = 'rgba(122,82,118,0.16)';
    flat(x0 - 0.02, y0 - 0.02, x1 + 0.06, y1 + 0.06, 0);
    ctx.fill();
    box(x0 + 0.1, y0 + 0.1, x1 - 0.1, y1 - 0.1, 0, 4, P.lavDeep);
    box(x0 + 0.06, y0 + 0.06, x1 - 0.06, y1 - 0.06, 4, 28, P.lav);
    // pastel band and panel seams on the front faces
    box(x0 + 0.055, y0 + 0.055, x1 - 0.055, y1 - 0.055, 19, 21.5, P.blush, { noTop: true });
    ctx.strokeStyle = lit(P.lavDeep, 0.95, 0.7);
    ctx.lineWidth = 0.8;
    if (w > 1) {
      ctx.beginPath(); ctx.moveTo(PX(x0 + 1, y1 - 0.06), PY(x0 + 1, y1 - 0.06, 5)); ctx.lineTo(PX(x0 + 1, y1 - 0.06), PY(x0 + 1, y1 - 0.06, 18)); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(PX(x1 - 0.06, y0 + 1), PY(x1 - 0.06, y0 + 1, 5)); ctx.lineTo(PX(x1 - 0.06, y0 + 1), PY(x1 - 0.06, y0 + 1, 18)); ctx.stroke();
    }
    box(x0 + 0.02, y0 + 0.02, x1 - 0.02, y1 - 0.02, 28, 31, P.counterTop);
    // cake under a glass dome on one end, a service bell on the other
    const ends = [[x0 + 0.5, y0 + 0.5], [x0 + (w > 1 ? 1.5 : 0.5), y0 + (d > 1 ? 1.5 : 0.5)]];
    const flip = it.rot >= 2;
    const cakeAt = flip ? ends[1] : ends[0], bellAt = flip ? ends[0] : ends[1];
    const order = flip ? [bellAt, cakeAt] : [cakeAt, bellAt];
    for (const e of order) {
      if (e === cakeAt) drawCake(e[0], e[1]);
      else drawBell(e[0], e[1]);
    }
  }
  function drawCake(cx, cy) {
    const sx = PX(cx, cy), sy = PY(cx, cy, 31);
    ctx.fillStyle = lit(P.cream, 1);
    ctx.beginPath(); ctx.ellipse(sx, sy, 12, 5.5, 0, 0, Math.PI * 2); ctx.fill();
    box(cx - 0.16, cy - 0.16, cx + 0.16, cy + 0.16, 32, 38, P.cake, { top: P.cream });
    ctx.fillStyle = lit(P.cloth, 1.02);
    ctx.beginPath(); ctx.arc(sx, PY(cx, cy, 40.5), 1.8, 0, Math.PI * 2); ctx.fill();
    // glass dome
    ctx.fillStyle = 'rgba(232,246,252,' + (0.32 - light.night * 0.1).toFixed(3) + ')';
    ctx.beginPath(); ctx.ellipse(sx, sy - 1, 11, 16, 0, Math.PI, 0); ctx.ellipse(sx, sy - 1, 11, 4.5, 0, 0, Math.PI); ctx.fill();
    ctx.strokeStyle = 'rgba(255,252,246,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(sx - 3, sy - 8, 6, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
    ctx.fillStyle = lit(P.lavDeep, 1);
    ctx.beginPath(); ctx.arc(sx, sy - 17.5, 1.6, 0, Math.PI * 2); ctx.fill();
  }
  function drawBell(cx, cy) {
    const sx = PX(cx, cy), sy = PY(cx, cy, 31);
    ctx.fillStyle = lit(P.woodDeep, 1);
    ctx.beginPath(); ctx.ellipse(sx, sy, 6, 2.8, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createLinearGradient(sx - 5, 0, sx + 5, 0);
    g.addColorStop(0, lit(P.gold, 1.08));
    g.addColorStop(1, lit(P.gold, 0.82));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(sx, sy - 1, 5, 6, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(sx, sy - 7.6, 1.3, 0, Math.PI * 2); ctx.fill();
  }

  function drawPlant(it, now) {
    const x = it.x, y = it.y;
    contact(x + 0.5, y + 0.5, 0.24);
    box(x + 0.33, y + 0.33, x + 0.67, y + 0.67, 0, 13, P.pot);
    box(x + 0.3, y + 0.3, x + 0.7, y + 0.7, 13, 15.5, P.potHi, { top: P.woodDeep });
    const sx = PX(x + 0.5, y + 0.5), sy = PY(x + 0.5, y + 0.5, 15);
    const sway = reduced ? 0 : Math.sin(now * 0.0011 + x * 1.7 + y * 2.3) * 0.05;
    const leaves = [[-1.15, 15], [1.15, 15], [-0.75, 19], [0.75, 19], [-0.32, 22], [0.32, 22], [0, 24]];
    for (let q = 0; q < leaves.length; q++) {
      const ang = -Math.PI / 2 + leaves[q][0] + sway * (1 + q * 0.15);
      const L = leaves[q][1];
      ctx.save();
      ctx.translate(sx + Math.cos(ang) * L * 0.5, sy + Math.sin(ang) * L * 0.5);
      ctx.rotate(ang);
      ctx.fillStyle = lit(q % 2 ? P.leaf : P.leafHi, q < 2 ? 0.86 : 1);
      ctx.beginPath(); ctx.ellipse(0, 0, L * 0.5, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // two tiny blossoms
    ctx.fillStyle = lit(P.cloth, 1.04);
    ctx.beginPath(); ctx.arc(sx - 7 + sway * 40, sy - 15, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + 8 + sway * 40, sy - 12, 1.7, 0, Math.PI * 2); ctx.fill();
  }

  function lanternGlow(it, now) {
    const flick = reduced ? 1 : 1 + 0.05 * Math.sin(now * 0.008 + it.x * 3.1 + it.y * 1.3);
    return clamp(light.night, 0, 1) * flick;
  }
  function drawLantern(it, now) {
    const x = it.x, y = it.y;
    contact(x + 0.5, y + 0.5, 0.2);
    box(x + 0.38, y + 0.38, x + 0.62, y + 0.62, 0, 3, P.woodDeep);
    box(x + 0.475, y + 0.475, x + 0.525, y + 0.525, 3, 31, P.wood);
    const sx = PX(x + 0.5, y + 0.5), sy = PY(x + 0.5, y + 0.5, 40);
    const n = lanternGlow(it, now);
    ctx.fillStyle = lit(P.woodDeep, 1);
    rrect(sx - 4, sy - 11, 8, 3, 1.2); ctx.fill();
    rrect(sx - 4, sy + 8, 8, 3, 1.2); ctx.fill();
    const day = lit(P.paperLamp, 1);
    ctx.fillStyle = day;
    ctx.beginPath(); ctx.ellipse(sx, sy, 7, 9.5, 0, 0, Math.PI * 2); ctx.fill();
    if (n > 0.02) {
      ctx.fillStyle = css(P.glow, (0.9 * n).toFixed(3));
      ctx.beginPath(); ctx.ellipse(sx, sy, 7, 9.5, 0, 0, Math.PI * 2); ctx.fill();
      glows.push(sx, sy, 26, 0.55 * n);
    }
    // paper ribs
    ctx.strokeStyle = n > 0.3 ? 'rgba(232,170,110,0.55)' : lit(P.woodDeep, 1.05, 0.45);
    ctx.lineWidth = 0.8;
    for (const k of [-0.5, 0.5]) {
      ctx.beginPath(); ctx.ellipse(sx, sy, Math.max(0.1, 7 * Math.abs(k) * 1.2), 9.5, 0, -Math.PI / 2, Math.PI / 2, k < 0); ctx.stroke();
    }
    ctx.fillStyle = lit(P.cloth, 0.95);
    rrect(sx - 0.8, sy + 11, 1.6, 5, 0.8); ctx.fill();
  }

  /* ================================================================
     Room shell: slab, floor, walls, door, windows
     ================================================================ */
  function drawRoomShadow() {
    const cx = PX(N / 2, N / 2), cy = PY(N / 2, N / 2, -SLAB) + N * TH * 0.6 + 18;
    const rx = N * TW * 1.15, ry = N * TH * 0.75;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx);
    g.addColorStop(0, css(mix3([104, 78, 128], light.top, 0.25), 0.26));
    g.addColorStop(1, css([104, 78, 128], 0));
    ctx.fillStyle = g;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, ry / rx);
    ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function drawSlab() {
    box(-WALL_T, -WALL_T, N, N, -SLAB, 0, P.slab, { noTop: true });
    // a darker underside lip
    box(-WALL_T, -WALL_T, N, N, -SLAB, -SLAB + 4, P.slabDeep, { noTop: true });
  }
  function drawFloor() {
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        flat(x, y, x + 1, y + 1, 0);
        ctx.fillStyle = lit((x + y) % 2 ? P.floorB : P.floorA, 1.02);
        ctx.fill();
      }
    }
    // soft AO along the back walls
    let g = ctx.createLinearGradient(PX(0, 0), PY(0, 0, 0), PX(0, 0.6), PY(0, 0.6, 0));
    g.addColorStop(0, 'rgba(150,100,130,0.16)');
    g.addColorStop(1, 'rgba(150,100,130,0)');
    ctx.fillStyle = g;
    flat(0, 0, 0.6, N, 0); ctx.fill();
    g = ctx.createLinearGradient(PX(0, 0), PY(0, 0, 0), PX(0.6, 0), PY(0.6, 0, 0));
    g.addColorStop(0, 'rgba(150,100,130,0.16)');
    g.addColorStop(1, 'rgba(150,100,130,0)');
    ctx.fillStyle = g;
    flat(0, 0, N, 0.6, 0); ctx.fill();
    // welcome mat at the door
    const m = DOOR;
    flat(m.x + 0.12, m.y + 0.08, m.x + 0.88, m.y + 0.62, 0.3);
    ctx.fillStyle = lit(P.mat, 1);
    ctx.fill();
    flat(m.x + 0.2, m.y + 0.16, m.x + 0.8, m.y + 0.54, 0.4);
    ctx.fillStyle = lit(P.matHi, 1);
    ctx.fill();
  }

  /* wall A runs along y = 0 (faces +y), wall B along x = 0 (faces +x) */
  function wallA(pts) { return pts.map((p) => [p[0], 0, p[1]]); }
  function wallB(pts) { return pts.map((p) => [0, p[0], p[1]]); }
  function drawWalls() {
    const shadeA = 0.97 - 0.03 * light.sun, shadeB = 0.88 + 0.03 * light.sun;
    for (const [mk, shade] of [[wallA, shadeA], [wallB, shadeB]]) {
      // wallpaper
      poly(mk([[0, 26], [N, 26], [N, WALL_H], [0, WALL_H]]));
      ctx.fillStyle = lit(P.paper, shade);
      ctx.fill();
      ctx.fillStyle = lit(P.paperStripe, shade, 0.85);
      for (let s = 0.25; s < N; s += 0.5) {
        poly(mk([[s, 26], [s + 0.12, 26], [s + 0.12, WALL_H], [s, WALL_H]]));
        ctx.fill();
      }
      // wainscot, chair rail, skirting
      poly(mk([[0, 0], [N, 0], [N, 26], [0, 26]]));
      const g = ctx.createLinearGradient(0, PY(0, 0, 26), 0, PY(0, 0, 0) + N * TH);
      g.addColorStop(0, lit(P.wainscot, shade));
      g.addColorStop(1, lit(P.wainscot, shade * 0.9));
      ctx.fillStyle = g;
      ctx.fill();
      ctx.fillStyle = lit(P.wainscot, shade * 0.93);
      for (let s = 0.5; s < N; s += 0.5) {
        poly(mk([[s - 0.015, 4], [s + 0.015, 4], [s + 0.015, 24], [s - 0.015, 24]]));
        ctx.fill();
      }
      poly(mk([[0, 24], [N, 24], [N, 28], [0, 28]]));
      ctx.fillStyle = lit(P.trim, shade);
      ctx.fill();
      poly(mk([[0, 0], [N, 0], [N, 4], [0, 4]]));
      ctx.fillStyle = lit(P.base, shade);
      ctx.fill();
      // crown trim
      poly(mk([[0, WALL_H - 4], [N, WALL_H - 4], [N, WALL_H], [0, WALL_H]]));
      ctx.fillStyle = lit(P.trim, shade);
      ctx.fill();
    }
    // wall caps and exposed ends
    ctx.fillStyle = lit(P.trim, 1.04);
    poly([[-WALL_T, -WALL_T, WALL_H], [N, -WALL_T, WALL_H], [N, 0, WALL_H], [0, 0, WALL_H], [0, N, WALL_H], [-WALL_T, N, WALL_H]]);
    ctx.fill();
    box(N - 0.001, -WALL_T, N, 0, 0, WALL_H, P.paper, { noTop: true });
    box(-WALL_T, N - 0.001, 0, N, 0, WALL_H, P.paper, { noTop: true });

    // windows: one every three tiles along each wall, skipping the door
    for (let c = 3.6; c + 0.65 <= N; c += 3) drawWindow('A', c);
    for (let c = 2.5; c + 0.65 <= N; c += 3) drawWindow('B', c);
    drawDoor();
  }
  function onWall(side, u, z) { return side === 'A' ? [u, 0, z] : [0, u, z]; }
  function drawWindow(side, c) {
    const u0 = c - 0.6, u1 = c + 0.6, z0 = 34, z1 = 62;
    const shade = side === 'A' ? 1 : 0.92;
    const q = (a, b, za, zb) => poly([onWall(side, a, za), onWall(side, b, za), onWall(side, b, zb), onWall(side, a, zb)]);
    q(u0 - 0.06, u1 + 0.06, z0 - 3, z1 + 3);
    ctx.fillStyle = lit(P.trim, shade);
    ctx.fill();
    // sky seen through the glass (not multiplied: it IS the sky)
    q(u0, u1, z0, z1);
    const top = onWall(side, c, z1), bot = onWall(side, c, z0);
    const g = ctx.createLinearGradient(0, PY(top[0], top[1], top[2]), 0, PY(bot[0], bot[1], bot[2]));
    g.addColorStop(0, css(light.top, 1));
    g.addColorStop(1, css(light.low, 1));
    ctx.fillStyle = g;
    ctx.fill();
    if (light.night > 0.2) {
      ctx.fillStyle = 'rgba(255,246,220,' + (light.night * 0.9).toFixed(3) + ')';
      for (let s = 0; s < 4; s++) {
        const p = onWall(side, lerp(u0 + 0.1, u1 - 0.1, noise(s, c * 10)), lerp(z0 + 4, z1 - 3, noise(c * 10, s + 5)));
        ctx.beginPath(); ctx.arc(PX(p[0], p[1]), PY(p[0], p[1], p[2]), 0.9, 0, Math.PI * 2); ctx.fill();
      }
    }
    // mullions
    ctx.fillStyle = lit(P.trim, shade);
    q(c - 0.03, c + 0.03, z0, z1); ctx.fill();
    q(u0, u1, (z0 + z1) / 2 - 1, (z0 + z1) / 2 + 1); ctx.fill();
    // curtains
    ctx.fillStyle = lit(P.cloth, shade * 0.98);
    q(u0 - 0.1, u0 + 0.12, z0 - 6, z1 + 4); ctx.fill();
    q(u1 - 0.12, u1 + 0.1, z0 - 6, z1 + 4); ctx.fill();
    ctx.fillStyle = lit(P.clothHi, shade);
    q(u0 - 0.04, u0 + 0.02, z0 - 6, z1 + 4); ctx.fill();
    q(u1 - 0.06, u1, z0 - 6, z1 + 4); ctx.fill();
    // little sill
    if (side === 'A') box(u0 - 0.08, 0, u1 + 0.08, 0.08, z0 - 5, z0 - 3, P.trim);
    else box(0, u0 - 0.08, 0.08, u1 + 0.08, z0 - 5, z0 - 3, P.trim);
  }
  function drawDoor() {
    const u0 = DOOR.x + 0.14, u1 = DOOR.x + 0.86, zt = 54;
    const q = (a, b, za, zb) => poly([[a, 0, za], [b, 0, za], [b, 0, zb], [a, 0, zb]]);
    q(u0 - 0.06, u1 + 0.06, 0, zt + 4);
    ctx.fillStyle = lit(P.trim, 1);
    ctx.fill();
    q(u0, u1, 0, zt);
    const g = ctx.createLinearGradient(0, PY(DOOR.x + 0.5, 0, zt), 0, PY(DOOR.x + 0.5, 0, 0));
    g.addColorStop(0, lit(P.door, 1));
    g.addColorStop(1, lit(P.doorDeep, 0.95));
    ctx.fillStyle = g;
    ctx.fill();
    // panels
    ctx.fillStyle = lit(P.doorDeep, 0.98, 0.6);
    q(u0 + 0.08, u1 - 0.08, 6, 22); ctx.fill();
    // round window showing the sky
    const cx = PX(DOOR.x + 0.5, 0), cy = PY(DOOR.x + 0.5, 0, 38);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.transform(1, 0.5, 0, 1, 0, 0);
    ctx.fillStyle = lit(P.trim, 1);
    ctx.beginPath(); ctx.arc(0, 0, 7.5, 0, Math.PI * 2); ctx.fill();
    const sg = ctx.createLinearGradient(0, -6, 0, 6);
    sg.addColorStop(0, css(light.top, 1));
    sg.addColorStop(1, css(light.low, 1));
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(0, 0, 5.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // knob
    const k = [u1 - 0.12, 0, 26];
    ctx.fillStyle = lit(P.gold, 1);
    ctx.beginPath(); ctx.arc(PX(k[0], k[1]), PY(k[0], k[1], k[2]), 1.8, 0, Math.PI * 2); ctx.fill();
  }

  /* ================================================================
     Sky backdrop (screen space)
     ================================================================ */
  const stars = [];
  for (let q = 0; q < 70; q++) stars.push({ x: noise(q, 1), y: noise(q, 2) * 0.75, r: 0.6 + noise(q, 3) * 1.1, ph: noise(q, 4) * 6.28 });
  const clouds = [];
  for (let q = 0; q < 5; q++) clouds.push({ x: noise(q, 9), y: 0.08 + noise(q, 8) * 0.45, s: 0.6 + noise(q, 7) * 0.7, v: 0.004 + noise(q, 6) * 0.006 });
  function drawSky(now, dt) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, css(light.top, 1));
    g.addColorStop(1, css(light.low, 1));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    const n = light.night;
    if (n > 0.02) {
      for (const s of stars) {
        const tw = reduced ? 0.8 : 0.6 + 0.4 * Math.sin(now * 0.002 + s.ph);
        ctx.fillStyle = 'rgba(255,246,222,' + (n * tw * 0.9).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    // sun by day, moon by night, on a gentle arc
    const h = light.hour;
    const isDay = h >= 6 && h < 18;
    const p = isDay ? (h - 6) / 12 : (((h - 18) + 24) % 24) / 12;
    const bx = W * (0.08 + 0.84 * p), by = H * 0.5 - Math.sin(p * Math.PI) * H * 0.36;
    const r = clamp(Math.min(W, H) * 0.045, 16, 34);
    const halo = ctx.createRadialGradient(bx, by, r * 0.6, bx, by, r * 3);
    halo.addColorStop(0, isDay ? 'rgba(255,236,190,0.5)' : 'rgba(236,232,255,0.3)');
    halo.addColorStop(1, 'rgba(255,236,190,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(bx - r * 3, by - r * 3, r * 6, r * 6);
    ctx.fillStyle = isDay ? '#ffe7a8' : '#f3eedd';
    ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
    if (!isDay) {
      ctx.fillStyle = css(mix3(light.top, light.low, clamp(by / H, 0, 1)), 1);
      ctx.beginPath(); ctx.arc(bx + r * 0.45, by - r * 0.25, r * 0.85, 0, Math.PI * 2); ctx.fill();
    }
    // drifting clouds, tinted by the sky
    const cc = mix3([255, 248, 242], light.low, 0.35);
    for (const c of clouds) {
      c.x += c.v * dt * (reduced ? 0.3 : 1);
      if (c.x > 1.25) c.x = -0.25;
      const cx = c.x * W, cy = c.y * H, s = c.s * clamp(W / 900, 0.6, 1.3);
      ctx.fillStyle = css(cc, (0.75 - n * 0.55).toFixed(3));
      ctx.beginPath();
      ctx.ellipse(cx, cy, 46 * s, 14 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(cx - 16 * s, cy - 8 * s, 20 * s, 14 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 12 * s, cy - 11 * s, 24 * s, 17 * s, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ================================================================
     Effects: pop-in, ground ring, dust puffs
     ================================================================ */
  const puffs = [];
  const rings = [];
  function spawnRing(x, y, w, d) { rings.push({ x: x + w / 2, y: y + d / 2, s: Math.max(w, d), t: 0 }); }
  function spawnPuff(x, y, w, d) {
    const n = reduced ? 6 : 16;
    for (let q = 0; q < n; q++) {
      const a = Math.random() * Math.PI * 2, sp = 0.3 + Math.random() * 0.6;
      puffs.push({
        x: x + w / 2 + Math.cos(a) * 0.15, y: y + d / 2 + Math.sin(a) * 0.15, z: 2 + Math.random() * 10,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: 10 + Math.random() * 16,
        life: 0, max: 0.55 + Math.random() * 0.35, r: 2.5 + Math.random() * 2.5
      });
    }
  }
  function updateEffects(dt) {
    for (let q = puffs.length - 1; q >= 0; q--) {
      const p = puffs[q];
      p.life += dt;
      if (p.life >= p.max) { puffs.splice(q, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vz *= 0.93;
    }
    for (let q = rings.length - 1; q >= 0; q--) {
      rings[q].t += dt * 1.8;
      if (rings[q].t >= 1) rings.splice(q, 1);
    }
  }
  /* squash and stretch, anchored at the base; returns [sx, sy, alpha] or null */
  function animOf(it, now) {
    if (!it.born) return null;
    if (now < it.born) return [1, 1, 0];
    const dur = reduced ? 260 : it.anim === 'wobble' ? 380 : 540;
    const t = (now - it.born) / dur;
    if (t >= 1) { it.born = 0; return null; }
    if (reduced) return [1, 1, it.anim === 'wobble' ? 1 : t];
    if (it.anim === 'wobble') {
      const s = 1 + 0.12 * Math.sin(t * Math.PI * 3) * (1 - t);
      return [1 / Math.sqrt(s), s, 1];
    }
    const sy = 1 - Math.cos(t * Math.PI * 2.5) * Math.pow(1 - t, 2);
    const sx = clamp(1 / Math.sqrt(Math.max(0.3, sy)), 0.85, 1.4);
    return [sx, Math.max(0.01, sy), Math.min(1, t * 5)];
  }

  /* ================================================================
     Interaction state
     ================================================================ */
  let tool = 'move';
  let ghostRot = 0;
  let selected = null;
  let drag = null;             // { item, offX, offY, grabZ, tx, ty, reason }
  const hover = { x: -1, y: -1, show: false };
  const kbd = { x: 2, y: 2, show: false };

  function depthOf(it) {
    const [w, d] = dims(it.id, it.rot);
    return it.x + w / 2 + it.y + d / 2;
  }

  /* find the front-most item under a screen point, checking its full height */
  function itemAt(sx, sy) {
    const sorted = items.slice().sort((a, b) => depthOf(b) - depthOf(a));
    for (const it of sorted) {
      const [w, d] = dims(it.id, it.rot);
      const h = CATALOG[it.id].h;
      for (let z = 0; z <= h; z += 2) {
        const [fx, fy] = floorAt(sx, sy, z);
        if (fx >= it.x + 0.08 && fx <= it.x + w - 0.08 && fy >= it.y + 0.08 && fy <= it.y + d - 0.08) return { item: it, z };
      }
    }
    return null;
  }

  /* ================================================================
     Frame
     ================================================================ */
  function drawItem(it, now, alpha) {
    const anim = animOf(it, now);
    const [w, d] = dims(it.id, it.rot);
    ctx.save();
    if (anim) {
      const bx = PX(it.x + w / 2, it.y + d / 2), by = PY(it.x + w / 2, it.y + d / 2, 0);
      ctx.translate(bx, by);
      ctx.scale(anim[0], anim[1]);
      ctx.translate(-bx, -by);
    }
    ctx.globalAlpha = (anim ? anim[2] : 1) * (alpha === undefined ? 1 : alpha);
    if (ctx.globalAlpha > 0.001) CATALOG[it.id].draw(it, now);
    ctx.restore();
  }
  function footprintPath(x, y, w, d, z) { flat(x + 0.04, y + 0.04, x + w - 0.04, y + d - 0.04, z || 0.6); }

  /* small floor arrow showing which way a chair faces: mint toward a table, lavender otherwise */
  function drawFacing(chair) {
    const [dx, dy] = DIRS[chair.rot];
    const dining = !!seatTable(chair);
    const cx = chair.x + 0.5 + dx * 0.62, cy = chair.y + 0.5 + dy * 0.62;
    const px = -dy, py = dx;
    poly([
      [cx + dx * 0.16, cy + dy * 0.16, 0.7],
      [cx + px * 0.13, cy + py * 0.13, 0.7],
      [cx - px * 0.13, cy - py * 0.13, 0.7]
    ]);
    ctx.fillStyle = dining ? 'rgba(111,180,156,0.9)' : 'rgba(170,140,200,0.9)';
    ctx.fill();
  }

  /* dotted walking route from the door to a seat */
  let routeCache = { v: -1, key: '', path: null };
  function routeTo(it) {
    const key = it.x + ',' + it.y;
    if (routeCache.v !== layoutVersion || routeCache.key !== key) {
      routeCache = { v: layoutVersion, key, path: astar(DOOR.x, DOOR.y, it.x, it.y, blockedGrid()) };
    }
    return routeCache.path;
  }
  function drawRoute(path, now) {
    if (!path || path.length < 2) return;
    const off = reduced ? 0 : (now * 0.0012) % 0.25;
    ctx.fillStyle = 'rgba(111,180,156,0.85)';
    for (let q = 0; q < path.length - 1; q++) {
      const [ax, ay] = path[q], [bx, by] = path[q + 1];
      for (let t = off; t < 1; t += 0.25) {
        const x = lerp(ax, bx, t) + 0.5, y = lerp(ay, by, t) + 0.5;
        ctx.beginPath(); ctx.ellipse(PX(x, y), PY(x, y, 0.6), 2.6, 1.3, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawGhost(id, x, y, rot, reason, now) {
    const [w, d] = dims(id, rot);
    footprintPath(x, y, w, d);
    ctx.fillStyle = reason ? css(P.bad, 0.4) : 'rgba(255,250,240,0.45)';
    ctx.fill();
    if (id === 'chair_01' && !reason) drawFacing({ id, x, y, rot });
    ctx.save();
    ctx.globalAlpha = reason ? 0.35 : 0.62;
    CATALOG[id].draw({ id, x, y, rot }, now);
    ctx.restore();
  }

  function frame(now, dt) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawSky(now, dt);
    ctx.setTransform(DPR * cam.zoom, 0, 0, DPR * cam.zoom, DPR * cam.x, DPR * cam.y);
    glows.length = 0;
    pools.length = 0;
    drawRoomShadow();
    drawSlab();
    drawFloor();
    drawWalls();

    // warm light pools from lanterns, under everything that stands
    if (light.night > 0.03) {
      ctx.globalCompositeOperation = 'lighter';
      for (const it of items) {
        if (!CATALOG[it.id].light) continue;
        const a = lanternGlow(it, now) * (it.born ? 0 : 1);
        if (a <= 0.01) continue;
        const cx = PX(it.x + 0.5, it.y + 0.5), cy = PY(it.x + 0.5, it.y + 0.5, 0);
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(1, 0.5);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, TW * 2.4);
        g.addColorStop(0, 'rgba(255,200,130,' + (0.36 * a).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(255,200,130,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, TW * 2.4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // placement rings
    for (const r of rings) {
      const cx = PX(r.x, r.y), cy = PY(r.x, r.y, 0.5), rad = (0.35 + r.t * 0.9) * r.s * TW;
      ctx.strokeStyle = 'rgba(255,250,240,' + (0.9 * (1 - r.t)).toFixed(3) + ')';
      ctx.lineWidth = 2.5 * (1 - r.t) + 0.5;
      ctx.beginPath(); ctx.ellipse(cx, cy, rad, rad / 2, 0, 0, Math.PI * 2); ctx.stroke();
    }

    // selection outline sits on the floor
    if (selected && !drag) {
      const [w, d] = dims(selected.id, selected.rot);
      footprintPath(selected.x, selected.y, w, d);
      ctx.fillStyle = 'rgba(205,180,219,0.4)';
      ctx.fill();
      ctx.setLineDash([5, 4]);
      ctx.lineDashOffset = reduced ? 0 : -now * 0.02;
      ctx.strokeStyle = 'rgba(150,118,182,0.9)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.setLineDash([]);
      if (selected.id === 'chair_01') {
        drawRoute(routeTo(selected), now);
        drawFacing(selected);
      }
    }

    // items, back to front
    const sorted = items.slice().sort((a, b) => depthOf(a) - depthOf(b) || a.y - b.y);
    for (const it of sorted) drawItem(it, now, drag && drag.item === it ? 0.3 : 1);

    // ghost previews
    if (drag && drag.tx !== null) {
      drawGhost(drag.item.id, drag.tx, drag.ty, drag.item.rot, drag.reason, now);
    } else if (CATALOG[tool]) {
      const c = hover.show ? hover : kbd.show ? kbd : null;
      if (c && inside(c.x, c.y)) {
        const cand = { id: tool, x: c.x, y: c.y, rot: ghostRot };
        drawGhost(tool, c.x, c.y, ghostRot, checkPlace(cand, null), now);
      }
    }

    // night glows
    if (glows.length) {
      ctx.globalCompositeOperation = 'lighter';
      for (let q = 0; q < glows.length; q += 4) {
        const x = glows[q], y = glows[q + 1], r = glows[q + 2], a = glows[q + 3];
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(255,214,150,' + a.toFixed(3) + ')');
        g.addColorStop(1, 'rgba(255,214,150,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // dust
    for (const p of puffs) {
      const a = 1 - p.life / p.max;
      ctx.fillStyle = lit([240, 226, 214], 1, (0.8 * a).toFixed(3));
      ctx.beginPath();
      ctx.arc(PX(p.x, p.y), PY(p.x, p.y, p.z), Math.max(0.1, p.r * (1 + p.life * 1.6)), 0, Math.PI * 2);
      ctx.fill();
    }

    // tile cursor
    const c = drag ? null : hover.show ? hover : kbd.show ? kbd : null;
    if (c && inside(c.x, c.y)) {
      footprintPath(c.x, c.y, 1, 1, 0.8);
      ctx.setLineDash([5, 4]);
      ctx.lineDashOffset = reduced ? 0 : -now * 0.02;
      ctx.strokeStyle = tool === 'remove' ? 'rgba(232,130,118,0.95)' : 'rgba(255,250,240,0.95)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  /* ================================================================
     Actions
     ================================================================ */
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => toastEl.classList.remove('show'), 1900);
  }
  function announce(msg) {
    statusEl.textContent = '';
    setTimeout(() => { statusEl.textContent = msg; }, 30);
  }
  const nameOf = (id) => CATALOG[id].name;
  function labelOf(it) {
    if (it.id === 'chair_01') return seatTable(it) ? 'Dining chair' : 'Waiting chair';
    return nameOf(it.id);
  }

  function placeAt(x, y) {
    const cand = { id: tool, x, y, rot: ghostRot, born: performance.now(), anim: 'pop' };
    const reason = checkPlace(cand, null);
    if (reason) { toast(REASON[reason]); announce(REASON[reason] + '.'); return false; }
    if (reduced) cand.born = performance.now();
    items.push(cand);
    const [w, d] = dims(cand.id, cand.rot);
    spawnRing(x, y, w, d);
    layoutChanged();
    saveSoon();
    announce(nameOf(cand.id) + ' placed at ' + (x + 1) + ', ' + (y + 1) + '.');
    return true;
  }
  function removeItem(it) {
    if (!it) return;
    const [w, d] = dims(it.id, it.rot);
    spawnPuff(it.x, it.y, w, d);
    items = items.filter((o) => o !== it);
    if (selected === it) select(null);
    layoutChanged();
    saveSoon();
    announce(nameOf(it.id) + ' removed.');
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) { /* ignore */ }
  }
  function moveItem(it, x, y) {
    if (x === it.x && y === it.y) return true;
    const cand = { id: it.id, x, y, rot: it.rot };
    const reason = checkPlace(cand, it);
    if (reason) { toast(REASON[reason]); announce(REASON[reason] + '.'); return false; }
    it.x = x; it.y = y;
    it.born = performance.now(); it.anim = 'wobble';
    const [w, d] = dims(it.id, it.rot);
    spawnRing(x, y, w, d);
    layoutChanged();
    saveSoon();
    announce(nameOf(it.id) + ' moved to ' + (x + 1) + ', ' + (y + 1) + '.');
    return true;
  }
  function rotate() {
    if (selected) {
      const it = selected;
      const cand = { id: it.id, x: it.x, y: it.y, rot: (it.rot + 1) % 4 };
      const reason = checkPlace(cand, it);
      if (reason) { toast(reason === 'outside' || reason === 'taken' ? 'No room to turn it here' : REASON[reason]); return; }
      it.rot = cand.rot;
      it.born = performance.now(); it.anim = 'wobble';
      layoutChanged();
      saveSoon();
      announce(nameOf(it.id) + ' rotated.');
    } else if (CATALOG[tool]) {
      ghostRot = (ghostRot + 1) % 4;
      announce(nameOf(tool) + ' will face a new direction.');
    }
  }
  function select(it) {
    selected = it;
    updateContext();
    if (it) announce(nameOf(it.id) + ' selected. Drag to move, R to rotate, Delete to remove.');
  }
  function updateContext() {
    if (selected) {
      contextEl.hidden = false;
      ctxLbl.textContent = labelOf(selected);
      ctxRemove.hidden = false;
      ctxDone.hidden = false;
      ctxRotate.setAttribute('aria-label', 'Rotate ' + nameOf(selected.id));
    } else if (CATALOG[tool]) {
      contextEl.hidden = false;
      ctxLbl.textContent = 'Placing ' + nameOf(tool).toLowerCase();
      ctxRemove.hidden = true;
      ctxDone.hidden = true;
      ctxRotate.setAttribute('aria-label', 'Rotate ' + nameOf(tool) + ' before placing');
    } else {
      contextEl.hidden = true;
    }
  }
  function selectTool(name, speak) {
    tool = name;
    for (const b of toolBtns) b.setAttribute('aria-pressed', b.dataset.tool === name ? 'true' : 'false');
    if (name !== 'move') selected = null;
    updateContext();
    if (speak) announce(name === 'move' ? 'Move tool.' : name === 'remove' ? 'Remove tool.' : nameOf(name) + ' selected for placing.');
  }

  function setLevel(lv) {
    lv = clamp(lv, 1, MAX_LEVEL);
    const nn = gridFor(lv);
    if (nn < N && items.some((it) => cells(it).some(([cx, cy]) => cx >= nn || cy >= nn))) {
      toast('Clear the outer edge before shrinking the room');
      return;
    }
    const grew = nn > N;
    level = lv;
    if (nn !== N) {
      N = nn;
      kbd.x = Math.min(kbd.x, N - 1); kbd.y = Math.min(kbd.y, N - 1);
      fitCamera();
      toast(grew ? 'The room grew to ' + N + '×' + N + '!' : 'Room is now ' + N + '×' + N);
    }
    renderLevel();
    layoutChanged();
    saveSoon();
  }
  function renderLevel() {
    levelRead.innerHTML = '<b>Lv ' + level + '</b><small>' + N + '×' + N + ' room</small>';
    lvDown.disabled = level <= 1;
    lvUp.disabled = level >= MAX_LEVEL;
  }

  /* ================================================================
     Loop
     ================================================================ */
  let last = 0, raf = 0, hudTimer = 0;
  function tick(now) {
    raf = requestAnimationFrame(tick);
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 1 / 60;
    last = now;
    updateLight(dt);
    updateEffects(dt);
    frame(now, dt);
    hudTimer -= dt;
    if (hudTimer <= 0) { hudTimer = 0.5; updateClock(); }
  }
  function updateClock() {
    const h = light.hour;
    const live = PREVIEWS[previewIdx] === null;
    let txt;
    if (live) {
      const d = new Date();
      txt = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    } else {
      const p = PREVIEWS[previewIdx];
      txt = String(p).padStart(2, '0') + ':00';
    }
    if (clockEl.firstChild.nodeValue !== txt) clockEl.firstChild.nodeValue = txt;
    const ph = phaseName(live ? h : PREVIEWS[previewIdx]) + (live ? '' : ' preview');
    if (phaseEl.textContent !== ph) phaseEl.textContent = ph;
    dialHand.setAttribute('transform', 'rotate(' + ((h / 24) * 360 - 180).toFixed(1) + ' 15 15)');
  }
  function start() { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stop(); save(); } else start(); });

  /* ================================================================
     Input: tap to place, drag items to move, drag floor to pan,
     long-press / right-click to remove, wheel / pinch to zoom
     ================================================================ */
  const pointers = new Map();
  let gesture = null;
  let longTimer = 0;

  function beginDrag(hit, sx, sy) {
    const [fx, fy] = floorAt(sx, sy, hit.z);
    drag = { item: hit.item, offX: Math.floor(fx) - hit.item.x, offY: Math.floor(fy) - hit.item.y, grabZ: hit.z, tx: hit.item.x, ty: hit.item.y, reason: '' };
    selected = hit.item;
    updateContext();
    world.classList.add('grabbing');
  }
  function updateDrag(sx, sy) {
    const [fx, fy] = floorAt(sx, sy, drag.grabZ);
    const tx = Math.floor(fx) - drag.offX, ty = Math.floor(fy) - drag.offY;
    drag.tx = tx; drag.ty = ty;
    drag.reason = tx === drag.item.x && ty === drag.item.y ? '' : checkPlace({ id: drag.item.id, x: tx, y: ty, rot: drag.item.rot }, drag.item);
  }

  world.addEventListener('pointerdown', (e) => {
    try { world.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      clearTimeout(longTimer);
      if (drag) { drag = null; world.classList.remove('grabbing'); }
      const [a, b] = Array.from(pointers.values());
      gesture = { mode: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      return;
    }
    if (pointers.size > 2) return;
    gesture = { mode: 'tap', sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, button: e.button, hit: null, done: false };
    if (tool === 'move' && e.button === 0) gesture.hit = itemAt(e.clientX, e.clientY);
    if (e.pointerType !== 'mouse') {
      longTimer = setTimeout(() => {
        if (!gesture || gesture.mode !== 'tap') return;
        const h = itemAt(gesture.sx, gesture.sy);
        if (h) removeItem(h.item);
        gesture.done = true;
      }, 550);
    }
  });
  world.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse') {
      const t = tileAt(e.clientX, e.clientY);
      hover.show = !!t;
      if (t) { hover.x = t[0]; hover.y = t[1]; }
      kbd.show = false;
    }
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!gesture) return;
    if (gesture.mode === 'pinch' && pointers.size >= 2) {
      const [a, b] = Array.from(pointers.values());
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      cam.x += mx - gesture.mx; cam.y += my - gesture.my;
      zoomAt(mx, my, d / (gesture.d || d));
      gesture.d = d; gesture.mx = mx; gesture.my = my;
      return;
    }
    if (gesture.mode === 'tap' && !gesture.done && Math.hypot(e.clientX - gesture.sx, e.clientY - gesture.sy) > 7) {
      clearTimeout(longTimer);
      if (gesture.hit) { gesture.mode = 'drag'; beginDrag(gesture.hit, gesture.sx, gesture.sy); }
      else { gesture.mode = 'pan'; world.classList.add('grabbing'); }
    }
    if (gesture.mode === 'drag' && drag) updateDrag(e.clientX, e.clientY);
    if (gesture.mode === 'pan') {
      cam.x += e.clientX - gesture.lx;
      cam.y += e.clientY - gesture.ly;
      gesture.lx = e.clientX; gesture.ly = e.clientY;
    }
  });
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    clearTimeout(longTimer);
    world.classList.remove('grabbing');
    if (!gesture) return;
    const up = e.type === 'pointerup';
    if (gesture.mode === 'drag' && drag) {
      if (up) {
        if (drag.reason) { toast(REASON[drag.reason]); announce(REASON[drag.reason] + '.'); }
        else moveItem(drag.item, drag.tx, drag.ty);
      }
      drag = null;
    } else if (gesture.mode === 'tap' && up && !gesture.done) {
      handleTap(e.clientX, e.clientY, gesture.button, gesture.hit);
    }
    if (pointers.size === 0) gesture = null;
    else if (gesture.mode === 'pinch') {
      const p = Array.from(pointers.values())[0];
      gesture = { mode: 'pan', lx: p.x, ly: p.y };
    }
  }
  function handleTap(sx, sy, button, hit) {
    if (button === 2) {
      const h = itemAt(sx, sy);
      if (h) removeItem(h.item);
      return;
    }
    if (tool === 'move') {
      if (hit) select(selected === hit.item ? null : hit.item);
      else if (selected) select(null);
      return;
    }
    if (tool === 'remove') {
      const h = itemAt(sx, sy);
      if (h) removeItem(h.item);
      return;
    }
    const t = tileAt(sx, sy);
    if (t) placeAt(t[0], t[1]);
  }
  world.addEventListener('pointerup', endPointer);
  world.addEventListener('pointercancel', endPointer);
  world.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') hover.show = false; });
  world.addEventListener('contextmenu', (e) => e.preventDefault());
  world.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, Math.exp(-clamp(e.deltaY, -120, 120) * 0.0016));
  }, { passive: false });

  for (const b of toolBtns) b.addEventListener('click', () => selectTool(b.dataset.tool, true));
  ctxRotate.addEventListener('click', rotate);
  ctxRemove.addEventListener('click', () => { if (selected) removeItem(selected); });
  ctxDone.addEventListener('click', () => { select(null); world.focus({ preventScroll: true }); });
  lvDown.addEventListener('click', () => setLevel(level - 1));
  lvUp.addEventListener('click', () => setLevel(level + 1));
  previewBtn.addEventListener('click', () => {
    previewIdx = (previewIdx + 1) % PREVIEWS.length;
    const live = previewIdx === 0;
    previewLbl.textContent = PREVIEW_NAMES[previewIdx];
    previewBtn.setAttribute('aria-pressed', live ? 'false' : 'true');
    const next = PREVIEW_NAMES[(previewIdx + 1) % PREVIEWS.length];
    previewBtn.setAttribute('aria-label', (live ? 'Sky follows your clock.' : 'Previewing ' + PREVIEW_NAMES[previewIdx].toLowerCase() + '.') + ' Tap for ' + (next === 'Live' ? 'live clock' : next.toLowerCase()) + '.');
    toast(live ? 'Back to your real clock' : 'Previewing ' + PREVIEW_NAMES[previewIdx].toLowerCase());
    updateClock();
  });

  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k >= '1' && k <= '7') { selectTool(TOOL_ORDER[+k - 1], true); return; }
    if (k === '+' || k === '=') { zoomAt(W / 2, H / 2, 1.15); return; }
    if (k === '-' || k === '_') { zoomAt(W / 2, H / 2, 1 / 1.15); return; }
    if (k === 'r' || k === 'R') { rotate(); return; }
    if (k === 'Escape') { select(null); return; }
    if (document.activeElement !== world) return;
    const moves = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
    if (moves[k]) {
      e.preventDefault();
      kbd.show = true; hover.show = false;
      kbd.x = clamp(kbd.x + moves[k][0], 0, N - 1);
      kbd.y = clamp(kbd.y + moves[k][1], 0, N - 1);
      const it = itemOnTile(kbd.x, kbd.y);
      announce('Tile ' + (kbd.x + 1) + ', ' + (kbd.y + 1) + ': ' + (it ? nameOf(it.id) : kbd.x === DOOR.x && kbd.y === DOOR.y ? 'doorway' : 'empty') + '.');
    } else if (k === 'Enter' || k === ' ') {
      e.preventDefault();
      kbd.show = true;
      const it = itemOnTile(kbd.x, kbd.y);
      if (tool === 'move') {
        if (it) select(selected === it ? null : it);
        else if (selected) moveItem(selected, kbd.x, kbd.y);
      } else if (tool === 'remove') removeItem(it);
      else placeAt(kbd.x, kbd.y);
    } else if (k === 'Delete' || k === 'Backspace') {
      e.preventDefault();
      removeItem(selected || itemOnTile(kbd.x, kbd.y));
    }
  });
  world.addEventListener('focus', () => { if (!hover.show) kbd.show = true; });
  world.addEventListener('blur', () => { kbd.show = false; });

  window.addEventListener('resize', resize);
  if (reduceMQ.addEventListener) reduceMQ.addEventListener('change', (e) => { reduced = e.matches; });
  window.addEventListener('pagehide', save);

  /* ================================================================
     Start
     ================================================================ */
  if (!load()) {
    level = 1;
    N = gridFor(level);
    adoptItems(defaultLayout(), true);
    save();
  }
  resize();
  renderLevel();
  selectTool('move', false);
  updateLight(0);
  updateClock();
  start();
})();
</script>
</body>
</html>
