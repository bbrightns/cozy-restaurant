<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozy Restaurant</title>
<meta name="description" content="Decorate a tiny pastel isometric restaurant. Place, move, rotate and remove tables, chairs, counters, plants and lanterns. The sky follows your real clock.">
<meta name="theme-color" content="#cfe6f2">
<link rel="icon" href="data:,">
<!-- ===== STYLES (CSS) ===== -->
<style>
  :root {
    --grass: #a8d5a2;
    --water: #7ec8e3;
    --road: #d6d0c4;
    --peach: #ffb5a7;
    --blush: #fcd5ce;
    --mint: #b8e0d2;
    --lav: #cdb4db;
    --cream: #fff8ef;
    --cream-2: #f9ecdf;
    --text: #5b4b57;
    --text-2: #84727f;
    --text-3: #a897a2;
    --gold: #f6d27a;
    --accent: #ffb5a7;
    --line: rgba(91, 75, 87, .13);
    --shadow: 0 12px 26px -14px rgba(108, 72, 104, .55), 0 2px 0 rgba(255, 252, 246, .8) inset;
    --font: ui-rounded, "Nunito", "Quicksand", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #cfe6f2;
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  #world {
    position: fixed;
    inset: 0;
    touch-action: none;
    outline: none;
    cursor: pointer;
  }
  #world.grabbing { cursor: grabbing; }
  #world canvas { width: 100%; height: 100%; display: block; }
  #world:focus-visible { box-shadow: inset 0 0 0 3px rgba(142, 110, 170, .55); }

  button {
    appearance: none;
    border: 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  :focus-visible { outline: 3px solid #9b7fc0; outline-offset: 2px; }
  button:focus:not(:focus-visible) { outline: none; }

  /* ---------- top HUD ---------- */
  .top {
    position: fixed;
    z-index: 3;
    top: 14px;
    left: 14px;
    right: 14px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .card {
    background: var(--cream);
    border-radius: 20px;
    box-shadow: var(--shadow);
  }
  /* one card, two rows: shop name + clock, then coins + level */
  .hud {
    width: min(100%, 440px);
    padding: 6px 8px 6px 12px;
    display: grid;
    gap: 4px;
  }
  .hud-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-width: 0;
  }
  .hud-row + .hud-row { border-top: 1.5px dashed var(--line); padding-top: 4px; }
  .hud h1 {
    margin: 0;
    min-width: 0;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -.01em;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .hud h1 svg { width: 28px; height: 28px; flex: none; }
  .shop-name, .shop-name-input {
    font: inherit;
    color: inherit;
    letter-spacing: inherit;
    min-height: 44px;
    margin: 0 0 0 -6px;
    padding: 0 6px;
    border-radius: 12px;
    max-width: 100%;
  }
  .shop-name {
    min-width: 0;
    background: transparent;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: left;
    transition: background .2s ease;
  }
  .shop-name:hover { background: var(--cream-2); }
  .shop-name-input {
    width: 11em;
    border: 0;
    background: var(--cream-2);
    box-shadow: inset 0 0 0 2px var(--lav);
    outline: none;
  }
  .shop-name-input:focus-visible { box-shadow: inset 0 0 0 2px #9b7fc0; }
  .shop-name[hidden], .shop-name-input[hidden] { display: none; }
  .clock { display: flex; align-items: center; gap: 8px; flex: none; }
  .dial { width: 30px; height: 30px; flex: none; }
  .clock-read {
    margin: 0;
    font-weight: 800;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    min-width: 3.6em;
  }
  .clock-read small { display: block; font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: .04em; }
  .chip {
    background: var(--cream-2);
    border-radius: 999px;
    min-height: 44px;
    min-width: 44px;
    padding: 0 12px;
    font-size: 12.5px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), background .2s ease;
  }
  .chip svg { width: 16px; height: 16px; }
  .chip:hover { background: #f4e0cf; }
  .chip:active { transform: translateY(1px) scale(.96); }
  .chip[aria-pressed="true"] { background: var(--lav); }

  .level-card {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: none;
  }
  .level-read { margin: 0; padding: 0 6px; text-align: right; line-height: 1.1; min-width: 64px; }
  .level-read b { display: block; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .level-read small { font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: .04em; }
  .xp-bar { display: block; height: 4px; margin-top: 3px; border-radius: 2px; background: var(--lav); overflow: hidden; }
  .xp-bar i { display: block; height: 100%; border-radius: 2px; background: var(--text-3); transition: width .3s; }
  @media (prefers-reduced-motion: reduce) { .xp-bar i { transition: none; } }
  .step { font-size: 20px; font-weight: 800; padding: 0; width: 44px; }
  .step[hidden] { display: none; }
  .step:disabled { opacity: .45; cursor: default; }

  .stats-card {
    min-height: 44px;
    margin-left: -4px;
    padding: 4px 14px 4px 4px;
    border-radius: 999px;
    background: transparent;
    display: flex;
    align-items: center;
    gap: 8px;
    text-align: left;
    transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), background .2s ease;
  }
  .stats-card:hover { background: var(--cream-2); }
  .stats-card:active { transform: scale(.97); }
  .stats-card[aria-expanded="true"] { background: #fbefd9; }
  .coin { width: 30px; height: 30px; flex: none; }
  .coin.bump { animation: bump .35s cubic-bezier(.3, 1.8, .5, 1); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25, .9); } 100% { transform: scale(1); } }
  .stats-read { line-height: 1.1; }
  .stats-read b { display: block; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stats-read small { font-size: 11px; font-weight: 700; color: var(--text-2); font-variant-numeric: tabular-nums; }

  .breakdown {
    width: min(100%, 440px);
    max-height: calc(100vh - 230px);
    overflow: auto;
    padding: 12px 14px 14px 16px;
    font-size: 13px;
  }
  .breakdown[hidden] { display: none; }
  .bd-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .bd-head small { font-size: 11px; font-weight: 800; color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; }
  .bd-total { margin: 2px 0 0; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .bd-rows {
    margin: 10px 0 0;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 12px;
    border-top: 1.5px dashed var(--line);
    padding-top: 10px;
  }
  .bd-rows dt { font-weight: 700; }
  .bd-rows dt small { display: block; font-weight: 600; font-size: 11px; color: var(--text-3); }
  .bd-rows dd { margin: 0; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
  .bd-rows .sum { border-top: 1.5px dashed var(--line); padding-top: 6px; }
  .stars { position: relative; display: inline-block; color: #eadfd0; letter-spacing: 1px; }
  .stars i { position: absolute; inset: 0 auto 0 0; overflow: hidden; color: #e9b44c; font-style: normal; white-space: nowrap; }
  .bd-hint { margin: 10px 0 0; padding: 7px 10px; border-radius: 12px; background: #fbe7b8; font-weight: 700; }
  .bd-hint[hidden] { display: none; }
  .bd-note { margin: 8px 0 0; font-size: 12px; color: var(--text-2); }

  /* ---------- bottom HUD ---------- */
  .bottom {
    position: fixed;
    z-index: 3;
    left: 8px;
    right: 8px;
    bottom: max(10px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    pointer-events: none;
  }
  .bottom > * { pointer-events: auto; }
  /* selection card: name and actions, then the item's style swatches */
  .context {
    display: grid;
    justify-items: center;
    gap: 6px;
    padding: 5px 6px;
    border-radius: 26px;
    max-width: 100%;
    transition: opacity .25s ease, transform .3s cubic-bezier(.3, 1.6, .5, 1);
  }
  .ctx-row { display: flex; align-items: center; gap: 6px; max-width: 100%; padding-left: 8px; }
  .ctx-variants { padding: 0 4px 4px; }
  .ctx-variants .sw-row { flex-wrap: nowrap; }
  .ctx-variants .sw-face { border-radius: 999px; }
  .context[hidden], .ctx-variants[hidden], .chip[hidden] { display: none; }
  .context .lbl { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .context .chip.warn { background: #fbd9d2; }
  .context .chip.warn:hover { background: #f8c9bf; }

  /* toolbar: category tabs over one panel */
  .toolbar {
    width: min(100%, 520px);
    padding: 6px;
    border-radius: 24px;
    display: grid;
    gap: 6px;
  }
  .tabs {
    display: flex;
    gap: 3px;
    padding: 3px;
    border-radius: 999px;
    background: var(--cream-2);
  }
  .tab {
    flex: 1 1 0;
    min-height: 44px;
    border-radius: 999px;
    background: transparent;
    color: var(--text-2);
    font-size: 14.5px;
    font-weight: 800;
    transition: background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { background: var(--cream); color: var(--text); box-shadow: 0 3px 8px -4px rgba(108, 72, 104, .55); }
  .panel { display: flex; gap: 4px; }
  .panel[hidden] { display: none; }
  .decor-panel { display: grid; gap: 8px; padding: 2px 2px 4px; }
  .decor-panel .sw-row { flex-wrap: nowrap; gap: 6px; justify-content: center; }
  .tool {
    flex: 1 1 0;
    min-width: 0;
    min-height: 62px;
    padding: 6px 2px;
    border-radius: 17px;
    background: transparent;
    color: var(--text-2);
    display: grid;
    justify-items: center;
    align-content: center;
    gap: 2px;
    transition: background .25s ease, color .25s ease, transform .3s cubic-bezier(.3, 1.6, .5, 1);
  }
  .tool svg { width: 36px; height: 30px; transition: transform .35s cubic-bezier(.3, 1.8, .5, 1); }
  .tool span { font-size: 13px; font-weight: 800; }
  .tool:hover { background: var(--cream-2); color: var(--text); }
  .tool[aria-pressed="true"] {
    background: var(--tint, var(--mint));
    color: var(--text);
    transform: translateY(-2px);
    box-shadow: 0 10px 16px -10px rgba(108, 72, 104, .6);
  }
  .tool[aria-pressed="true"] svg { transform: translateY(-2px) scale(1.08); }
  .tool[data-tool="move"] { --tint: var(--mint); }
  .tool[data-tool="table_01"] { --tint: var(--blush); }
  .tool[data-tool="chair_01"] { --tint: #d6eee5; }
  .tool[data-tool="counter_01"] { --tint: var(--lav); }
  .tool[data-tool="plant_01"] { --tint: #d3ead0; }
  .tool[data-tool="lantern_01"] { --tint: #fbe7b8; }
  .tool[data-tool="remove"] { --tint: #fbd9d2; }
  .tool[data-action="rotate"]:active svg { transform: rotate(90deg); }

  .sheet {
    padding: 10px 14px 12px;
    max-width: 100%;
    display: grid;
    gap: 8px;
  }
  .sheet[hidden] { display: none; }
  .sheet h2 { margin: 0 0 6px; font-size: 12px; font-weight: 800; color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; }
  .sw-row { display: flex; gap: 6px; flex-wrap: wrap; }
  /* a design to buy: colour face with its price underneath */
  .sw-item {
    display: grid;
    justify-items: center;
    align-content: start;
    gap: 5px;
    width: 48px;
    padding: 0 0 2px;
    background: transparent;
    border-radius: 14px;
  }
  .sw-face {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    box-shadow: inset 0 0 0 1.5px rgba(91, 75, 87, .12), 0 3px 8px -5px rgba(108, 72, 104, .6);
    transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), box-shadow .2s ease;
  }
  .sw-item:active .sw-face { transform: scale(.92); }
  .sw-item[aria-pressed="true"] .sw-face { box-shadow: 0 0 0 3px var(--cream), 0 0 0 5.5px #a98fc0; }
  .sw-price {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11.5px;
    font-weight: 800;
    line-height: 1;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }
  .sw-price::before {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: inset 0 0 0 1.5px #e9b44c;
  }
  .sw-item.free .sw-price::before { display: none; }
  .sw-item.poor .sw-price { color: #c0665a; }
  .sw-item.poor .sw-face { opacity: .6; }
  .decor-switch { display: flex; align-items: center; gap: 6px; }
  .decor-note { margin-left: auto; padding-right: 6px; font-size: 11.5px; font-weight: 700; color: var(--text-3); text-align: right; }
  .bill {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 999px;
    background: #fbefd9;
    font-size: 12.5px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .bill::before {
    content: "";
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: inset 0 0 0 2px #e9b44c;
  }
  .bill small { font-size: 11px; font-weight: 700; color: var(--text-2); }
  .bill[hidden] { display: none; }
  .tool[data-action="menu"] { --tint: #fbe7b8; }
  .menu-sheet { width: 440px; max-height: calc(100vh - 210px); overflow: auto; overscroll-behavior: contain; }
  .menu-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .menu-head h2 { margin: 0; font-size: 18px; color: var(--text); letter-spacing: 0; text-transform: none; }
  .menu-sub { margin: 2px 0 0; font-size: 12.5px; font-weight: 700; color: var(--text-2); }
  .menu-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .dish {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 4px 4px 4px 2px;
    border-radius: 16px;
  }
  .dish.on { background: var(--cream-2); }
  .dish.locked { opacity: .55; }
  .dish-toggle {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: transparent;
    display: grid;
    place-items: center;
  }
  .dish-toggle svg { width: 34px; height: 34px; }
  .dish-toggle:disabled { cursor: default; }
  .dish-name { margin: 0; font-size: 14px; font-weight: 800; line-height: 1.15; }
  .dish-meta { margin: 2px 0 0; font-size: 11.5px; font-weight: 700; color: var(--text-3); }
  .dish-price { display: flex; align-items: center; gap: 2px; }
  .dish-price .chip { width: 44px; padding: 0; font-size: 18px; background: var(--cream); }
  .dish-price .chip:disabled { opacity: .4; cursor: default; }
  .price-read { min-width: 44px; text-align: center; line-height: 1.05; }
  .price-read b { display: block; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .price-read small { font-size: 10.5px; font-weight: 700; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .lock-read { font-size: 12px; font-weight: 800; color: var(--text-2); padding: 0 8px; white-space: nowrap; }
  /* staff sheet: team and hire list */
  .tool[data-action="staff"] { --tint: #d6eee5; }
  .staff-h3 { margin: 4px 0 0; font-size: 12px; font-weight: 800; color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; }
  .staff-split { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .staff-row { grid-template-columns: 44px 1fr auto; background: var(--cream-2); padding-left: 6px; }
  .staff-row.cand { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
  .avatar { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; display: block; }
  .avatar svg { width: 44px; height: 44px; display: block; }
  .avatar .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @media (prefers-reduced-motion: reduce) { .avatar .blink { animation: none; } }
  .tier { color: #e2b04f; font-size: 12px; letter-spacing: .02em; margin-left: 4px; }
  .staff-row .chip { background: var(--cream); white-space: nowrap; }
  .staff-row .chip.warn { background: #fbd9d2; }
  .staff-row .chip.warn:hover { background: #f8c9bf; }
  .chip.hire { background: var(--peach); color: var(--text); }
  .chip.hire:hover { background: #fca898; }
  .chip.hire::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); box-shadow: inset 0 0 0 2px #e9b44c; }
  .chip.hire.free::before { display: none; }
  .chip.hire.poor { background: var(--cream-2); color: #c0665a; }
  .chip.hire.full { background: var(--cream-2); color: var(--text-3); }
  .empty-note { margin: 0; padding: 8px 4px; font-size: 12.5px; font-weight: 700; color: var(--text-2); }

  .toast {
    position: fixed;
    z-index: 4;
    left: 50%;
    bottom: 150px;
    max-width: calc(100vw - 32px);
    transform: translate(-50%, 10px);
    background: #6d5a6a;
    color: var(--cream);
    font-size: 13px;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    text-align: center;
    transition: opacity .3s ease, transform .3s cubic-bezier(.3, 1.6, .5, 1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 640px) {
    .top { top: 8px; left: 8px; right: 8px; gap: 6px; }
    .hud { width: 100%; padding: 4px 6px 4px 10px; gap: 2px; border-radius: 18px; }
    .hud-row { gap: 6px; }
    .hud-row + .hud-row { padding-top: 2px; }
    .hud h1 { font-size: 16px; gap: 6px; }
    .hud h1 svg { width: 22px; height: 22px; }
    .dial { width: 24px; height: 24px; }
    .clock { gap: 6px; }
    .clock-read { font-size: 13px; }
    .clock-read small { font-size: 10px; }
    .level-read { min-width: 56px; padding: 0 4px; }
    .level-read b { font-size: 14px; }
    .level-read small { font-size: 10.5px; }
    .stats-card { padding: 2px 10px 2px 4px; gap: 6px; }
    .coin { width: 26px; height: 26px; }
    .stats-read b { font-size: 15px; }
    .stats-read small { font-size: 10.5px; }
    .toolbar { padding: 4px; gap: 4px; border-radius: 20px; }
    .tab { font-size: 13.5px; }
    .panel { gap: 2px; }
    .tool { min-height: 56px; padding: 4px 1px; border-radius: 14px; }
    .tool svg { width: 32px; height: 26px; }
    .tool span { font-size: 11.5px; }
    .decor-panel .sw-row, .ctx-variants .sw-row { gap: 3px; }
    .decor-note { font-size: 10.5px; }
    .chip .txt { display: none; }
    .toast { font-size: 12px; }
  }
  /* short, wide screens (phones held sideways): dock the toolbar on the right */
  @media (max-height: 520px) and (min-width: 600px) {
    .top { top: 8px; left: 8px; right: 260px; }
    .hud { padding: 4px 6px 4px 10px; gap: 2px; }
    .hud-row + .hud-row { padding-top: 2px; }
    .bottom { left: auto; right: 8px; top: 8px; bottom: 8px; width: 244px; justify-content: flex-end; align-items: stretch; gap: 6px; }
    .toolbar { width: 100%; padding: 4px; gap: 4px; }
    .tab { font-size: 13px; }
    .panel { flex-wrap: wrap; gap: 2px; }
    .tool { flex: 1 1 30%; min-height: 54px; padding: 4px 1px; }
    .tool svg { width: 30px; height: 24px; }
    .tool span { font-size: 12px; }
    .decor-panel .sw-row { flex-wrap: wrap; gap: 5px; }
    .decor-note { display: none; }
    .context, .menu-sheet { width: 100%; }

  ].map((s) => ({ name: s.name, price: s.price, paper: rgb(s.paper), stripe: rgb(s.stripe), wainscot: rgb(s.wainscot), trim: rgb(s.trim), base: rgb(s.base), hex: s }));
  // pattern: how the floor is drawn; a, b, c: its colors
  const FLOOR_STYLES = [
    { name: 'Checker tile', price: 3, pattern: 'checker', a: '#f7eadb', b: '#f2dccb', c: '#f2dccb' },
    { name: 'Wood planks', price: 6, pattern: 'wood', a: '#ebcfae', b: '#e2c29d', c: '#cfa982' },
    { name: 'Stripes', price: 4, pattern: 'stripes', a: '#f6eaf1', b: '#ead9e8', c: '#ead9e8' },
    { name: 'Light marble', price: 9, pattern: 'marble', a: '#f7f2ef', b: '#efe8e6', c: '#d9ccd8' },
    { name: 'Dots', price: 5, pattern: 'dots', a: '#fbece6', b: '#f4c9bf', c: '#f4c9bf' },
    { name: 'Plain rug', price: 7, pattern: 'rug', a: '#f2e3d2', b: '#e2d3ec', c: '#cdb4db' }
  ].map((s) => ({ name: s.name, price: s.price, pattern: s.pattern, a: rgb(s.a), b: rgb(s.b), c: rgb(s.c), hex: s }));
  /* Furniture variants: palette swaps per item type, plus an optional code-drawn
     pattern. Each entry overrides palette roles that item's draw function reads
     through pal(it). Entry 0 is the original look. `sw` lists the roles shown
     in the swatch (main, accent). */
  const VARIANTS = {
    table_01: { sw: ['cloth', 'clothHi'], list: [
      { name: 'Peach', price: 30, cloth: '#ffb5a7', clothHi: '#ffd3c7' },
      { name: 'Mint', price: 30, cloth: '#a9d9c6', clothHi: '#cdeee0' },
      { name: 'Lavender gingham', price: 55, cloth: '#cdb4db', clothHi: '#ece0f3', woodDeep: '#b39cc6', pattern: 'gingham' },
      { name: 'Butter dots', price: 50, cloth: '#f6d27a', clothHi: '#fbe7b8', pattern: 'dots' },
      { name: 'Sky', price: 35, cloth: '#a9cfe8', clothHi: '#d3e8f5', woodDeep: '#a98f80' },
      { name: 'Rose gingham', price: 55, cloth: '#f4a6b8', clothHi: '#fcd5de', pattern: 'gingham' }
    ] },
    chair_01: { sw: ['cushion', 'wood'], list: [
      { name: 'Mint', price: 15, cushion: '#b8e0d2', cushionHi: '#cfeadf' },
      { name: 'Peach', price: 15, cushion: '#ffc2b4', cushionHi: '#ffd8cd' },
      { name: 'Lavender', price: 18, cushion: '#cdb4db', cushionHi: '#e2d3ec' },
      { name: 'Butter', price: 18, cushion: '#f6dc93', cushionHi: '#fbeabc' },
      { name: 'Sky', price: 24, cushion: '#b2d6ec', cushionHi: '#d3e8f5', wood: '#cdbcae', woodDeep: '#a98f80' },
      { name: 'Cocoa', price: 28, cushion: '#e8c4a8', cushionHi: '#f3dcc8', wood: '#b88a6a', woodDeep: '#9a7055' }
    ] },
    counter_01: { sw: ['lav', 'blush'], list: [
      { name: 'Lavender', price: 60, lav: '#cdb4db', lavDeep: '#b39cc6', blush: '#fcd5ce' },
      { name: 'Mint', price: 60, lav: '#b8e0d2', lavDeep: '#9fcab9', blush: '#fcd5ce' },
      { name: 'Peach', price: 65, lav: '#ffc9b9', lavDeep: '#f2ad9b', blush: '#b8e0d2' },
      { name: 'Butter stripe', price: 90, lav: '#f8e3a4', lavDeep: '#e9cc7e', blush: '#cdb4db', pattern: 'stripes' },
      { name: 'Sky', price: 70, lav: '#b9d8ec', lavDeep: '#9cc3d8', blush: '#fff1e2' },
      { name: 'Honey wood', price: 110, lav: '#dcb891', lavDeep: '#c4966f', blush: '#b8e0d2', counterTop: '#f7eadb', pattern: 'stripes' }
    ] },
    plant_01: { sw: ['pot', 'cloth'], list: [
      { name: 'Terracotta', price: 12, pot: '#f2b09c', potHi: '#f8c7b6', cloth: '#ffb5a7' },
      { name: 'Mint pot', price: 14, pot: '#a9d9c6', potHi: '#c6e8da', cloth: '#f6d27a' },
      { name: 'Lavender pot', price: 16, pot: '#c9b2dc', potHi: '#dccbe8', cloth: '#fff3e4' },
      { name: 'Butter pot', price: 16, pot: '#f4d98a', potHi: '#f9e7b5', cloth: '#ffb5a7' },
      { name: 'Sky pot', price: 18, pot: '#a9cfe8', potHi: '#c9e2f2', cloth: '#fcd5ce' },
      { name: 'Cream pot', price: 20, pot: '#efe2d2', potHi: '#f8efe4', cloth: '#cdb4db' }
    ] },
    lantern_01: { sw: ['paperLamp', 'cloth'], list: [
      { name: 'Warm paper', price: 20, paperLamp: '#ffe6bf', glow: '#ffdc9a', cloth: '#ffb5a7' },
      { name: 'Peach', price: 22, paperLamp: '#ffd0c0', glow: '#ffc6a8', cloth: '#cdb4db' },
      { name: 'Mint', price: 24, paperLamp: '#d4f0e4', glow: '#f2e6b0', cloth: '#ffb5a7' },
      { name: 'Lavender', price: 26, paperLamp: '#e8dcf4', glow: '#f6d8ea', cloth: '#f6d27a' },
      { name: 'Rose', price: 26, paperLamp: '#ffd3dd', glow: '#ffc4cf', cloth: '#b8e0d2' },
      { name: 'Butter', price: 30, paperLamp: '#fbeaa6', glow: '#ffe08a', cloth: '#a9cfe8' }
    ] }
  };
  const VARIANT_COUNT = 6;
  // merged palettes, built once: PAL[id][variant] = P with that variant's overrides
  const PAL = {};
  for (const id in VARIANTS) {
    PAL[id] = VARIANTS[id].list.map((v) => {
      const p = Object.assign({}, P, { pattern: v.pattern || '' });
      for (const k in v) if (k !== 'name' && k !== 'pattern' && k !== 'price') p[k] = rgb(v[k]);
      return p;
    });
  }
  const pal = (it) => (PAL[it.id] && PAL[it.id][it.variant | 0]) || P;
  const clampVariant = (v) => (Number.isInteger(v) && v >= 0 && v < VARIANT_COUNT ? v : 0);

  /* Room decor is painted piece by piece: one style index per floor tile and per
     wall segment (one tile wide). Arrays cover the biggest room, so tiles that
     appear when the room grows start with the original look (style 0). */
  const decor = {
    floor: new Uint8Array(MAX_GRID * MAX_GRID),   // [x + y * MAX_GRID]
    wallA: new Uint8Array(MAX_GRID),              // wall along y = 0, by x
    wallB: new Uint8Array(MAX_GRID)               // wall along x = 0, by y
  };
  const styleIndex = (v, list) => (Number.isInteger(v) && v >= 0 && v < list.length ? v : 0);
  const floorIdx = (x, y) => decor.floor[x + y * MAX_GRID];
  const floorTile = (x, y) => FLOOR_STYLES[floorIdx(x, y)] || FLOOR_STYLES[0];
  const wallSeg = (side, i) => WALL_STYLES[(side === 'A' ? decor.wallA : decor.wallB)[i]] || WALL_STYLES[0];
  /* fills a decor array from saved data, or with one style (older saves had a single style per kind) */
  function loadDecor(dst, src, one, list) {
    for (let q = 0; q < dst.length; q++) dst[q] = styleIndex(Array.isArray(src) ? src[q] : one, list);
  }
  const decorSnapshot = () => ({ floor: Array.from(decor.floor), wallA: Array.from(decor.wallA), wallB: Array.from(decor.wallB) });

  // ===== PRICING =====
  /* ---------------- money rules ----------------
     Every placement, restyle and paint click is bought. Paid-for pieces are not
     refunded when replaced or removed. DEV_MODE makes everything free. */
  const priceOfItem = (id, variant) => (DEV_MODE ? 0 : (VARIANTS[id].list[variant | 0] || VARIANTS[id].list[0]).price);
  const priceOfStyle = (s) => (DEV_MODE ? 0 : s.price);
  const priceText = (n) => (n === 0 ? 'Free' : String(n));

  // ===== CATALOG =====
  /* ================================================================
     Catalog
     ================================================================ */
  const CATALOG = {
    table_01: { name: 'Table', w: 1, d: 1, h: 21, draw: scaled('table_01', drawTable) },
    chair_01: { name: 'Chair', w: 1, d: 1, h: 19, seat: true, draw: scaled('chair_01', drawChair) },
    counter_01: { name: 'Counter', w: 2, d: 1, h: 27, draw: scaled('counter_01', drawCounter) },
    plant_01: { name: 'Plant', w: 1, d: 1, h: 30, draw: scaled('plant_01', drawPlant) },
    lantern_01: { name: 'Lantern', w: 1, d: 1, h: 35, light: true, draw: scaled('lantern_01', drawLantern) }
  };
  /* Furniture is drawn at a smaller scale than its tile so people read as the right size next to it.
     Each draw function still works in the old units; scaled() shrinks the whole piece about the centre of its footprint.
     Heights in the CATALOG above (h) are the shrunken heights, used for picking. */
  const ITEM_SCALE = { table_01: 0.68, chair_01: 0.66, counter_01: 0.66, plant_01: 0.7, lantern_01: 0.7 };
  const pivotOf = (it) => {
    const [w, d] = dims(it.id, it.rot || 0);
    return [PX(it.x + w / 2, it.y + d / 2), PY(it.x + w / 2, it.y + d / 2, 0)];
  };
  function scaled(id, fn) {
    return (it, now) => {
      const s = ITEM_SCALE[id], [cx, cy] = pivotOf(it);
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
      fn(it, now);
      ctx.restore();
    };
  }
  const TOOL_ORDER = ['move', 'table_01', 'chair_01', 'counter_01', 'plant_01', 'lantern_01', 'remove'];

  function dims(id, rot) {
    const c = CATALOG[id];
    return rot % 2 ? [c.d, c.w] : [c.w, c.d];
  }
  function cells(it) {
    const [w, d] = dims(it.id, it.rot);
    const out = [];
    for (let dy = 0; dy < d; dy++) for (let dx = 0; dx < w; dx++) out.push([it.x + dx, it.y + dy]);
    return out;
  }

  // ===== STATE =====
  /* ================================================================
     Shop state
     ================================================================ */
  const DEFAULT_NAME = 'Cozy Restaurant';
  const NAME_MAX = 20;    // user-perceived characters, so Thai vowel and tone marks don't count extra
  let shopName = DEFAULT_NAME;
  const segmenter = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter(undefined, { granularity: 'grapheme' }) : null;
  const graphemes = (s) => (segmenter ? Array.from(segmenter.segment(s), (g) => g.segment) : Array.from(s));
  const clipName = (s) => graphemes(String(s).replace(/[\u0000-\u001f\u007f]/g, '')).slice(0, NAME_MAX).join('');
  function cleanName(s) {
    const t = typeof s === 'string' ? clipName(s).trim() : '';
    return t || DEFAULT_NAME;
  }

  let level = 1, xp = 0;               // xp is progress inside the current level
  let N = 5;
  let items = [];   // { id, x, y, rot, born, anim }
  const gridFor = (lv) => Math.min(MAX_GRID, 5 + Math.floor(lv / 5));
  const inside = (x, y) => x >= 0 && y >= 0 && x < N && y < N;

  function itemOnTile(x, y) {
    for (const it of items) {
      const [w, d] = dims(it.id, it.rot);
      if (x >= it.x && x < it.x + w && y >= it.y && y < it.y + d) return it;
    }
    return null;
  }

  /* Every seat needs a walkable route from the door. */
  function pathsOk(list) {
    const blocked = new Uint8Array(N * N);
    for (const it of list) for (const [cx, cy] of cells(it)) blocked[cx + cy * N] = 1;
    const start = DOOR.x + DOOR.y * N;
    if (blocked[start]) return false;
    const seen = new Uint8Array(N * N);
    const stack = [start];
    seen[start] = 1;
    while (stack.length) {
      const k = stack.pop();
      const x = k % N, y = (k / N) | 0;
      for (const [sx, sy] of STEPS) {
        const nx = x + sx, ny = y + sy;
        if (!inside(nx, ny)) continue;
        const nk = nx + ny * N;
        if (blocked[nk] || seen[nk]) continue;
        seen[nk] = 1;
        stack.push(nk);
      }
    }
    for (const it of list) {
      if (!CATALOG[it.id].seat) continue;
      let ok = false;
      for (const [sx, sy] of STEPS) {
        const nx = it.x + sx, ny = it.y + sy;
        if (inside(nx, ny) && seen[nx + ny * N]) { ok = true; break; }
      }
      if (!ok) return false;
    }
    return true;
  }

  function blockedGrid() {
    const blocked = new Uint8Array(N * N);
    for (const it of items) for (const [cx, cy] of cells(it)) if (inside(cx, cy)) blocked[cx + cy * N] = 1;
    return blocked;
  }

  // ===== PATHFINDING =====
  /* A* on the floor grid, 4-way. The start and goal may be blocked
     (a customer standing up from a chair, or walking onto one).
     Returns a list of [x, y] tiles from start to goal, or null. */
  function astar(sx, sy, gx, gy, blocked) {
    if (!inside(sx, sy) || !inside(gx, gy)) return null;
    const total = N * N, start = sx + sy * N, goal = gx + gy * N;
    const g = new Float32Array(total).fill(Infinity);
    const came = new Int16Array(total).fill(-1);
    const closed = new Uint8Array(total);
    const h = (k) => Math.abs((k % N) - gx) + Math.abs(((k / N) | 0) - gy);
    const open = [start];
    g[start] = 0;
    while (open.length) {
      let bi = 0, bf = Infinity;
      for (let q = 0; q < open.length; q++) {
        const f = g[open[q]] + h(open[q]);
        if (f < bf) { bf = f; bi = q; }
      }
      const k = open[bi];
      open[bi] = open[open.length - 1];
      open.pop();
      if (k === goal) {
        const path = [];
        for (let c = goal; c !== -1; c = came[c]) path.push([c % N, (c / N) | 0]);
        return path.reverse();
      }
      if (closed[k]) continue;
      closed[k] = 1;
      const x = k % N, y = (k / N) | 0;
      for (const [dx, dy] of STEPS) {
        const nx = x + dx, ny = y + dy;
        if (!inside(nx, ny)) continue;
        const nk = nx + ny * N;
        if (closed[nk] || (blocked[nk] && nk !== goal)) continue;
        const ng = g[k] + 1;
        if (ng < g[nk]) { g[nk] = ng; came[nk] = k; open.push(nk); }
      }
    }
    return null;
  }

  /* A chair facing a table is a dining seat; any other chair is a waiting chair. */
  function seatTable(chair) {
    const [dx, dy] = DIRS[chair.rot];
    const t = itemOnTile(chair.x + dx, chair.y + dy);
    return t && t.id === 'table_01' ? t : null;
  }

  let layoutVersion = 0;
  function layoutChanged() {
    layoutVersion++;
    simOnLayout();
    updateContext();
  }

  /* Returns '' when the item fits, otherwise a reason key. */
  function checkPlace(cand, ignore) {
    const others = items.filter((it) => it !== ignore);
    for (const [cx, cy] of cells(cand)) {
      if (!inside(cx, cy)) return 'outside';
      if (cx === DOOR.x && cy === DOOR.y) return 'door';
      for (const o of others) {
        const [w, d] = dims(o.id, o.rot);
        if (cx >= o.x && cx < o.x + w && cy >= o.y && cy < o.y + d) return 'taken';
      }
    }
    others.push(cand);
    if (!pathsOk(others)) return 'path';
    return '';
  }
  const REASON = {
    outside: 'That doesn’t fit inside the room',
    door: 'Keep the doorway clear',
    taken: 'Something is already there',
    path: 'That would block the way to a chair'
  };

  function defaultLayout() {
    return [
      { id: 'counter_01', x: 3, y: 0, rot: 0 },
      { id: 'plant_01', x: 0, y: 0, rot: 0 },
      // row 1 and column 2 stay clear as a walkway from the door
      { id: 'table_01', x: 0, y: 3, rot: 0 },
      { id: 'chair_01', x: 0, y: 2, rot: 0 },
      { id: 'chair_01', x: 1, y: 3, rot: 1 },
      { id: 'table_01', x: 4, y: 3, rot: 0 },
      { id: 'chair_01', x: 3, y: 3, rot: 3 },
      { id: 'chair_01', x: 4, y: 2, rot: 0 },
      { id: 'lantern_01', x: 0, y: 4, rot: 0 },
      { id: 'plant_01', x: 4, y: 4, rot: 0 }
    ];
  }

  /* Adds items one by one, keeping only ones that are valid. */
  function adoptItems(list, animate) {
    items = [];
    const now = performance.now();
    let q = 0;
    for (const raw of list) {
      if (!raw || !CATALOG[raw.id]) continue;
      const it = { id: raw.id, x: raw.x | 0, y: raw.y | 0, rot: ((raw.rot | 0) % 4 + 4) % 4, variant: clampVariant(raw.variant), born: 0, anim: 'pop' };
      if (checkPlace(it, null)) continue;
      if (animate && !reduced) it.born = now + 120 + q++ * 70;
      items.push(it);
    }
  }

  // ===== SAVE =====
  /* Save format. v1: Phases 1-2. v2 adds name, decor, menu and item variants.
     v3 paints decor per piece: decor is { floor: [tile styles], wallA: [...], wallB: [...] }.
     v4 adds staff: [{ id, role, tier, name, skin, hair }]; speed and wage come from role and tier.
     v5 adds the look parts hairStyle, eye, face and acc to each person (older people get a random look when the roster is sanitized).
     migrate() upgrades older payloads in place; every field is read defensively. */
  const SAVE_VERSION = 5;
  function migrate(d) {
    if (d.v === 1) {
      d.name = DEFAULT_NAME;
      d.decor = { wall: 0, floor: 0 };
      for (const it of d.interior.items) if (it) it.variant = 0;
      d.menu = defaultMenu();
      d.v = 2;
    }
    if (d.v === 2) {
      // one style for the whole room becomes the same style on every piece
      const old = d.decor || {};
      const full = (n, v) => new Array(n).fill(v | 0);
      d.decor = { floor: full(MAX_GRID * MAX_GRID, old.floor), wallA: full(MAX_GRID, old.wall), wallB: full(MAX_GRID, old.wall) };
      d.v = 3;
    }
    if (d.v === 3) {
      // staff replace the self-cooking counters, so older shops get the free starter crew
      d.staff = starterCrew();
      d.v = 4;
    }
    if (d.v === 4) d.v = 5;   // staff look parts are filled in by sanitizeStaff()
    return d;
  }

  function save() {
    const data = {
      v: SAVE_VERSION, name: shopName, decor: decorSnapshot(),
      menu: menu.map((m) => ({ dishId: m.dishId, price: m.price })), level, xp, coins, rating: Math.round(rating * 100) / 100,
      stats: { served: stats.served, left: stats.left }, recent: recent.slice(),
      staff: staff.map((s) => ({ id: s.id, role: s.role, tier: s.tier, name: s.name, skin: s.skin, hair: s.hair, hairStyle: s.hairStyle, eye: s.eye, face: s.face, acc: s.acc })),
      interior: { gridSize: N, items: items.map((it) => ({ id: it.id, x: it.x, y: it.y, rot: it.rot, variant: it.variant })) }
    };
    store.set(SAVE_KEY, JSON.stringify(data));
  }
  let saveTimer = 0;
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }
  function load() {
    const raw = store.get(SAVE_KEY);
    if (!raw) return false;
    try {
      const d = JSON.parse(raw);
      if (!d || !(d.v >= 1 && d.v <= SAVE_VERSION) || !d.interior || !Array.isArray(d.interior.items)) return false;
      migrate(d);
      shopName = cleanName(d.name);
      const dc = d.decor || {};
      loadDecor(decor.floor, dc.floor, 0, FLOOR_STYLES);
      loadDecor(decor.wallA, dc.wallA, 0, WALL_STYLES);
      loadDecor(decor.wallB, dc.wallB, 0, WALL_STYLES);
      level = clamp(Math.floor(+d.level) || 1, 1, MAX_LEVEL);
      N = gridFor(level);
      xp = level >= MAX_LEVEL ? 0 : clamp(Math.floor(+d.xp) || 0, 0, xpNeed(level) - 1);
      menu = sanitizeMenu(d.menu);
      staff = sanitizeStaff(d.staff);
      adoptItems(d.interior.items, true);
      coins = Math.max(0, Math.floor(+d.coins) || 0);
      shownCoins = coins;
      if (typeof d.rating === 'number' && isFinite(d.rating)) rating = clamp(d.rating, 0, 100);
      if (d.stats) { stats.served = Math.max(0, d.stats.served | 0); stats.left = Math.max(0, d.stats.left | 0); }
      if (Array.isArray(d.recent)) recent = d.recent.filter((r) => typeof r === 'string' && /^(happy|chair|plate|clock|trash)$/.test(r)).slice(-20);
      return true;
    } catch (e) { return false; }
  }

  // ===== LIGHT =====
  /* ================================================================
     Real-time sky and light
     ================================================================ */
  // hour, ambient multiply, sky top, sky horizon, night amount
  const NIGHT_AMB = [0.7, 0.66, 0.9];
  const KEYS = [
    [0.0, NIGHT_AMB, '#262c5a', '#4c4c84', 1],
    [4.5, NIGHT_AMB, '#262c5a', '#4c4c84', 1],
    [6.0, [1.0, 0.86, 0.9], '#aab6e6', '#ffc8d0', 0.35],
    [7.5, [1, 1, 1], '#9fd3ee', '#e6f5fb', 0],
    [16.5, [1, 1, 1], '#9fd3ee', '#e6f5fb', 0],
    [18.0, [1.0, 0.84, 0.8], '#9c88c2', '#ffc0a3', 0.35],
    [19.5, NIGHT_AMB, '#262c5a', '#4c4c84', 1],
    [24.0, NIGHT_AMB, '#262c5a', '#4c4c84', 1]
  ];
  const light = { hour: 12, amb: [1, 1, 1], top: [159, 211, 238], low: [230, 245, 251], night: 0, sun: 0 };
  const PREVIEWS = [null, 6, 12, 18, 22];
  const PREVIEW_NAMES = ['Live', 'Dawn', 'Day', 'Dusk', 'Night'];
  let previewIdx = 0;

  function phaseName(h) {
    if (h >= 5 && h < 7) return 'Dawn';
    if (h >= 7 && h < 17) return 'Day';
    if (h >= 17 && h < 19) return 'Dusk';
    return 'Night';
  }
  function currentHour() {
    const p = PREVIEWS[previewIdx];
    if (p !== null) return p;
    const d = new Date();
    return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
  }
  function mix3(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
  let shownHour = null;
  function updateLight(dt) {
    const target = currentHour();
    // ease toward preview jumps so the sky blends instead of snapping
    if (shownHour === null || reduced) shownHour = target;
    else {
      let diff = target - shownHour;
      if (diff > 12) diff -= 24;
      if (diff < -12) diff += 24;
      shownHour = (shownHour + diff * Math.min(1, dt * 2.5) + 24) % 24;
    }
    const h = shownHour;
    let k = 0;
    while (k < KEYS.length - 2 && KEYS[k + 1][0] <= h) k++;
    const a = KEYS[k], b = KEYS[k + 1];
    const f = clamp((h - a[0]) / (b[0] - a[0]), 0, 1);
    const s = f * f * (3 - 2 * f);
    light.hour = h;
    light.amb = mix3(a[1], b[1], s);
    light.top = mix3(rgb(a[2]), rgb(b[2]), s);
    light.low = mix3(rgb(a[3]), rgb(b[3]), s);
    light.night = lerp(a[4], b[4], s);
    light.sun = clamp((h - 12) / 6, -1, 1);
  }

  function lit(c, f, a) {
    const r = clamp(c[0] * light.amb[0] * f, 0, 255) | 0;
    const g = clamp(c[1] * light.amb[1] * f, 0, 255) | 0;
    const b = clamp(c[2] * light.amb[2] * f, 0, 255) | 0;
    return a === undefined ? 'rgb(' + r + ',' + g + ',' + b + ')' : 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  const css = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';

  // ===== CAMERA =====
  /* ================================================================
     Camera
     ================================================================ */
  let W = 0, H = 0, DPR = 1;
  const cam = { x: 0, y: 0, zoom: 1, fit: 1 };
  /* Fit the room into the space between the top card and the toolbar, measured
     from the live layout. With animate, glide there unless the player has
     panned or zoomed since the last fit. */
  const hudEl = document.getElementById('hud');
  const toolbarEl = document.getElementById('toolbar');
  function fitCamera(animate) {
    const left = -(N + WALL_T) * TW, right = (N + WALL_T) * TW, mid = (left + right) / 2;
    const top = -WALL_H - WALL_T * TH * 2 - 4, bottom = 2 * N * TH + SLAB + 6;
    const worldW = right - left, worldH = bottom - top;
    const narrow = W < 640;
    const gap = narrow ? 6 : 12, padX = narrow ? 8 : 32;
    const hud = hudEl.getBoundingClientRect(), tb = toolbarEl.getBoundingClientRect();
    // the toolbar sits along the bottom, or docks on the right on short wide screens
    const docked = tb.left > W / 2;
    const floorY = docked ? H - gap : tb.top - gap;   // the front corner sits above the toolbar
    const xMax = docked ? tb.left - gap : W - padX;
    const cx = (padX + xMax) / 2;
    // The room's top edge falls away from its back corner at the iso slope (TH / TW),
    // so it only has to clear the top card where the two overlap horizontally.
    const ceilingFor = (z) => {
      const cornerX = cx - mid * z, half = (worldW / 2) * z;
      const p = clamp(cornerX, hud.left, hud.right);
      if (p < cx - half || p > cx + half) return gap;
      return Math.max(gap, hud.bottom + gap - Math.abs(p - cornerX) * (TH / TW));
    };
    const fits = (z) => ceilingFor(z) + worldH * z <= floorY;
    let lo = 0.35, hi = clamp((xMax - padX) / worldW, 0.35, 3.2);
    if (fits(hi)) lo = hi;
    else for (let q = 0; q < 24; q++) { const m = (lo + hi) / 2; if (fits(m)) lo = m; else hi = m; }
    const fit = lo;
    const ceil = ceilingFor(fit);
    const peak = ceil + Math.max(0, floorY - ceil - worldH * fit) / 2;   // centre in the free band
    const x = cx - mid * fit;
    const y = peak - top * fit;
    cam.fit = fit;
    if (animate && cam.user) return;
    cam.user = false;
    if (animate && !reduced) cam.anim = { x0: cam.x, y0: cam.y, z0: cam.zoom, x1: x, y1: y, z1: fit, t: 0 };
    else { cam.anim = null; cam.x = x; cam.y = y; cam.zoom = fit; }
  }
  function updateCamera(dt) {
    const a = cam.anim;
    if (!a) return;
    a.t = Math.min(1, a.t + dt / 0.35);
    const e = a.t * a.t * (3 - 2 * a.t);
    cam.x = lerp(a.x0, a.x1, e); cam.y = lerp(a.y0, a.y1, e); cam.zoom = lerp(a.z0, a.z1, e);
    if (a.t >= 1) cam.anim = null;
  }
  /* the HUD changed size (tab switch, level card): refit and keep the toast above the toolbar */
  function hudChanged() {
    if (!W) return;
    fitCamera(true);
    placeToast();
  }
  function placeToast() {
    const b = document.getElementById('bottom').getBoundingClientRect();
    const docked = b.left > W / 2;
    toastEl.style.bottom = docked ? '14px' : Math.round(H - b.top + 10) + 'px';
    toastEl.style.left = docked ? Math.round(b.left / 2) + 'px' : '';
    toastEl.style.maxWidth = docked ? Math.round(b.left - 24) + 'px' : '';
  }
  function zoomAt(sx, sy, factor) {
    cam.user = true;
    cam.anim = null;
    const nz = clamp(cam.zoom * factor, cam.fit * 0.6, cam.fit * 3);
    const f = nz / cam.zoom;
    cam.x = sx - (sx - cam.x) * f;
    cam.y = sy - (sy - cam.y) * f;
    cam.zoom = nz;
  }
  /* screen point -> floor coordinates; lift raises the sample point by z world px */
  function floorAt(sx, sy, lift) {
    const wx = (sx - cam.x) / cam.zoom, wy = (sy - cam.y) / cam.zoom + (lift || 0);
    const a = wx / TW, b = wy / TH;
    return [(a + b) / 2, (b - a) / 2];
  }
  function tileAt(sx, sy, lift) {
    const [fx, fy] = floorAt(sx, sy, lift);
    const x = Math.floor(fx), y = Math.floor(fy);
    return inside(x, y) ? [x, y] : null;
  }
  function resize() {
    W = world.clientWidth || window.innerWidth;
    H = world.clientHeight || window.innerHeight;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
    fitCamera();
    placeToast();
  }

  // ===== DRAW PRIMITIVES =====
  /* ================================================================
     Drawing primitives. World: x, y in tiles, z in px (up).
     ================================================================ */
  const PX = (x, y) => (x - y) * TW;
  const PY = (x, y, z) => (x + y) * TH - z;
  function poly(pts) {
    ctx.beginPath();
    for (let q = 0; q < pts.length; q++) {
      const p = pts[q];
      if (q) ctx.lineTo(PX(p[0], p[1]), PY(p[0], p[1], p[2]));
      else ctx.moveTo(PX(p[0], p[1]), PY(p[0], p[1], p[2]));
    }
    ctx.closePath();
  }
  function flat(x0, y0, x1, y1, z) { poly([[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]]); }

  /* Box with top lightest, +y face mid, +x face darkest, AO toward the floor. */
  function box(x0, y0, x1, y1, z0, z1, col, o) {
    o = o || {};
    const fl = 0.9 - 0.04 * light.sun, fr = 0.77 + 0.04 * light.sun;
    const xm = (x0 + x1) / 2, ym = (y0 + y1) / 2;
    poly([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]]);
    let g = ctx.createLinearGradient(0, PY(xm, y1, z1), 0, PY(xm, y1, z0) + 4);
    g.addColorStop(0, lit(col, fl));
    g.addColorStop(1, lit(col, fl * 0.84));
    ctx.fillStyle = g;
    ctx.fill();
    poly([[x1, y1, z0], [x1, y0, z0], [x1, y0, z1], [x1, y1, z1]]);
    g = ctx.createLinearGradient(0, PY(x1, ym, z1), 0, PY(x1, ym, z0) + 4);
    g.addColorStop(0, lit(col, fr));
    g.addColorStop(1, lit(col, fr * 0.84));
    ctx.fillStyle = g;
    ctx.fill();
    if (!o.noTop) {
      flat(x0, y0, x1, y1, z1);
      ctx.fillStyle = lit(o.top || col, 1.04);
      ctx.fill();
      // thin highlight on the two front top edges
      ctx.beginPath();
      ctx.moveTo(PX(x0, y1), PY(x0, y1, z1));
      ctx.lineTo(PX(x1, y1), PY(x1, y1, z1));
      ctx.lineTo(PX(x1, y0), PY(x1, y0, z1));
      ctx.strokeStyle = 'rgba(255,250,242,' + (0.45 * (1 - light.night * 0.6)).toFixed(3) + ')';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }
  function contact(cx, cy, r, a) {
    ctx.fillStyle = 'rgba(122,82,118,' + (a || 0.18) + ')';
    ctx.beginPath();
    ctx.ellipse(PX(cx, cy), PY(cx, cy, 0), Math.max(0.1, r * TW * 1.4), Math.max(0.1, r * TH * 1.4), 0, 0, Math.PI * 2);
    ctx.fill();
  }
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
  }

  /* glow sprites gathered during a frame, blended additively at the end */
  const glows = [];
  const pools = [];

  // ===== ITEMS =====
  /* ================================================================
     Items
     ================================================================ */
  function drawTable(it) {
    const C = pal(it);
    const x = it.x, y = it.y;
    contact(x + 0.5, y + 0.5, 0.36);
    const legs = [[0.2, 0.2], [0.74, 0.2], [0.2, 0.74], [0.74, 0.74]];
    for (const [lx, ly] of legs) box(x + lx, y + ly, x + lx + 0.06, y + ly + 0.06, 0, 13, C.woodDeep);
    // tablecloth with a short skirt
    box(x + 0.12, y + 0.12, x + 0.88, y + 0.88, 11, 18, C.cloth, { top: C.clothHi });
    if (C.pattern === 'gingham') {
      ctx.fillStyle = lit(C.cloth, 1.02, 0.55);
      for (let q = 0; q < 4; q++) {
        const t = 0.12 + q * 0.19 + 0.05;
        flat(x + t, y + 0.12, x + t + 0.09, y + 0.88, 18.1); ctx.fill();
        flat(x + 0.12, y + t, x + 0.88, y + t + 0.09, 18.1); ctx.fill();
      }
    } else if (C.pattern === 'dots') {
      ctx.fillStyle = lit(C.cream, 1.02, 0.9);
      for (let q = 0; q < 3; q++) for (let r = 0; r < 3; r++) {
        if (q === 1 && r === 1) continue;   // the vase stands in the middle
        const u = x + 0.25 + q * 0.25, v = y + 0.25 + r * 0.25;
        ctx.beginPath(); ctx.ellipse(PX(u, v), PY(u, v, 18.1), 2.2, 1.1, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    // scalloped trim on the visible skirt edges
    ctx.fillStyle = lit(C.cream, 0.98, 0.85);
    for (let q = 0; q < 4; q++) {
      const t = 0.12 + (q + 0.5) * 0.19;
      ctx.beginPath(); ctx.arc(PX(x + t, y + 0.88), PY(x + t, y + 0.88, 11.6), 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(PX(x + 0.88, y + t), PY(x + 0.88, y + t, 11.6), 1.5, 0, Math.PI * 2); ctx.fill();
    }
    // plates for the chairs facing this table: far ones before the vase, near ones after
    const seats = items.filter((c) => c.id === 'chair_01' && c.plate && seatTable(c) === it);
    const near = (c) => -DIRS[c.rot][0] - DIRS[c.rot][1] > 0;
    for (const c of seats) if (!near(c)) drawPlate(c);
    // bud vase with a little flower
    box(x + 0.45, y + 0.45, x + 0.55, y + 0.55, 18, 24, C.cushion);
    const fx = PX(x + 0.5, y + 0.5), fy = PY(x + 0.5, y + 0.5, 28);
    ctx.strokeStyle = lit(C.leaf, 0.9);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(fx, fy + 4); ctx.lineTo(fx, fy); ctx.stroke();
    ctx.fillStyle = lit(C.cloth, 1.02);
    for (let q = 0; q < 5; q++) {
      const a = q * 1.2566;
      ctx.beginPath(); ctx.arc(fx + Math.cos(a) * 1.9, fy + Math.sin(a) * 1.4, 1.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = lit(C.gold, 1);
    ctx.beginPath(); ctx.arc(fx, fy, 1.1, 0, Math.PI * 2); ctx.fill();
    for (const c of seats) if (near(c)) drawPlate(c);
  }

  function drawChair(it, now) {
    const C = pal(it);
    const x = it.x, y = it.y;
    const [dx, dy] = DIRS[it.rot];
    const a = 0.27, b = 0.73, t = 0.08;
    contact(x + 0.5, y + 0.5, 0.26);
    for (const [lx, ly] of [[a, a], [b - 0.05, a], [a, b - 0.05], [b - 0.05, b - 0.05]]) {
      box(x + lx, y + ly, x + lx + 0.05, y + ly + 0.05, 0, 9, C.woodDeep);
    }
    let back;
    if (dy === 1) back = [x + a, y + a, x + b, y + a + t];
    else if (dy === -1) back = [x + a, y + b - t, x + b, y + b];
    else if (dx === 1) back = [x + a, y + a, x + a + t, y + b];
    else back = [x + b - t, y + a, x + b, y + b];
    const backFar = dy === 1 || dx === 1;
    const drawBack = () => {
      box(back[0], back[1], back[2], back[3], 12, 26, C.wood);
      // cushioned pad on the backrest
      const inset = 0.06;
      if (dx === 0) box(back[0] + inset, back[1] - 0.005, back[2] - inset, back[3] + 0.005, 16, 23, C.cushion, { top: C.cushionHi });
      else box(back[0] - 0.005, back[1] + inset, back[2] + 0.005, back[3] - inset, 16, 23, C.cushion, { top: C.cushionHi });
    };
    if (backFar) drawBack();
    box(x + a, y + a, x + b, y + b, 9, 12, C.wood);
    box(x + a + 0.03, y + a + 0.03, x + b - 0.03, y + b - 0.03, 12, 14, C.cushion, { top: C.cushionHi });
    const sitter = it.occupant && it.occupant.seated ? it.occupant : null;
    if (sitter) {
      // the guest is not shrunk with the chair: undo the scale around the same pivot and lift by the scaled seat height
      const s = ITEM_SCALE.chair_01, [cx, cy] = pivotOf(it);
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(1 / s, 1 / s); ctx.translate(-cx, -cy);
      drawPerson(sitter, x + 0.5 - dx * 0.06, y + 0.5 - dy * 0.06, 13 * s, true, now);
      ctx.restore();
    }
    if (!backFar) drawBack();
  }

  function drawCounter(it, now) {
    const C = pal(it);
    const [w, d] = dims(it.id, it.rot);
    const x0 = it.x, y0 = it.y, x1 = x0 + w, y1 = y0 + d;
    ctx.fillStyle = 'rgba(122,82,118,0.16)';
    flat(x0 - 0.02, y0 - 0.02, x1 + 0.06, y1 + 0.06, 0);
    ctx.fill();
    box(x0 + 0.1, y0 + 0.1, x1 - 0.1, y1 - 0.1, 0, 4, C.lavDeep);
    box(x0 + 0.06, y0 + 0.06, x1 - 0.06, y1 - 0.06, 4, 28, C.lav);
    // pastel band and panel seams on the front faces
    box(x0 + 0.055, y0 + 0.055, x1 - 0.055, y1 - 0.055, 19, 21.5, C.blush, { noTop: true });
    if (C.pattern === 'stripes') {
      // vertical candy stripes on the two visible front faces, below the band
      for (let u = 0.25; u < Math.max(w, d); u += 0.5) {
        if (u < w) box(x0 + u - 0.06, y1 - 0.0551, x0 + u + 0.06, y1 - 0.055, 5, 18, C.blush, { noTop: true });
        if (u < d) box(x1 - 0.0551, y0 + u - 0.06, x1 - 0.055, y0 + u + 0.06, 5, 18, C.blush, { noTop: true });
      }
    }
    ctx.strokeStyle = lit(C.lavDeep, 0.95, 0.7);
    ctx.lineWidth = 0.8;
    if (w > 1) {
      ctx.beginPath(); ctx.moveTo(PX(x0 + 1, y1 - 0.06), PY(x0 + 1, y1 - 0.06, 5)); ctx.lineTo(PX(x0 + 1, y1 - 0.06), PY(x0 + 1, y1 - 0.06, 18)); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(PX(x1 - 0.06, y0 + 1), PY(x1 - 0.06, y0 + 1, 5)); ctx.lineTo(PX(x1 - 0.06, y0 + 1), PY(x1 - 0.06, y0 + 1, 18)); ctx.stroke();
    }
    box(x0 + 0.02, y0 + 0.02, x1 - 0.02, y1 - 0.02, 28, 31, C.counterTop);
    // cake under a glass dome on one end, a service bell on the other
    const ends = [[x0 + 0.5, y0 + 0.5], [x0 + (w > 1 ? 1.5 : 0.5), y0 + (d > 1 ? 1.5 : 0.5)]];
    const flip = it.rot >= 2;
    const cakeAt = flip ? ends[1] : ends[0], bellAt = flip ? ends[0] : ends[1];
    const order = flip ? [bellAt, cakeAt] : [cakeAt, bellAt];
    for (const e of order) {
      if (e === cakeAt) drawCake(e[0], e[1]);
      else drawBell(e[0], e[1]);
    }
    if (it.cook) drawSteam(x0 + w / 2, y0 + d / 2, 31, it.cook.t / it.cook.dur, now);
  }
  /* soft steam wisps over a cooking counter, plus a small progress pip */
  function drawSteam(cx, cy, z, prog, now) {
    const sx = PX(cx, cy), sy = PY(cx, cy, z);
    for (let q = 0; q < 3; q++) {
      const ph = reduced ? q / 3 : ((now * 0.0006) + q / 3) % 1;
      const a = Math.sin(ph * Math.PI) * 0.55;
      ctx.fillStyle = 'rgba(255,250,244,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(sx + Math.sin(ph * 6 + q * 2) * 3 + (q - 1) * 5, sy - 6 - ph * 22, 2.5 + ph * 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,250,244,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx, sy - 34, 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(prog, 0, 1)); ctx.stroke();
  }
  function drawCake(cx, cy) {
    const sx = PX(cx, cy), sy = PY(cx, cy, 31);
    ctx.fillStyle = lit(P.cream, 1);
    ctx.beginPath(); ctx.ellipse(sx, sy, 12, 5.5, 0, 0, Math.PI * 2); ctx.fill();
    box(cx - 0.16, cy - 0.16, cx + 0.16, cy + 0.16, 32, 38, P.cake, { top: P.cream });
    ctx.fillStyle = lit(P.cloth, 1.02);
    ctx.beginPath(); ctx.arc(sx, PY(cx, cy, 40.5), 1.8, 0, Math.PI * 2); ctx.fill();
    // glass dome
    ctx.fillStyle = 'rgba(232,246,252,' + (0.32 - light.night * 0.1).toFixed(3) + ')';
    ctx.beginPath(); ctx.ellipse(sx, sy - 1, 11, 16, 0, Math.PI, 0); ctx.ellipse(sx, sy - 1, 11, 4.5, 0, 0, Math.PI); ctx.fill();
    ctx.strokeStyle = 'rgba(255,252,246,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(sx - 3, sy - 8, 6, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
    ctx.fillStyle = lit(P.lavDeep, 1);
    ctx.beginPath(); ctx.arc(sx, sy - 17.5, 1.6, 0, Math.PI * 2); ctx.fill();
  }
  function drawBell(cx, cy) {
    const sx = PX(cx, cy), sy = PY(cx, cy, 31);
    ctx.fillStyle = lit(P.woodDeep, 1);
    ctx.beginPath(); ctx.ellipse(sx, sy, 6, 2.8, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createLinearGradient(sx - 5, 0, sx + 5, 0);
    g.addColorStop(0, lit(P.gold, 1.08));
    g.addColorStop(1, lit(P.gold, 0.82));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(sx, sy - 1, 5, 6, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(sx, sy - 7.6, 1.3, 0, Math.PI * 2); ctx.fill();
  }

  function drawPlant(it, now) {
    const C = pal(it);
    const x = it.x, y = it.y;
    contact(x + 0.5, y + 0.5, 0.24);
    box(x + 0.33, y + 0.33, x + 0.67, y + 0.67, 0, 13, C.pot);
    box(x + 0.3, y + 0.3, x + 0.7, y + 0.7, 13, 15.5, C.potHi, { top: C.woodDeep });
    const sx = PX(x + 0.5, y + 0.5), sy = PY(x + 0.5, y + 0.5, 15);
    const sway = reduced ? 0 : Math.sin(now * 0.0011 + x * 1.7 + y * 2.3) * 0.05;
    const leaves = [[-1.15, 15], [1.15, 15], [-0.75, 19], [0.75, 19], [-0.32, 22], [0.32, 22], [0, 24]];
    for (let q = 0; q < leaves.length; q++) {
      const ang = -Math.PI / 2 + leaves[q][0] + sway * (1 + q * 0.15);
      const L = leaves[q][1];
      ctx.save();
      ctx.translate(sx + Math.cos(ang) * L * 0.5, sy + Math.sin(ang) * L * 0.5);
      ctx.rotate(ang);
      ctx.fillStyle = lit(q % 2 ? C.leaf : C.leafHi, q < 2 ? 0.86 : 1);
      ctx.beginPath(); ctx.ellipse(0, 0, L * 0.5, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // two tiny blossoms
    ctx.fillStyle = lit(C.cloth, 1.04);
    ctx.beginPath(); ctx.arc(sx - 7 + sway * 40, sy - 15, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + 8 + sway * 40, sy - 12, 1.7, 0, Math.PI * 2); ctx.fill();
  }

  function lanternGlow(it, now) {
    const flick = reduced ? 1 : 1 + 0.05 * Math.sin(now * 0.008 + it.x * 3.1 + it.y * 1.3);
    return clamp(light.night, 0, 1) * flick;
  }
  function drawLantern(it, now) {
    const C = pal(it);
    const x = it.x, y = it.y;
    contact(x + 0.5, y + 0.5, 0.2);
    box(x + 0.38, y + 0.38, x + 0.62, y + 0.62, 0, 3, C.woodDeep);
    box(x + 0.475, y + 0.475, x + 0.525, y + 0.525, 3, 31, C.wood);
    const sx = PX(x + 0.5, y + 0.5), sy = PY(x + 0.5, y + 0.5, 40);
    const n = lanternGlow(it, now);
    ctx.fillStyle = lit(C.woodDeep, 1);
    rrect(sx - 4, sy - 11, 8, 3, 1.2); ctx.fill();
    rrect(sx - 4, sy + 8, 8, 3, 1.2); ctx.fill();
    const day = lit(C.paperLamp, 1);
    ctx.fillStyle = day;
    ctx.beginPath(); ctx.ellipse(sx, sy, 7, 9.5, 0, 0, Math.PI * 2); ctx.fill();
    if (n > 0.02) {
      ctx.fillStyle = css(C.glow, (0.9 * n).toFixed(3));
      ctx.beginPath(); ctx.ellipse(sx, sy, 7, 9.5, 0, 0, Math.PI * 2); ctx.fill();
      glows.push(sx, sy, 26, 0.55 * n);
    }
    // paper ribs
    ctx.strokeStyle = n > 0.3 ? 'rgba(232,170,110,0.55)' : lit(C.woodDeep, 1.05, 0.45);
    ctx.lineWidth = 0.8;
    for (const k of [-0.5, 0.5]) {
      ctx.beginPath(); ctx.ellipse(sx, sy, Math.max(0.1, 7 * Math.abs(k) * 1.2), 9.5, 0, -Math.PI / 2, Math.PI / 2, k < 0); ctx.stroke();
    }
    ctx.fillStyle = lit(C.cloth, 0.95);
    rrect(sx - 0.8, sy + 11, 1.6, 5, 0.8); ctx.fill();
  }

  // ===== ROOM SHELL =====
  /* ================================================================
     Room shell: slab, floor, walls, door, windows
     ================================================================ */
  function drawRoomShadow() {
    const cx = PX(N / 2, N / 2), cy = PY(N / 2, N / 2, -SLAB) + N * TH * 0.6 + 18;
    const rx = N * TW * 1.15, ry = N * TH * 0.75;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx);
    g.addColorStop(0, css(mix3([104, 78, 128], light.top, 0.25), 0.26));
    g.addColorStop(1, css([104, 78, 128], 0));
    ctx.fillStyle = g;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, ry / rx);
    ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function drawSlab() {
    box(-WALL_T, -WALL_T, N, N, -SLAB, 0, P.slab, { noTop: true });
    // a darker underside lip
    box(-WALL_T, -WALL_T, N, N, -SLAB, -SLAB + 4, P.slabDeep, { noTop: true });
  }
  /* floor patterns, all in floor coordinates so they follow the iso grid */
  function floorLine(x0, y0, x1, y1, col, w) {
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(PX(x0, y0), PY(x0, y0, 0.1)); ctx.lineTo(PX(x1, y1), PY(x1, y1, 0.1)); ctx.stroke();
  }
  const FLOOR_DRAW = {
    checker(F) {
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        flat(x, y, x + 1, y + 1, 0);
        ctx.fillStyle = lit((x + y) % 2 ? F.b : F.a, 1.02);
        ctx.fill();
      }
    },
    wood(F) {
      // three planks per tile row, running along x, with staggered end joints
      const rows = N * 3;
      for (let r = 0; r < rows; r++) {
        const y0 = r / 3, y1 = (r + 1) / 3;
        let x = -((r * 0.57) % 1.5);
        for (let s = 0; x < N; s++) {
          const xa = Math.max(0, x), xb = Math.min(N, x + 1.5);
          flat(xa, y0, xb, y1, 0);
          ctx.fillStyle = lit(noise(r, s) > 0.5 ? F.a : F.b, 1.02);
          ctx.fill();
          if (x > 0) floorLine(x, y0, x, y1, lit(F.c, 1, 0.7), 0.7);
          x += 1.5;
        }
        if (r) floorLine(0, y0, N, y0, lit(F.c, 1, 0.55), 0.7);
      }
    },
    stripes(F) {
      flat(0, 0, N, N, 0);
      ctx.fillStyle = lit(F.a, 1.02);
      ctx.fill();
      ctx.fillStyle = lit(F.b, 1.02);
      for (let s = 0; s < N; s += 0.5) { flat(0, s + 0.3, N, s + 0.5, 0); ctx.fill(); }
    },
    marble(F) {
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        flat(x, y, x + 1, y + 1, 0);
        ctx.fillStyle = lit(mix3(F.a, F.b, noise(x + 40, y + 7)), 1.02);
        ctx.fill();
      }
      // soft veins wandering across the slabs, then fine grout
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        if (noise(x, y + 90) < 0.45) continue;
        let px = x + noise(x, y + 3) * 0.6, py = y + 0.05;
        ctx.strokeStyle = lit(F.c, 1, 0.55);
        ctx.lineWidth = 0.7;
        ctx.beginPath(); ctx.moveTo(PX(px, py), PY(px, py, 0.1));
        for (let k = 1; k <= 4; k++) {
          px = clamp(px + (noise(x * 7 + k, y) - 0.4) * 0.3, x, x + 1);
          py = y + k * 0.23;
          ctx.lineTo(PX(px, py), PY(px, py, 0.1));
        }
        ctx.stroke();
      }
      for (let s = 1; s < N; s++) {
        floorLine(s, 0, s, N, lit(F.b, 0.96, 0.8), 0.6);
        floorLine(0, s, N, s, lit(F.b, 0.96, 0.8), 0.6);
      }
    },
    dots(F) {
      flat(0, 0, N, N, 0);
      ctx.fillStyle = lit(F.a, 1.02);
      ctx.fill();
      ctx.fillStyle = lit(F.b, 1.02);
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        for (const [ox, oy] of [[0.25, 0.25], [0.75, 0.75]]) {
          ctx.beginPath(); ctx.ellipse(PX(x + ox, y + oy), PY(x + ox, y + oy, 0.1), 3.4, 1.7, 0, 0, Math.PI * 2); ctx.fill();
        }
      }
    },
    rug(F) {
      FLOOR_DRAW.checker({ a: F.a, b: mix3(F.a, F.c, 0.12) });
      // one big plain rug with a darker border band
      const m = 0.4;
      flat(m, m + 0.6, N - m, N - m, 0.2);
      ctx.fillStyle = lit(F.c, 1.02);
      ctx.fill();
      flat(m + 0.14, m + 0.74, N - m - 0.14, N - m - 0.14, 0.3);
      ctx.fillStyle = lit(F.b, 1.02);
      ctx.fill();
    }
  };
  /* Each style paints the tiles that use it: its pattern is drawn across the room
     and clipped to those tiles, so mixed floors share one pattern grid per style. */
  function drawFloor() {
    const used = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const k = floorIdx(x, y);
      (used[k] || (used[k] = [])).push(x, y);
    }
    for (let k = 0; k < used.length; k++) {
      const tiles = used[k];
      if (!tiles) continue;
      const F = FLOOR_STYLES[k];
      if (tiles.length === N * N * 2) { FLOOR_DRAW[F.pattern](F); continue; }
      ctx.beginPath();
      for (let q = 0; q < tiles.length; q += 2) {
        const x = tiles[q], y = tiles[q + 1];
        ctx.moveTo(PX(x, y), PY(x, y, 0));
        ctx.lineTo(PX(x + 1, y), PY(x + 1, y, 0));
        ctx.lineTo(PX(x + 1, y + 1), PY(x + 1, y + 1, 0));
        ctx.lineTo(PX(x, y + 1), PY(x, y + 1, 0));
        ctx.closePath();
      }
      // a base coat, slightly fat, so no sky shows through between different styles
      ctx.fillStyle = lit(F.a, 1.02);
      ctx.strokeStyle = ctx.fillStyle;
      ctx.lineWidth = 0.8;
      ctx.fill();
      ctx.stroke();
      ctx.save();
      ctx.clip();
      FLOOR_DRAW[F.pattern](F);
      ctx.restore();
    }
    // paint preview: the chosen floor on the tile under the cursor
    const pt = paintTarget();
    if (pt && !pt.side) {
      const F = FLOOR_STYLES[paint.i];
      ctx.save();
      flat(pt.x, pt.y, pt.x + 1, pt.y + 1, 0);
      ctx.clip();
      ctx.globalAlpha = 0.88;
      FLOOR_DRAW[F.pattern](F);
      ctx.restore();
    }
    // soft AO along the back walls
    let g = ctx.createLinearGradient(PX(0, 0), PY(0, 0, 0), PX(0, 0.6), PY(0, 0.6, 0));
    g.addColorStop(0, 'rgba(150,100,130,0.16)');
    g.addColorStop(1, 'rgba(150,100,130,0)');
    ctx.fillStyle = g;
    flat(0, 0, 0.6, N, 0); ctx.fill();
    g = ctx.createLinearGradient(PX(0, 0), PY(0, 0, 0), PX(0.6, 0), PY(0.6, 0, 0));
    g.addColorStop(0, 'rgba(150,100,130,0.16)');
    g.addColorStop(1, 'rgba(150,100,130,0)');
    ctx.fillStyle = g;
    flat(0, 0, N, 0.6, 0); ctx.fill();
    // welcome mat at the door
    const m = DOOR;
    flat(m.x + 0.12, m.y + 0.08, m.x + 0.88, m.y + 0.62, 0.3);
    ctx.fillStyle = lit(P.mat, 1);
    ctx.fill();
    flat(m.x + 0.2, m.y + 0.16, m.x + 0.8, m.y + 0.54, 0.4);
    ctx.fillStyle = lit(P.matHi, 1);
    ctx.fill();
  }

  /* wall A runs along y = 0 (faces +y), wall B along x = 0 (faces +x) */
  function wallA(pts) { return pts.map((p) => [p[0], 0, p[1]]); }
  function wallB(pts) { return pts.map((p) => [0, p[0], p[1]]); }
  /* One wall segment (a tile wide) in its own wallpaper. Each strip reaches 0.02
     into the next segment, which is drawn afterwards, so no hairline gaps show. */
  function drawWallSegment(mk, WS, i, shade) {
    const u0 = i, u1 = Math.min(N, i + 1.02);
    // wallpaper
    poly(mk([[u0, 26], [u1, 26], [u1, WALL_H], [u0, WALL_H]]));
    ctx.fillStyle = lit(WS.paper, shade);
    ctx.fill();
    ctx.fillStyle = lit(WS.stripe, shade, 0.85);
    for (const s of [i + 0.25, i + 0.75]) {
      poly(mk([[s, 26], [s + 0.12, 26], [s + 0.12, WALL_H], [s, WALL_H]]));
      ctx.fill();
    }
    // wainscot, chair rail, skirting
    poly(mk([[u0, 0], [u1, 0], [u1, 26], [u0, 26]]));
    const g = ctx.createLinearGradient(0, PY(0, 0, 26), 0, PY(0, 0, 0) + N * TH);
    g.addColorStop(0, lit(WS.wainscot, shade));
    g.addColorStop(1, lit(WS.wainscot, shade * 0.9));
    ctx.fillStyle = g;
    ctx.fill();
    ctx.fillStyle = lit(WS.wainscot, shade * 0.93);
    for (const s of i ? [i, i + 0.5] : [i + 0.5]) {
      poly(mk([[s - 0.015, 4], [s + 0.015, 4], [s + 0.015, 24], [s - 0.015, 24]]));
      ctx.fill();
    }
    poly(mk([[u0, 24], [u1, 24], [u1, 28], [u0, 28]]));
    ctx.fillStyle = lit(WS.trim, shade);
    ctx.fill();
    poly(mk([[u0, 0], [u1, 0], [u1, 4], [u0, 4]]));
    ctx.fillStyle = lit(WS.base, shade);
    ctx.fill();
    // crown trim
    poly(mk([[u0, WALL_H - 4], [u1, WALL_H - 4], [u1, WALL_H], [u0, WALL_H]]));
    ctx.fillStyle = lit(WS.trim, shade);
    ctx.fill();
  }
  function drawWalls() {
    const shadeA = 0.97 - 0.03 * light.sun, shadeB = 0.88 + 0.03 * light.sun;
    for (const [side, mk, shade] of [['A', wallA, shadeA], ['B', wallB, shadeB]]) {
      for (let i = 0; i < N; i++) drawWallSegment(mk, wallSeg(side, i), i, shade);
    }
    // paint preview: the chosen wallpaper on the segment under the cursor, behind windows and furniture
    const pt = paintTarget();
    if (pt && pt.side) {
      const mk = pt.side === 'A' ? wallA : wallB;
      ctx.save();
      poly(mk([[pt.i, 0], [pt.i + 1, 0], [pt.i + 1, WALL_H], [pt.i, WALL_H]]));
      ctx.clip();
      ctx.globalAlpha = 0.88;
      drawWallSegment(mk, WALL_STYLES[paint.i], pt.i, pt.side === 'A' ? shadeA : shadeB);
      ctx.restore();
    }
    // wall caps and exposed ends
    ctx.fillStyle = lit(wallSeg('A', 0).trim, 1.04);
    poly([[-WALL_T, -WALL_T, WALL_H], [N, -WALL_T, WALL_H], [N, 0, WALL_H], [0, 0, WALL_H], [0, N, WALL_H], [-WALL_T, N, WALL_H]]);
    ctx.fill();
    box(N - 0.001, -WALL_T, N, 0, 0, WALL_H, wallSeg('A', N - 1).paper, { noTop: true });
    box(-WALL_T, N - 0.001, 0, N, 0, WALL_H, wallSeg('B', N - 1).paper, { noTop: true });

    // windows: one every three tiles along each wall, skipping the door
    for (let c = 3.6; c + 0.65 <= N; c += 3) drawWindow('A', c);
    for (let c = 2.5; c + 0.65 <= N; c += 3) drawWindow('B', c);
    drawDoor();
  }
  function onWall(side, u, z) { return side === 'A' ? [u, 0, z] : [0, u, z]; }
  function drawWindow(side, c) {
    const WS = wallSeg(side, Math.floor(c));
    const u0 = c - 0.6, u1 = c + 0.6, z0 = 34, z1 = 62;
    const shade = side === 'A' ? 1 : 0.92;
    const q = (a, b, za, zb) => poly([onWall(side, a, za), onWall(side, b, za), onWall(side, b, zb), onWall(side, a, zb)]);
    q(u0 - 0.06, u1 + 0.06, z0 - 3, z1 + 3);
    ctx.fillStyle = lit(WS.trim, shade);
    ctx.fill();
    // sky seen through the glass (not multiplied: it IS the sky)
    q(u0, u1, z0, z1);
    const top = onWall(side, c, z1), bot = onWall(side, c, z0);
    const g = ctx.createLinearGradient(0, PY(top[0], top[1], top[2]), 0, PY(bot[0], bot[1], bot[2]));
    g.addColorStop(0, css(light.top, 1));
    g.addColorStop(1, css(light.low, 1));
    ctx.fillStyle = g;
    ctx.fill();
    if (light.night > 0.2) {
      ctx.fillStyle = 'rgba(255,246,220,' + (light.night * 0.9).toFixed(3) + ')';
      for (let s = 0; s < 4; s++) {
        const p = onWall(side, lerp(u0 + 0.1, u1 - 0.1, noise(s, c * 10)), lerp(z0 + 4, z1 - 3, noise(c * 10, s + 5)));
        ctx.beginPath(); ctx.arc(PX(p[0], p[1]), PY(p[0], p[1], p[2]), 0.9, 0, Math.PI * 2); ctx.fill();
      }
    }
    // mullions
    ctx.fillStyle = lit(WS.trim, shade);
    q(c - 0.03, c + 0.03, z0, z1); ctx.fill();
    q(u0, u1, (z0 + z1) / 2 - 1, (z0 + z1) / 2 + 1); ctx.fill();
    // curtains
    ctx.fillStyle = lit(P.cloth, shade * 0.98);
    q(u0 - 0.1, u0 + 0.12, z0 - 6, z1 + 4); ctx.fill();
    q(u1 - 0.12, u1 + 0.1, z0 - 6, z1 + 4); ctx.fill();
    ctx.fillStyle = lit(P.clothHi, shade);
    q(u0 - 0.04, u0 + 0.02, z0 - 6, z1 + 4); ctx.fill();
    q(u1 - 0.06, u1, z0 - 6, z1 + 4); ctx.fill();
    // little sill
    if (side === 'A') box(u0 - 0.08, 0, u1 + 0.08, 0.08, z0 - 5, z0 - 3, WS.trim);
    else box(0, u0 - 0.08, 0.08, u1 + 0.08, z0 - 5, z0 - 3, WS.trim);
  }
  function drawDoor() {
    const WS = wallSeg('A', DOOR.x);
    const u0 = DOOR.x + 0.14, u1 = DOOR.x + 0.86, zt = 54;
    const q = (a, b, za, zb) => poly([[a, 0, za], [b, 0, za], [b, 0, zb], [a, 0, zb]]);
    q(u0 - 0.06, u1 + 0.06, 0, zt + 4);
    ctx.fillStyle = lit(WS.trim, 1);
    ctx.fill();
    q(u0, u1, 0, zt);
    if (doorOpen > 0.02) {
      // the sky outside, and the door swung in on its hinge
      const sg = ctx.createLinearGradient(0, PY(DOOR.x + 0.5, 0, zt), 0, PY(DOOR.x + 0.5, 0, 0));
      sg.addColorStop(0, css(light.top, 1));
      sg.addColorStop(1, css(light.low, 1));
      ctx.fillStyle = sg;
      ctx.fill();
      q(u0, u1, 0, 6);
      ctx.fillStyle = lit(P.slab, 1);
      ctx.fill();
      const L = u1 - u0, th = doorOpen * 1.35;
      const ex = u0 + L * Math.cos(th), ey = L * Math.sin(th);
      poly([[u0, 0, 0], [ex, ey, 0], [ex, ey, zt], [u0, 0, zt]]);
      ctx.fillStyle = lit(P.door, 0.94);
      ctx.fill();
      return;
    }
    const g = ctx.createLinearGradient(0, PY(DOOR.x + 0.5, 0, zt), 0, PY(DOOR.x + 0.5, 0, 0));
    g.addColorStop(0, lit(P.door, 1));
    g.addColorStop(1, lit(P.doorDeep, 0.95));
    ctx.fillStyle = g;
    ctx.fill();
    // panels
    ctx.fillStyle = lit(P.doorDeep, 0.98, 0.6);
    q(u0 + 0.08, u1 - 0.08, 6, 22); ctx.fill();
    // round window showing the sky
    const cx = PX(DOOR.x + 0.5, 0), cy = PY(DOOR.x + 0.5, 0, 38);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.transform(1, 0.5, 0, 1, 0, 0);
    ctx.fillStyle = lit(WS.trim, 1);
    ctx.beginPath(); ctx.arc(0, 0, 7.5, 0, Math.PI * 2); ctx.fill();
    const sg = ctx.createLinearGradient(0, -6, 0, 6);
    sg.addColorStop(0, css(light.top, 1));
    sg.addColorStop(1, css(light.low, 1));
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(0, 0, 5.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // knob
    const k = [u1 - 0.12, 0, 26];
    ctx.fillStyle = lit(P.gold, 1);
    ctx.beginPath(); ctx.arc(PX(k[0], k[1]), PY(k[0], k[1], k[2]), 1.8, 0, Math.PI * 2); ctx.fill();
  }

  // ===== SKY =====
  /* ================================================================
     Sky backdrop (screen space)
     ================================================================ */
  const stars = [];
  for (let q = 0; q < 70; q++) stars.push({ x: noise(q, 1), y: noise(q, 2) * 0.75, r: 0.6 + noise(q, 3) * 1.1, ph: noise(q, 4) * 6.28 });
  const clouds = [];
  for (let q = 0; q < 5; q++) clouds.push({ x: noise(q, 9), y: 0.08 + noise(q, 8) * 0.45, s: 0.6 + noise(q, 7) * 0.7, v: 0.004 + noise(q, 6) * 0.006 });
  function drawSky(now, dt) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, css(light.top, 1));
    g.addColorStop(1, css(light.low, 1));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    const n = light.night;
    if (n > 0.02) {
      for (const s of stars) {
        const tw = reduced ? 0.8 : 0.6 + 0.4 * Math.sin(now * 0.002 + s.ph);
        ctx.fillStyle = 'rgba(255,246,222,' + (n * tw * 0.9).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    // sun by day, moon by night, on a gentle arc
    const h = light.hour;
    const isDay = h >= 6 && h < 18;
    const p = isDay ? (h - 6) / 12 : (((h - 18) + 24) % 24) / 12;
    const bx = W * (0.08 + 0.84 * p), by = H * 0.5 - Math.sin(p * Math.PI) * H * 0.36;
    const r = clamp(Math.min(W, H) * 0.045, 16, 34);
    const halo = ctx.createRadialGradient(bx, by, r * 0.6, bx, by, r * 3);
    halo.addColorStop(0, isDay ? 'rgba(255,236,190,0.5)' : 'rgba(236,232,255,0.3)');
    halo.addColorStop(1, 'rgba(255,236,190,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(bx - r * 3, by - r * 3, r * 6, r * 6);
    ctx.save();
    if (!isDay) {
      // crescent: clip away an offset disc so the sky glow shows through the bite
      ctx.beginPath();
      ctx.rect(bx - r * 2, by - r * 2, r * 4, r * 4);
      ctx.arc(bx + r * 0.45, by - r * 0.25, r * 0.85, 0, Math.PI * 2, true);
      ctx.clip('evenodd');
    }
    ctx.fillStyle = isDay ? '#ffe7a8' : '#f3eedd';
    ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // drifting clouds, tinted by the sky
    const cc = mix3([255, 248, 242], light.low, 0.35);
    for (const c of clouds) {
      c.x += c.v * dt * (reduced ? 0.3 : 1);
      if (c.x > 1.25) c.x = -0.25;
      const cx = c.x * W, cy = c.y * H, s = c.s * clamp(W / 900, 0.6, 1.3);
      ctx.fillStyle = css(cc, (0.75 - n * 0.55).toFixed(3));
      ctx.beginPath();
      ctx.ellipse(cx, cy, 46 * s, 14 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(cx - 16 * s, cy - 8 * s, 20 * s, 14 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 12 * s, cy - 11 * s, 24 * s, 17 * s, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ===== EFFECTS =====
  /* ================================================================
     Effects: pop-in, ground ring, dust puffs
     ================================================================ */
  const puffs = [];
  const rings = [];
  function spawnRing(x, y, w, d) { rings.push({ x: x + w / 2, y: y + d / 2, s: Math.max(w, d), t: 0 }); }
  function spawnPuff(x, y, w, d) {
    const n = reduced ? 6 : 16;
    for (let q = 0; q < n; q++) {
      const a = Math.random() * Math.PI * 2, sp = 0.3 + Math.random() * 0.6;
      puffs.push({

  // ===== SIM =====

  const WALK_SPEED = 1.6;                 // tiles per second

  const DISHES = [

    { id: 'dish_02', name: 'Peach Pancake Stack', suggest: 18, cost: 6, cook: 7, unlock: 1, cols: ['#f2c99a', '#ffb5a7', '#fff6ea'] },
    { id: 'dish_03', name: 'Mint Noodle Soup', suggest: 24, cost: 9, cook: 9, unlock: 1, cols: ['#b8e0d2', '#fff1d6', '#f2b09c'] },
    { id: 'dish_04', name: 'Lantern Dumplings', suggest: 30, cost: 11, cook: 10, unlock: 3, cols: ['#fff1e2', '#f6d27a', '#ffb5a7'] },
    { id: 'dish_05', name: 'Cloud Curry Plate', suggest: 38, cost: 14, cook: 12, unlock: 6, cols: ['#fff6ea', '#f2c46d', '#b8e0d2'] },
    { id: 'dish_06', name: 'Moonberry Parfait', suggest: 46, cost: 16, cook: 14, unlock: 10, cols: ['#cdb4db', '#fff6ea', '#f4a6b8'] }

  const DISH_BY_ID = {};
  for (const d of DISHES) DISH_BY_ID[d.id] = d;
  const PRICE_RANGE = 0.3;            // players may set prices within ±30% of the suggestion
  // whole coins, rounded inward so the limit is never exceeded

  /* keeps the menu valid: known, unlocked, unique dishes, prices in range, within the slot count, never empty */

  const SHIRTS = ['#ff9fb2', '#7fb8e6', '#f6d27a', '#ffb5a7', '#e8a06a', '#a8d58f'].map(rgb);   // none near the staff lavender and mint
  const PANTS = ['#8e7cc3', '#7a9cc6', '#a98f80', '#6f9e95'].map(rgb);
  const SKINS = ['#ffdcc4', '#f1c3a0', '#d9a07c', '#b57a5a'].map(rgb);
  const HAIRS = ['#7a5a6e', '#a9785c', '#5e5a7a', '#e2b38a', '#c97b7b', '#e8a5b4', '#a99bc4'].map(rgb);
  const PLATE = rgb('#eadccd');
  const DOOR_IN = { x: DOOR.x + 0.5, y: 0.1 };   // threshold, just inside the door
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  function shuffle(a) {
    for (let q = a.length - 1; q > 0; q--) { const r = Math.floor(Math.random() * (q + 1)); const t = a[q]; a[q] = a[r]; a[r] = t; }
    return a;
  }

  let customers = [];
  let orders = [];          // customers whose order waits for a free counter
  let ready = [];           // cooked plates waiting for a waiter: { cust, dish, fx, fy }
  const pops = [];          // "+coins" pops
  let coins = 0;
  let shownCoins = 0;       // HUD value, catches up as flying coins land
  const coinFlights = [];
  let dirtLevel = 0;       // 0..100, fed by the trash system in Phase 3
  const TRASH_LIMIT = 60;
  let doorOpen = 0;
  let spawnTimer = 2;
  const stats = { served: 0, left: 0 };

  function spawnCustomer() {
    customers.push({
      x: DOOR_IN.x, y: DOOR_IN.y, alpha: 0, state: 'enter', path: [[DOOR.x + 0.5, DOOR.y + 0.5]],
      seat: null, rec: '', table: null, dish: null, t: 0, seated: false, moving: false,
      shirt: pick(SHIRTS), pants: pick(PANTS), skin: pick(SKINS), hair: pick(HAIRS),
      hairStyle: pick(HAIR_STYLES), eye: Math.floor(Math.random() * EYE_COLS.length), face: pick(FACES), acc: pick(ACCS),
      ph: Math.random() * 6, bubble: null, hx: 0, hy: 0
    });
  }
  const chairs = () => items.filter((it) => it.id === 'chair_01');
  const tileOf = (c) => [clamp(Math.floor(c.x), 0, N - 1), clamp(Math.floor(c.y), 0, N - 1)];

  function walkTo(c, gx, gy) {
    const [sx, sy] = tileOf(c);
    const p = astar(sx, sy, gx, gy, blockedGrid());
    if (!p) return false;
    c.path = p.length > 1 ? p.slice(1).map(([x, y]) => [x + 0.5, y + 0.5]) : [[gx + 0.5, gy + 0.5]];
    return true;
  }
  /* moves along the path; true once the last point is reached */
  function stepPath(c, dt, speed) {

    const [tx, ty] = c.path[0];
    const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy);

    c.ph += dt * 10;
